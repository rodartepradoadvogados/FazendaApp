<!doctype html>
<html lang="pt-BR" data-theme="claro" data-paleta="azul">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excluir lançamentos — mockup navegável</title>
<style>
/* Tokens ESPELHADOS de frontend/app/globals.css (tema claro/escuro + paleta AZUL).
   Nenhum valor novo: só os nomes e valores que o app já usa. */
:root, :root[data-theme="claro"] {
  color-scheme: light;
  --pasture: #4E7A5A;
  --vinho: #0B2038;        /* paleta azul: marinho */
  --vinho-light: #2C4A6B;
  --vinho-dark: #071A2E;
  --dourado: #B9831F;
  --dourado-light: #E0A63C;
  --bg: #F1F1EF;
  --surface: #FFFFFF;
  --surface-2: #E9E9E6;
  --border: #DBDBD7;
  --border-strong: #C7C7C2;
  --text: #1E1B18;
  --text-muted: #6E665C;
  --green: color-mix(in srgb, var(--pasture) 80%, black);
  --green-light: var(--pasture);
  --red: #A8341C;
  --amber: #D97706;
  --blue: #1E6FA8;
  --alert-fg: var(--red);
  --overlay: rgba(30, 20, 25, 0.45);
  --thead-bg: #F1F4F8;
  --thead-fg: var(--vinho);
  --r-sm: 2px;
  --shadow-sm: 0 1px 4px rgba(20, 30, 45, 0.10);
}
:root[data-theme="escuro"] {
  color-scheme: dark;
  --bg: color-mix(in srgb, var(--vinho) 12%, #050304);
  --surface: color-mix(in srgb, var(--vinho) 14%, #0F0A0C);
  --surface-2: color-mix(in srgb, var(--vinho) 16%, #170F13);
  --border: color-mix(in srgb, var(--vinho) 22%, #2A1A20);
  --border-strong: color-mix(in srgb, var(--vinho) 30%, #3A2A30);
  --text: #F0E8EC;
  --text-muted: #9B8A91;
  --alert-fg: #E07070;
  --overlay: rgba(0, 0, 0, 0.7);
  --thead-bg: linear-gradient(135deg, var(--vinho), var(--vinho-dark));
  --thead-fg: var(--dourado-light);
}

/* Mockup "Excluir lançamentos" — só tokens do app (ver tokens.css). Cantos de 2 px, sem gradiente, sem sombra extra, hover só troca cor. */
*, *::before, *::after { box-sizing: border-box; }
:root { --ease: cubic-bezier(0.16, 1, 0.3, 1); --font-heading: Archivo, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; --side-w: 220px; }
html { -webkit-text-size-adjust: 100%; }
html, body { max-width: 100%; overflow-x: hidden; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 0.875rem/1.5 var(--font-heading); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4, p, ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
::selection { background: color-mix(in srgb, var(--dourado) 35%, transparent); }
:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--dourado-light); }
[tabindex="-1"]:focus-visible { box-shadow: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--text-muted); }
.num { font-variant-numeric: tabular-nums; }
.caps { font: 600 0.6875rem/1.2 var(--font-heading); letter-spacing: 0.13em; text-transform: uppercase; }
svg.ic { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- barra do mockup (não faz parte do app) ---------- */
.mk { background: var(--surface-2); border-bottom: 1px dashed var(--border-strong); padding: 6px 16px; font-size: 0.78rem; }
.mk summary { display: flex; align-items: center; gap: 10px; cursor: pointer; min-height: 32px; list-style: none; }
.mk summary::-webkit-details-marker { display: none; }
.mk-tag { background: var(--vinho); color: #fff; padding: 1px 8px; border-radius: 2px; font-weight: 600; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; }
.mk-body { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 6px 0 8px; }
.mk-grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.mk select { min-height: 32px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 2px; padding: 0 8px; max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 2px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 0 12px; min-height: 32px; font-weight: 600; font-size: 0.78rem; color: var(--text-muted); }
.seg button + button { border-left: 1px solid var(--border-strong); }
.seg button[aria-pressed="true"] { background: var(--vinho); color: #fff; }
.seg button:hover:not([aria-pressed="true"]) { background: var(--surface-2); color: var(--text); }
.mk-reset { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 2px; min-height: 32px; padding: 0 12px; font-weight: 600; font-size: 0.78rem; }
.mk-reset:hover { background: var(--bg); }

/* ---------- casca do app ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: calc(100vh - 41px); }
.side { background: var(--vinho); color: #F5EEF1; padding: 18px 12px; position: sticky; top: 0; align-self: start; height: 100vh; }
.brand { font: 800 1.1rem/1 var(--font-heading); letter-spacing: -0.02em; color: var(--dourado-light); padding: 4px 8px 18px; }
.brand small { display: block; font: 600 0.6rem/1 var(--font-heading); letter-spacing: 0.2em; color: rgba(245, 238, 241, 0.7); margin-top: 6px; text-transform: uppercase; }
.side nav a { display: block; padding: 9px 10px; border-radius: 2px; color: rgba(245, 238, 241, 0.78); text-decoration: none; font-weight: 600; font-size: 0.84rem; border: 1px solid transparent; }
.side nav a[aria-current="page"] { background: #12283F; color: var(--dourado-light); border-color: var(--dourado); }
.side nav a:hover:not([aria-current]) { background: rgba(255, 255, 255, 0.08); }
.topm { display: none; background: var(--vinho); color: var(--dourado-light); padding: 10px 16px; font: 800 1rem/1 var(--font-heading); }
.main { padding: 22px 28px 140px; min-width: 0; }
.pg { max-width: 1160px; margin: 0 auto; }

/* ---------- cabeçalho da tela ---------- */
.crumb { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 6px; }
h1 { font: 700 1.75rem/1.15 var(--font-heading); letter-spacing: -0.02em; }
.lead { color: var(--text-muted); max-width: 68ch; margin-top: 6px; }
.role { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 5px 12px; border: 1px solid var(--border-strong); border-radius: 999px; background: var(--surface); font-weight: 600; font-size: 0.78rem; }
.role.admin .ic { color: var(--green-light); }
.role.func .ic { color: var(--blue); }
.tabs { display: flex; gap: 6px; margin: 18px 0 16px; flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
.tab { border: 1px solid var(--border-strong); background: transparent; color: var(--text-muted); border-radius: 999px; min-height: 40px; padding: 0 16px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.tab:hover:not([aria-selected="true"]) { background: var(--surface-2); color: var(--text); }
.tab[aria-selected="true"] { background: var(--vinho); border-color: var(--vinho); color: var(--dourado-light); font-weight: 700; }
.badge { background: var(--red); color: #fff; border-radius: 999px; min-width: 20px; height: 20px; padding: 0 6px; font-size: 0.7rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }

/* ---------- etapas ---------- */
.steps ol { display: flex; gap: 0; margin-bottom: 18px; }
.steps li { flex: 1; display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-weight: 600; font-size: 0.8rem; min-width: 0; }
.steps li + li::before { content: ""; flex: 1; height: 1px; background: var(--border-strong); min-width: 12px; margin-right: 8px; }
.steps .dot { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border-strong); display: grid; place-items: center; font-size: 0.72rem; font-weight: 700; flex: none; background: var(--surface); }
.steps li.cur { color: var(--text); }
.steps li.cur .dot { background: var(--vinho); border-color: var(--vinho); color: var(--dourado-light); }
.steps li.done .dot { background: var(--green); border-color: var(--green); color: #fff; }
.steps .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- escolher o que (trilho) + quais ---------- */
.pick { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 20px; align-items: start; }
.h-sec { font: 600 0.6875rem/1.2 var(--font-heading); letter-spacing: 0.13em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
.h-sec b { color: var(--text); }
.search { position: relative; margin-bottom: 8px; }
.search .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
input[type="text"], input[type="search"], input[type="date"], input[type="number"], select, textarea { width: 100%; min-height: 40px; background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); border-radius: 2px; padding: 0 10px; font-size: 0.875rem; }
textarea { padding: 8px 10px; min-height: 72px; resize: vertical; }
.search input { padding-left: 34px; }
input::placeholder, textarea::placeholder { color: var(--text-muted); opacity: 1; }
.todos { width: 100%; text-align: left; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; background: var(--surface); border: 1px dashed var(--border-strong); border-radius: 2px; font-weight: 600; color: var(--text); margin-bottom: 10px; }
.todos:hover { background: var(--surface-2); }
.todos[aria-current="true"] { background: var(--vinho); color: var(--dourado-light); border-style: solid; border-color: var(--vinho); }
.dom { border: 1px solid var(--border); background: var(--surface); border-radius: 2px; margin-bottom: 8px; }
.dom.cad { margin-top: 14px; background: color-mix(in srgb, var(--amber) 6%, var(--surface)); border-color: color-mix(in srgb, var(--amber) 40%, var(--border)); }
.dom-h { width: 100%; display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 8px; min-height: 52px; padding: 6px 12px; background: none; border: 0; text-align: left; }
.dom-h:hover { background: var(--surface-2); }
.dom-n { font: 700 0.9rem/1.2 var(--font-heading); display: block; }
.dom-d { display: block; font-size: 0.75rem; color: var(--text-muted); font-weight: 400; }
.cnt { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); font-variant-numeric: tabular-nums; background: var(--surface-2); border-radius: 999px; padding: 1px 8px; }
.dom-h .ic { transition: transform 0.2s var(--ease); color: var(--text-muted); }
.dom-h[aria-expanded="true"] .ic { transform: rotate(180deg); }
.cad-nota { font-size: 0.78rem; padding: 0 12px 8px; color: color-mix(in srgb, var(--amber) 55%, var(--text)); display: flex; gap: 6px; }
.tipos { border-top: 1px solid var(--border); }
.tipos[hidden] { display: none; }
.tipo { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; min-height: 48px; padding: 7px 12px; background: none; border: 0; border-top: 1px solid var(--border); }
.tipos li:first-child .tipo { border-top: 0; }
.tipo:hover { background: var(--surface-2); }
.tipo[aria-current="true"] { background: var(--vinho); color: #fff; }
.tipo[aria-current="true"] .th, .tipo[aria-current="true"] .cnt { color: rgba(255, 255, 255, 0.82); }
.tipo[aria-current="true"] .cnt { background: rgba(255, 255, 255, 0.14); }
.tn { font-weight: 600; }
.th { grid-column: 1 / -1; font-size: 0.75rem; color: var(--text-muted); }
.tdom { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }

.vazio { border: 1px dashed var(--border-strong); background: var(--surface-2); border-radius: 2px; padding: 28px 22px; }
.vazio h2 { font: 700 1.05rem/1.3 var(--font-heading); margin-bottom: 6px; }
.vazio ul { margin-top: 12px; display: grid; gap: 8px; }
.vazio li { display: flex; gap: 8px; color: var(--text-muted); }
.vazio li .ic { color: var(--dourado); margin-top: 3px; }

.tipo-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.tipo-bar h2 { font: 700 1.1rem/1.2 var(--font-heading); }
.link { background: none; border: 0; color: var(--vinho-light); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; padding: 8px 4px; min-height: 40px; }
:root[data-theme="escuro"] .link { color: var(--dourado-light); }
.link:hover { color: var(--text); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; box-shadow: var(--shadow-sm); }
.filtros { padding: 14px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 14px; margin-bottom: 14px; }
.fld { min-width: 0; }
.fld.w2 { grid-column: span 2; }
.fld.w4 { grid-column: 1 / -1; }
.fld > label, .fld > legend { display: block; font-size: 0.72rem; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; padding: 0; }
fieldset.fld { border: 0; margin: 0; padding: 0; min-width: 0; }
.rs-seg { display: flex; flex-wrap: wrap; gap: 6px; }
.rs-seg label { position: relative; }
.rs-seg input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.rs-seg span { display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border: 1px solid var(--border-strong); border-radius: 999px; font-weight: 600; font-size: 0.8rem; background: var(--surface); color: var(--text-muted); }
.rs-seg input:checked + span { background: var(--vinho); color: var(--dourado-light); border-color: var(--vinho); }
.rs-seg input:focus-visible + span { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--dourado-light); }
.rs-seg input:not(:checked) + span:hover { background: var(--surface-2); color: var(--text); }
.val2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.filtros-f { display: flex; justify-content: space-between; align-items: center; grid-column: 1 / -1; gap: 10px; flex-wrap: wrap; }

.res-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--thead-bg); color: var(--thead-fg); }
.res-h .all { display: flex; align-items: center; gap: 4px; font: 600 0.6875rem/1 var(--font-heading); letter-spacing: 0.13em; text-transform: uppercase; }
.res-h select { width: auto; min-height: 36px; font-size: 0.8rem; }
.ord { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; }
.res { padding: 0; overflow: hidden; }
.res ul { }
.ck { display: grid; place-items: center; width: 44px; min-height: 44px; cursor: pointer; }
input[type="checkbox"] { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; border: 2px solid var(--border-strong); border-radius: 2px; background: var(--surface); margin: 0; cursor: pointer; display: grid; place-content: center; transition: background 0.12s, border-color 0.12s; }
input[type="checkbox"]::after { content: ""; width: 10px; height: 6px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px, -1px) scale(0); transition: transform 0.12s var(--ease); }
input[type="checkbox"]:checked { background: var(--dourado); border-color: var(--dourado); }
input[type="checkbox"]:checked::after { transform: rotate(-45deg) translate(1px, -1px) scale(1); }
.row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; border-top: 1px solid var(--border); background: var(--surface); transition: background 0.12s; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--surface-2); }
.row.is-sel { background: color-mix(in srgb, var(--vinho-light) 11%, var(--surface)); }
.rmain { padding: 10px 8px 10px 0; min-width: 0; }
.rt { font-weight: 700; overflow-wrap: anywhere; }
.rs { font-size: 0.78rem; color: var(--text-muted); overflow-wrap: anywhere; }
.rc { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.rside { text-align: right; padding: 10px 14px 10px 6px; display: grid; justify-items: end; align-content: start; gap: 2px; }
.rside strong { font-variant-numeric: tabular-nums; }
.rexp { grid-column: 2 / -1; padding: 0 14px 12px 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border: 1px solid var(--border-strong); border-radius: 999px; font-size: 0.72rem; font-weight: 600; background: var(--surface); color: var(--text-muted); line-height: 1.5; }
.chip .ic { width: 12px; height: 12px; }
.chip.red { color: var(--alert-fg); border-color: color-mix(in srgb, var(--red) 55%, var(--border)); background: color-mix(in srgb, var(--red) 9%, var(--surface)); }
.chip.amber { color: color-mix(in srgb, var(--amber) 52%, var(--text)); border-color: color-mix(in srgb, var(--amber) 55%, var(--border)); background: color-mix(in srgb, var(--amber) 9%, var(--surface)); }
.chip.green { color: color-mix(in srgb, var(--green-light) 62%, var(--text)); border-color: color-mix(in srgb, var(--green-light) 50%, var(--border)); background: color-mix(in srgb, var(--green-light) 9%, var(--surface)); }
.chip.blue { color: color-mix(in srgb, var(--blue) 60%, var(--text)); border-color: color-mix(in srgb, var(--blue) 50%, var(--border)); background: color-mix(in srgb, var(--blue) 8%, var(--surface)); }
.exp { background: none; border: 0; display: inline-flex; align-items: center; gap: 4px; padding: 4px 0; min-height: 32px; color: var(--vinho-light); font-weight: 600; font-size: 0.78rem; }
:root[data-theme="escuro"] .exp { color: var(--dourado-light); }
.exp:hover { color: var(--text); }
.exp .ic { transition: transform 0.2s var(--ease); width: 14px; height: 14px; }
.exp[aria-expanded="true"] .ic { transform: rotate(180deg); }
.parc { width: 100%; border-collapse: collapse; font-size: 0.8rem; background: var(--surface); border: 1px solid var(--border); }
.parc th { text-align: left; background: var(--thead-bg); color: var(--thead-fg); font: 600 0.6875rem/1 var(--font-heading); letter-spacing: 0.13em; text-transform: uppercase; padding: 7px 10px; }
.parc td { padding: 7px 10px; border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; white-space: nowrap; }
.parc td:nth-child(3), .parc th:nth-child(3) { text-align: right; }
.parc-n { font-size: 0.76rem; color: var(--text-muted); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.mais { padding: 10px 14px; border-top: 1px solid var(--border); text-align: center; }
.sem-res { padding: 26px 18px; text-align: center; color: var(--text-muted); }
.sem-res strong { display: block; color: var(--text); margin-bottom: 4px; }

/* ---------- bandeja de seleção ---------- */
.tray { position: fixed; left: var(--side-w); right: 0; bottom: 0; z-index: 20; transform: translateY(110%); opacity: 0; transition: transform 0.2s var(--ease), opacity 0.2s; pointer-events: none; background: var(--surface); border-top: 1px solid var(--border-strong); box-shadow: 0 -1px 4px rgba(20, 30, 45, 0.10); }
.tray.on { transform: none; opacity: 1; pointer-events: auto; }
.tray-in { max-width: 1160px; margin: 0 auto; padding: 10px 28px calc(10px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 12px; }
.tray-t { flex: 1; min-width: 0; }
.tray-t strong { display: block; }
.tray-t span { font-size: 0.78rem; color: var(--text-muted); }

.filtros .filtros-t { display: none; }
/* ---------- botões ---------- */
.btn { min-height: 44px; padding: 0 18px; border-radius: 2px; border: 1px solid var(--border-strong); background: transparent; color: var(--text); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; transition: background 0.15s, color 0.15s, border-color 0.15s; }
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn-pri { background: var(--vinho); border-color: var(--vinho-light); color: #fff; }
.btn-pri:hover:not(:disabled) { background: color-mix(in srgb, var(--vinho) 85%, black); }
.btn-danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn-danger:hover:not(:disabled) { background: color-mix(in srgb, var(--red) 85%, black); }
.btn-gold { background: var(--dourado); border-color: var(--dourado); color: #fff; }
.btn-gold:hover:not(:disabled) { background: color-mix(in srgb, var(--dourado) 85%, black); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-sm { min-height: 40px; padding: 0 14px; font-size: 0.8rem; }
.btn-block { width: 100%; }

/* ---------- impacto ---------- */
.imp { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
.imp-col { display: grid; gap: 12px; min-width: 0; }
.back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 8px; }
h2.h2 { font: 700 1.3rem/1.2 var(--font-heading); letter-spacing: -0.01em; margin-bottom: 4px; outline: none; }
.resumo { padding: 16px 18px; }
.resumo-f { font-size: 1.05rem; line-height: 1.5; max-width: 62ch; }
.resumo-f b { font-weight: 800; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.stat { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 999px; background: var(--surface); font-weight: 600; font-size: 0.8rem; }
.stat:hover { background: var(--surface-2); }
.stat b { font-variant-numeric: tabular-nums; }
.stat.zero { color: var(--text-muted); font-weight: 400; }
.esc { padding: 0; }

.ent { padding: 12px 16px; border-top: 1px solid var(--border); }

/* ---------- decisão ---------- */
.decide { position: sticky; top: 16px; padding: 16px; display: grid; gap: 14px; }

.note { margin: 0 22px 14px; padding: 10px 12px; border: 1px solid color-mix(in srgb, var(--amber) 55%, var(--border)); background: color-mix(in srgb, var(--amber) 8%, var(--surface)); border-radius: 2px; display: flex; gap: 10px; align-items: flex-start; }
.note .ic { margin-top: 3px; color: color-mix(in srgb, var(--amber) 55%, var(--text)); }
.note.bl { border-color: color-mix(in srgb, var(--blue) 45%, var(--border)); background: color-mix(in srgb, var(--blue) 7%, var(--surface)); }
.note.bl .ic { color: color-mix(in srgb, var(--blue) 62%, var(--text)); }
.note.rd { border-color: color-mix(in srgb, var(--red) 50%, var(--border)); background: color-mix(in srgb, var(--red) 7%, var(--surface)); }
.note.rd .ic { color: var(--alert-fg); }
.tl { display: grid; gap: 0; padding: 0 22px 14px; }
.tl li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding-bottom: 12px; position: relative; color: var(--text-muted); }
.tl li::before { content: ""; position: absolute; left: 10px; top: 20px; bottom: 0; width: 1px; background: var(--border-strong); }
.tl li:last-child::before { display: none; }
.tl .p { width: 21px; height: 21px; border-radius: 50%; border: 1px solid var(--border-strong); background: var(--surface); display: grid; place-items: center; }
.tl .p .ic { width: 12px; height: 12px; }
.tl li.on { color: var(--text); font-weight: 600; }
.tl li.on .p { background: var(--green); border-color: var(--green); color: #fff; }

/* ---------- pedidos / trilha ---------- */
.lista-h { display: flex; justify-content: space-between; align-items: end; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.ped { margin-bottom: 12px; }

.tr-h { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; background: none; border: 0; padding: 12px 16px; min-height: 56px; }

/* ---------- esqueleto, toast ---------- */
.sk { display: grid; gap: 12px; }
.sk div { height: 76px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--border); }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
#toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 50; pointer-events: none; display: grid; gap: 6px; width: min(92vw, 520px); }
.toast { background: var(--vinho); color: #fff; border: 1px solid var(--vinho-light); padding: 10px 14px; border-radius: 2px; box-shadow: var(--shadow-sm); font-size: 0.84rem; }

/* ---------- movimento (≤300 ms, propósito: orientar) ---------- */
@media (prefers-reduced-motion: no-preference) {
  .sk div { animation: pulse 1.1s ease-in-out infinite; }
  .enter .anim { animation: rise 0.22s var(--ease) both; animation-delay: calc(var(--i, 0) * 40ms); }

  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes carimbo { from { opacity: 0; transform: rotate(-9deg) scale(1.18); } to { opacity: 0.9; transform: rotate(-4deg) scale(1); } }

}

  .tab, .btn, .stat { min-height: 44px; }
}

<script>
/* DADOS FICTÍCIOS — nenhum CPF, nome real de cliente ou dado da fazenda. */
const HOJE = '2026-10-09';
const AGORA = '2026-10-09T14:32';

const brl = (n) => (n < 0 ? '−' : '') + 'R$ ' + Math.abs(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dbr = (iso) => { if (!iso) return '—'; const [y, m, d] = iso.slice(0, 10).split('-'); return `${d}/${m}/${y}`; };
const dcurta = (iso) => { if (!iso) return '—'; const [y, m, d] = iso.slice(0, 10).split('-'); return `${d}/${m}`; };
const hbr = (iso) => iso.length > 10 ? iso.slice(11, 16) : '';
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

/* ---------- DOMÍNIOS e TIPOS ---------- */
const DOMINIOS = [
  { id: 'fin', nome: 'Financeiro', dica: 'Notas, parcelas, compras e vendas', tipos: ['financeiro', 'compra_animal', 'venda_animal', 'compra_semen'] },
  { id: 'reb', nome: 'Rebanho', dica: 'Animais, partos, inseminações, leite', tipos: ['animal', 'parto', 'servico', 'secagem', 'controle', 'movimento_lote'] },
  { id: 'san', nome: 'Sanidade', dica: 'Remédios, vacinas, protocolos, exames', tipos: ['sanidade', 'protocolo_sanitario_lancamento', 'protocolo_iatf_lancamento', 'exame_resultado'] },
  { id: 'pes', nome: 'Pessoal', dica: 'Vales, folha e diárias', tipos: ['vale', 'folha', 'diaria_pagamento'] },
  { id: 'est', nome: 'Estoque', dica: 'Entradas e saídas feitas à mão', tipos: ['movimento_estoque'] },
  { id: 'cad', nome: 'Cadastros', dica: 'Lotes, pessoas, fornecedores, doenças', cad: true, tipos: ['lote', 'pessoa', 'fornecedor', 'doenca'] },
];

/* filtros: quais campos aparecem para cada tipo */

/* ---------- construtores de impacto ---------- */
const P = (n, venc, valor, paga, pagoEm, conta) => ({ n, venc, valor, paga: !!paga, pagoEm, conta });
const ap = (t, c, o = {}) => ({ t, c, n: o.n ?? 1, din: o.din || 0, filhos: o.filhos || [], chip: o.chip });
const rv = (t, c, o = {}) => ({ t, c, filhos: o.filhos || [], chip: o.chip });
const av = (t, c, o = {}) => ({ t, c, filhos: o.filhos || [] });
const bq = (t, c, fazer, acao) => ({ t, c, fazer, acao });

function sitFin(it) {
  const ps = it.parcelas;
  const pagas = ps.filter((p) => p.paga).length;
  if (pagas === ps.length) return 'paga';
  if (pagas > 0) return 'parcial';
  if (ps.some((p) => p.venc < HOJE)) return 'atrasada';
  return 'aberta';
}

/* Gera o impacto de uma nota financeira a partir das parcelas e do que ela trouxe junto. */
function finImp(it, o = {}) {
  const ps = it.parcelas, tot = ps.length;
  const pagas = ps.filter((p) => p.paga);
  const abertas = ps.filter((p) => !p.paga);
  const verbo = it.receita ? 'entraram no' : 'saíram do';
  const imp = { bloqueia: [], apagar: [], reverter: [], avisos: [] };
  if (pagas.length) {
    const soma = pagas.reduce((s, p) => s + p.valor, 0);
    imp.bloqueia.push(bq(
      pagas.length === 1 ? `Parcela ${pagas[0].n}/${tot} já foi ${it.receita ? 'recebida' : 'paga'}` : `${pagas.length} parcelas já foram ${it.receita ? 'recebidas' : 'pagas'}`,
      `${brl(soma)} ${verbo} caixa (${pagas.map((p) => p.conta + ', ' + dcurta(p.pagoEm)).join(' · ')}). Se a nota sumir agora, o saldo da conta e o relatório do mês ficam errados.`,
      `${it.receita ? 'Desfaça o recebimento' : 'Estorne o pagamento'} ${pagas.length === 1 ? 'da parcela ' + pagas[0].n + '/' + tot : 'das ' + pagas.length + ' parcelas'} primeiro. Depois volte aqui.`,
      pagas.length === 1 ? `Abrir parcela ${pagas[0].n}/${tot}` : 'Abrir pagamentos',
    ));
  }
  imp.apagar.push(ap(`Nota ${it.num}`, `${it.titulo.split('·')[1].trim()} — a nota deixa de existir.`));
  imp.apagar.push(ap(`${tot} ${tot === 1 ? 'parcela' : 'parcelas'}`, `${brl(abertas.reduce((s, p) => s + p.valor, 0))} saem ${it.receita ? 'das contas a receber' : 'das contas a pagar'}.`, {
    n: tot, din: abertas.reduce((s, p) => s + p.valor, 0),
    filhos: ps.map((p) => `${p.n}/${tot} · vence ${dbr(p.venc)} · ${brl(p.valor)} · ${p.paga ? (it.receita ? 'RECEBIDA' : 'PAGA') + ' em ' + dbr(p.pagoEm) : 'em aberto'}`),
  }));
  if (o.produtos && o.produtos.length) {
    imp.apagar.push(ap(`${o.produtos.length} ${o.produtos.length === 1 ? 'produto lançado' : 'produtos lançados'} na nota`, 'Linhas de produto da nota.', { n: o.produtos.length, filhos: o.produtos.map((p) => `${p.nome} · ${p.qtd} ${p.un}`) }));
    o.produtos.forEach((p) => {
      imp.reverter.push(rv(`Estoque de ${p.nome}`, `Os ${p.qtd} ${p.un} que entraram com esta nota saem do estoque: o saldo vai de ${p.de} para ${p.para}.`, { chip: 'Mexe no estoque' }));
      if (p.para < 0) imp.avisos.push(av(`Estoque de ${p.nome} vai ficar negativo (${p.para})`, `Já foi usado mais do que sobrou. O sistema apaga assim mesmo e deixa o saldo em ${p.para}. Confira o estoque depois.`));
    });
  }
  if (o.anexos) imp.apagar.push(ap(`${o.anexos.length} ${o.anexos.length === 1 ? 'anexo' : 'anexos'}`, 'O arquivo também sai do armazenamento.', { filhos: o.anexos, n: o.anexos.length }));
  if (o.vale) {
    imp.apagar.push(ap(`Vale nº ${o.vale.num} de ${o.vale.quem}`, `O vale de ${brl(o.vale.valor)} que esta nota gerou também é apagado.`));
    imp.reverter.push(rv('Empreitada: ' + o.vale.empreitada, `O abatimento de ${brl(o.vale.valor)} some: a parcela da empreitada volta de ${brl(o.vale.de)} para ${brl(o.vale.para)} a pagar.`, { chip: 'Desfaz abatimento' }));
    imp.reverter.push(rv(`Conta corrente de ${o.vale.quem}`, `O vale sai do saldo: ${o.vale.quem} deixa de dever ${brl(o.vale.valor)}.`));
  }
  if (o.fatura) imp.avisos.push(av(`Fatura ${o.fatura.num} muda`, `Esta nota sai da fatura. O total cai de ${brl(o.fatura.de)} para ${brl(o.fatura.para)}.`));
  const mes = MESES[parseInt(it.data.slice(5, 7), 10) - 1];
  if (!pagas.length) imp.avisos.push(av(`Relatório de ${mes} muda`, `${it.receita ? 'A receita' : 'A despesa'} de ${brl(it.valor)} deixa de aparecer em ${mes}.`));
  it.imp = imp;
  return it;
}
const nota = (id, num, desc, parte, data, valor, parcelas, o = {}) => finImp({ id, tipo: 'financeiro', num, titulo: `${num} · ${desc}`, sub: parte, data, valor, parte, parcelas, receita: !!o.receita, editar: 'Financeiro › Contas a pagar' }, o);

/* ================= regras de impacto e risco ================= */
function totaisImp(it) {
  const a = it.imp.apagar;
  return { n: a.reduce((s, x) => s + (x.n || 1), 0), din: a.reduce((s, x) => s + (x.din || 0), 0), rev: it.imp.reverter.length, av: it.imp.avisos.length };
}
function riscoItem(it) {

  if (t.rev > 0 || t.din > 0 || t.n > 1) return 'medio';
  return 'baixo';
}
const ORDEM_R = { baixo: 0, medio: 1, alto: 2 };
function riscoDe(itens) {
  let r = 'baixo';
  itens.forEach((i) => { const x = riscoItem(i); if (ORDEM_R[x] > ORDEM_R[r]) r = x; });
  if (itens.length >= 10) r = 'alto';
  else if (itens.length >= 2 && r === 'baixo') r = 'medio';
  return r;
}
function porque(itens) {
  const p = new Set();
  itens.forEach((i) => {
    if (i.porque) p.add(i.porque);
    const t = totaisImp(i);
    if (!i.porque) {
      if (t.din > 0) p.add('tem dinheiro em aberto');
      if (t.rev > 0) p.add('mexe em outros dados (estoque, lactação, saldos)');
      if (t.n > 1 && t.n < 10) p.add(`apaga ${t.n} registros`);
      if (t.n >= 10) p.add(`apaga ${t.n} registros`);
    }

  return [...p];
}
function analisa(ids) {
  const itens = ids.map(getItem).filter(Boolean);
  const bloq = itens.filter((i) => i.imp.bloqueia.length);
  const exec = itens.filter((i) => !i.imp.bloqueia.length);
  const tot = exec.reduce((a, i) => { const t = totaisImp(i); a.n += t.n; a.din += t.din; a.rev += t.rev; a.av += t.av; return a; }, { n: 0, din: 0, rev: 0, av: 0 });

}
const RISCO_TXT = {

/* ================= busca e filtros ================= */
function sitFinTxt(it) { return sitFin(it); }
function filtrar() {
  const f = S.f;
  let arr = S.tipo === 'todos' ? ITENS.filter((i) => !TIPOS[i.tipo].cad) : ITENS.filter((i) => i.tipo === S.tipo);
  const q = norm(f.q);
  if (q) arr = arr.filter((i) => q.split(/\s+/).every((w) => norm(i.titulo + ' ' + i.sub + ' ' + (i.parte || '')).includes(w)));
  if (f.ini) arr = arr.filter((i) => !i.data || i.data >= f.ini);
  if (f.fim) arr = arr.filter((i) => !i.data || i.data <= f.fim);
  if (f.parte) arr = arr.filter((i) => i.parte === f.parte);
  if (f.vmin !== '') arr = arr.filter((i) => (i.valor || 0) >= Number(f.vmin));
  if (f.vmax !== '') arr = arr.filter((i) => (i.valor || 0) <= Number(f.vmax));
  if (f.sit !== 'todas') {
    arr = arr.filter((i) => {
      if (i.tipo !== 'financeiro') return true;
      const s = sitFin(i);
      if (f.sit === 'aberta') return s === 'aberta' || s === 'atrasada';
      if (f.sit === 'atrasada') return s === 'atrasada';
      if (f.sit === 'paga') return s === 'paga' || s === 'parcial';
      return true;
    });
  }
  arr = arr.slice();
  if (f.ord === 'valor') arr.sort((a, b) => (b.valor || 0) - (a.valor || 0));
  else if (f.ord === 'antigos') arr.sort((a, b) => (a.data || '').localeCompare(b.data || ''));

}

const cntTipo = (t) => ITENS.filter((i) => i.tipo === t).length;

/* ================= chips de consequência por linha ================= */
function chipsDe(it) {
  const out = [];
  const im = it.imp;
  if (it.tipo === 'financeiro') {
    const s = sitFin(it);
    if (s === 'atrasada') out.push(['red', 'Atrasada']);
    else if (s === 'aberta') out.push(['', 'Em aberto']);
    else if (s === 'parcial') out.push(['amber', 'Com parcela paga']);
    else out.push(['green', it.receita ? 'Toda recebida' : 'Toda paga']);
  }
  if (im.bloqueia.length) out.push(['red', 'Bloqueado: ' + im.bloqueia[0].t.toLowerCase()]);
  const chips = [...new Set(im.reverter.map((r) => r.chip).filter(Boolean))];
  if (chips.length) chips.forEach((c) => out.push(['amber', c]));
  else if (im.reverter.length) out.push(['amber', 'Reverte outros dados']);
  const t = totaisImp(it);
  if (t.n >= 5 && !im.bloqueia.length) out.push(['', `Apaga ${t.n} registros`]);
  if (riscoItem(it) === 'alto' && !im.bloqueia.length) out.push(['red', 'Risco alto']);
  const max = 4;
  const r = out.slice(0, max).map(([k, tx]) => `<span class="chip ${k}">${esc(tx)}</span>`).join('');
  return out.length > max ? r + `<span class="chip">+${out.length - max}</span>` : r;
}

/* ---------- pedidos ---------- */
function alvoExiste(p) { return !!(p.alvo && getItem(p.alvo)); }
function grupos() {

}
function pedidosAdmin() {

  gs.forEach((g, n) => { h += pedidoCard(g, n); });
  if (decididos.length) {

  }

const titPedido = (p) => (getItem(p.alvo) ? getItem(p.alvo).titulo : p.titulo || '(item)');
function statusChip(p) {
  if (p.status === 'pendente') return '<span class="chip blue">' + ic('clock') + ' Aguardando</span>';
  if (p.status === 'aprovada') return '<span class="chip green">' + ic('check') + ` Aprovado${p.decididoPor ? ' por ' + esc(p.decididoPor) : ''}</span>`;

  return '<span class="chip">' + esc(p.status) + '</span>';

function pedidoCard(g, n) {
  const key = 'g' + g.k;
  const aberto = !!S.aberto[key];
  const it = g.item;
  const A = it ? analisa([it.id]) : null;

  if (g.ps.some((p) => p.mudou)) chips.push(`<span class="chip amber">${ic('warn')} Mudou desde o pedido</span>`);
  if (g.sumiu) chips.push(`<span class="chip red">${ic('ban')} Item não existe mais</span>`);

/* ================= render ================= */
function build() {
  let corpo;
  if (S.aba === 'apagar') {
    corpo = steps() + (S.passo === 'pick' ? renderPick() : S.passo === 'impacto' ? renderImpacto() : renderPronto());
  } else if (S.aba === 'pedidos') corpo = S.papel === 'admin' ? pedidosAdmin() : meusPedidos();
  else corpo = trilhaHtml();
  return cabecalho() + `<div id="painel" role="tabpanel" aria-labelledby="tab-${S.aba}">${corpo}</div>`;
}
function render(o = {}) {
  const a = document.activeElement;
  const fid = a && a.closest && a.closest('#view') ? a.dataset.fid : null;
  const ss = fid && a.selectionStart != null ? [a.selectionStart, a.selectionEnd] : null;
  view.innerHTML = build();
  view.querySelectorAll('[data-act]').forEach((el) => { if (!el.dataset.fid) el.dataset.fid = el.dataset.act + '|' + (el.dataset.id || el.dataset.v || el.dataset.k || el.dataset.ctx || ''); });
  view.querySelectorAll('[data-in]').forEach((el) => { if (!el.dataset.fid) el.dataset.fid = 'in|' + el.dataset.in + '|' + (el.value || ''); });
  if (o.enter) { view.classList.add('enter'); clearTimeout(render.t); render.t = setTimeout(() => view.classList.remove('enter'), 900); }
  if (o.focus) {
    const el = view.querySelector(o.focus);
    if (el) el.focus({ preventScroll: !!o.noscroll });
  } else if (fid) {
    const el = view.querySelector(`[data-fid="${CSS.escape(fid)}"]`);
    if (el) { el.focus({ preventScroll: true }); if (ss) { try { el.setSelectionRange(ss[0], ss[1]); } catch (e) { /* tipo sem seleção */ } } }
  }
  if (view.classList.contains('enter')) animaNumeros();
  renderTray();
}
function animaNumeros() {
  if (reduz) return;
  view.querySelectorAll('[data-count]').forEach((el) => {
    const fim = Number(el.dataset.count), t0 = performance.now(), dur = 280;
    const passo = (t) => { const p = Math.min(1, (t - t0) / dur); el.textContent = Math.round(fim * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(passo); };
    el.textContent = '0'; requestAnimationFrame(passo);
  });
}

/* ================= ações ================= */
function irImpacto() {
  S.passo = 'impacto'; S.loadImp = true; S.conf = {}; S.col = {}; S.fil = {}; S.escAberto = false; S.flash = null;
  render({ enter: true, focus: '#h-imp' });
  window.scrollTo({ top: 0 });
  setTimeout(() => {
    S.loadImp = false;
    if (S.passo === 'impacto') { render({ enter: true, focus: '#h-imp', noscroll: true }); say(resumoVoz()); }
  }, reduz ? 60 : 260);
}
function resumoVoz() { const A = analisa(S.sel); return `Impacto calculado: ${A.tot.n} registros a apagar, ${A.tot.rev} ajustes, ${A.bloq.length} bloqueios. Risco ${A.risco}.`; }

function executar(modoAprovar, exec, motivo, pedidoDe) {
  const n = TRILHA.length + 91 - 6; // EX-2026-0091 em diante
  const id = 'EX-2026-' + String(n).padStart(4, '0');
  const tot = exec.reduce((a, i) => { const t = totaisImp(i); a.n += t.n; a.din += t.din; a.rev += t.rev; return a; }, { n: 0, din: 0, rev: 0 });
  const apagado = exec.flatMap((i) => i.imp.apagar.map((e) => e.t + (exec.length > 1 ? ` (${i.titulo})` : '')));
  const revertido = exec.flatMap((i) => i.imp.reverter.map((e) => `${e.t}: ${e.c}`));
  const ids = exec.map((i) => i.id);
  let encerrados = 0;
  ITENS = ITENS.filter((i) => !ids.includes(i.id));
  PEDIDOS.forEach((p) => { if (p.status === 'pendente' && ids.includes(p.alvo)) { encerrados++; p.status = 'aprovada'; p.decididoPor = EU(); p.decididoEm = AGORA; p.titulo = p.titulo || ''; p.encerrado = true; } });
  TRILHA.unshift({ id, quando: AGORA, quem: EU(), acao: pedidoDe ? 'aprovou' : 'apagou', pedidoDe, titulo: exec.length === 1 ? exec[0].titulo : `${exec.length} itens: ${exec.map((i) => i.titulo).join('; ')}`, tipo: exec[0].tipo, motivo, apagado, revertido });
  return { id, n: tot.n, din: tot.din, rev: tot.rev, apagado, revertido, encerrados: pedidoDe ? 0 : encerrados, ids };
}

const H = {

    renderTray(); say(`${S.sel.length} selecionados`);

  },

        PEDIDOS.unshift({ id: 'R' + (100 + PEDIDOS.length + k), alvo: it.id, por: 'Ana Paula', quando: AGORA, motivo, status: 'pendente' });
        criados++; titulos.push(it.titulo);

    delete S.aberto['g' + k]; delete S.modo['g' + k];
    render({ enter: true, focus: '#h-ped', noscroll: true }); say('Pedido rejeitado');
  },
  arquivar(el) {

    PEDIDOS.filter((p) => (p.alvo || p.id) === k && p.status === 'pendente').forEach((p) => { p.status = 'arquivada'; p.decididoPor = 'Jairo'; p.decididoEm = AGORA; });

};

  if (f) f(el, e);
});
view.addEventListener('change', (e) => {
  const el = e.target;
  if (el.tagName === 'INPUT' && el.dataset.act && H[el.dataset.act]) { H[el.dataset.act](el, e); return; }
  const k = el.dataset.in;
  if (!k || k === 'f.q' || k === 'f.vmin' || k === 'f.vmax' || k === 'busca' || k === 'palavra' || k === 'outro') return;
  if (k === 'motivo' || k === 'motivo-rej') { confDe(el.dataset.ctx).motivo = el.value; render({ focus: k === 'motivo-rej' ? null : null }); const rid = el.name; const again = view.querySelector(`input[name="${rid}"]:checked`); if (again) again.focus({ preventScroll: true }); }
  else if (k.startsWith('f.')) { S.f[k.slice(2)] = el.value; S.mostrar = 8; render(); }
});
view.addEventListener('input', (e) => {
  const el = e.target, k = el.dataset.in;
  if (!k) return;
  if (k === 'busca') { S.busca = el.value; render(); }
  else if (k === 'palavra') { confDe(el.dataset.ctx).palavra = el.value; render(); }
  else if (k === 'outro') { confDe(el.dataset.ctx).outro = el.value; render(); }
  else if (k === 'f.q' || k === 'f.vmin' || k === 'f.vmax') { S.f[k.slice(2)] = el.value; S.mostrar = 8; render(); }
});
trayEl.addEventListener('click', (e) => { const el = e.target.closest('[data-act]'); if (el && H[el.dataset.act]) H[el.dataset.act](el, e); });
view.addEventListener('keydown', (e) => {
  if (e.target.getAttribute('role') === 'tab' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    const tabs = [...view.querySelectorAll('[role=tab]')], i = tabs.indexOf(e.target);
    const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
    n.click();
    setTimeout(() => { const t = view.querySelector('[role=tab][aria-selected=true]'); t && t.focus(); }, 0);
  }
});

/* ================= controles do mockup ================= */
function setTema(t) {
  S.tema = t; document.documentElement.dataset.theme = t;
  document.querySelectorAll('[data-tema]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.tema === t));
}
function setPapel(p, manter) {
  S.papel = p;
  document.querySelectorAll('[data-papel]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.papel === p));
  if (!manter) { S.aba = 'apagar'; S.passo = 'pick'; S.sel = []; S.res = null; S.flash = null; S.conf = {}; }
  render({ enter: true });
}
function reiniciar() {
  ITENS = ITENS_SEED(); PEDIDOS = PEDIDOS_SEED(); TRILHA = TRILHA_SEED();
  Object.assign(S, { aba: 'apagar', passo: 'pick', dom: 'fin', tipo: null, busca: '', f: NOVO_F(), sel: [], exp: {}, col: {}, fil: {}, conf: {}, res: null, loadImp: false, flash: null, aberto: {}, modo: {}, mostrar: 8, trAberto: {}, escAberto: false });
  render({ enter: true });
}
function cenario(id) {
  const c = CENARIOS.find((x) => x.id === id); if (!c) return;
  ITENS = ITENS_SEED(); PEDIDOS = PEDIDOS_SEED(); TRILHA = TRILHA_SEED();
  Object.assign(S, { aba: c.aba || 'apagar', passo: 'pick', tipo: c.tipo || null, f: NOVO_F(), sel: c.sel ? [...c.sel] : [], conf: {}, col: {}, fil: {}, res: null, flash: null, aberto: {}, modo: {}, mostrar: 8, exp: {}, escAberto: false });
  if (c.tipo) S.dom = TIPOS[c.tipo].dom;
  if (c.id === 'c8') { S.aberto = { gP1: true }; S.modo = {}; }
  setPapel(c.papel, true);
  if (c.passo === 'impacto') irImpacto();
}
document.getElementById('mk').addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.tema) setTema(t.dataset.tema);
  else if (t.dataset.papel) setPapel(t.dataset.papel);
  else if (t.id === 'mk-reset') reiniciar();
});
document.getElementById('mk-cen').addEventListener('change', (e) => { if (e.target.value) cenario(e.target.value); e.target.value = ''; });
document.getElementById('mk-cen').innerHTML = '<option value="">Ir direto para…</option>' + CENARIOS.map((c) => `<option value="${c.id}">${c.nome}</option>`).join('');
if (window.innerWidth >= 761) document.getElementById('mk').open = true;

window.__mk = { cenario, S, setTema, setPapel, reiniciar }; // para os testes de captura
const q = new URLSearchParams(location.search);
if (q.get('tema')) setTema(q.get('tema'));
if (q.get('papel')) setPapel(q.get('papel'));
if (q.get('c')) cenario(q.get('c')); else render({ enter: true });
})();

</script>
