<!doctype html>
<!--
  MOCKUP CLICÁVEL nº 2 — Agenda do CowData/FazendaApp (rodada 1). Contrato: docs/agents/auditoria-preventivo-agenda/02-proposta.md §1, §2, §5.
  Arquivo único, sem backend. Dados: mockups/DADOS-CANONICOS.md (Fazenda Estreito Ponte de Pedra, mesmos dados do mockup de Vacinas/Protocolos), "hoje" fixo = terça, 29/09/2026; estado persistido em localStorage (F5 preserva).
  Rotas (hash): #/agenda?visao=hoje|semana|mes &agrupar=tarefa|lote|categoria &filtro=atrasadas|hoje &cat=rep,san,… &q=texto &dia=AAAA-MM-DD &mes=AAAA-MM
                &gaveta=confirmar|inseminar|registrar|exame|pesagem|bst|reproducao|estoque|historico|gestao|nova|editar|movimentacao|detalhes|adiar|nao|fechardia|excluir &t=ID_DA_TAREFA &aba=…
  Barra escura no topo = revisão (fora do produto): tema claro/misto/escuro, "Simular erro de rede", cenários, 1ª carga.
-->
<html lang="pt-BR" data-theme="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,viewport-fit=cover">
<title>Agenda · CowData (mockup 2)</title>
<meta name="description" content="Mockup clicável (rodada 2) do redesenho da Agenda do CowData: Hoje dominante, três números, gavetas, Desfazer e Dia fechado.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Tokens CowData (copiados de frontend/app/globals.css, paleta azul = padrão) ── */
:root{
  --ink:#150B10; --wine:#3A0F1A; --gold:#E0A63C; --gold-deep:#B9831F; --pasture:#4E7A5A;
  --cat-reproducao:#8B7FF0; --cat-sanidade:#4E7A5A; --cat-alimentacao:#E0A63C; --cat-gestao:#5B8FB0;
  --cat-financeiro:#7A2233; --cat-estoque:#C98A2A; --cat-recria:#B0894A; --cat-acesso:#9A5560; --cat-producao:#1E6FA8;
  --vinho:#0B2038; --vinho-light:#2C4A6B; --vinho-dark:#071A2E;
  --dourado:#B9831F; --dourado-light:#E0A63C;
  --green:color-mix(in srgb,#4E7A5A 80%,black); --green-light:#4E7A5A;
  --red:#A8341C; --amber:#D97706; --blue:#1E6FA8;
  --r-sm:2px; --shadow-sm:0 1px 4px rgba(20,30,45,.10);
  --font-body:'Archivo','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  /* tokens só do mockup: cor de TEXTO com contraste AA por tema (o real usa --red/--green-light direto) */
  --btn-acao:color-mix(in srgb,var(--dourado) 80%,black);
  --rev-h:40px;
}
/* escuro = padrão (igual ao real) */
:root,:root[data-theme="escuro"]{
  color-scheme:dark;
  --bg:color-mix(in srgb,var(--vinho) 12%,#050304);
  --surface:color-mix(in srgb,var(--vinho) 14%,#0F0A0C);
  --surface-2:color-mix(in srgb,var(--vinho) 16%,#170F13);
  --border:color-mix(in srgb,var(--vinho) 22%,#2A1A20);
  --border-strong:color-mix(in srgb,var(--vinho) 40%,#3a2a30);
  --text:#F0E8EC; --text-muted:#9B8A91;
  --alert-fg:#E8837A; --ok-fg:#6FB58A; --warn-fg:#F0A63C; --info-fg:#6FB1E6;
  --overlay:rgba(0,0,0,.7);
  --sidebar-bg:var(--surface); --sidebar-fg:var(--text); --sidebar-muted:var(--text-muted); --sidebar-border:var(--border);
  --sidebar-active-bg:rgba(11,32,56,.4); --sidebar-active-fg:var(--dourado-light); --sidebar-active-border:var(--dourado);
  --sidebar-logo-sub:var(--text-muted);
  --pill-active-bg:rgba(11,32,56,.4); --pill-active-fg:var(--dourado-light); --pill-active-border:var(--dourado);
  --foco:var(--dourado-light);
  --thead-bg:color-mix(in srgb,var(--vinho) 30%,var(--surface));
}
:root[data-theme="claro"]{
  color-scheme:light;
  --bg:#F1F1EF; --surface:#FFFFFF; --surface-2:#E9E9E6; --border:#DBDBD7; --border-strong:#C7C7C2;
  --text:#1E1B18; --text-muted:#6E665C;
  --alert-fg:#A8341C; --ok-fg:#2E6B45; --warn-fg:#9A5B00; --info-fg:#1B6094;
  --overlay:rgba(30,20,25,.45);
  --sidebar-bg:#FFFFFF; --sidebar-fg:var(--vinho); --sidebar-muted:#6B7280; --sidebar-border:#E5E7EB;
  --sidebar-active-bg:#12283F; --sidebar-active-fg:var(--dourado-light); --sidebar-active-border:var(--dourado);
  --sidebar-logo-sub:rgba(30,27,24,.55);
  --pill-active-bg:var(--vinho); --pill-active-fg:var(--dourado-light); --pill-active-border:var(--vinho);
  --foco:var(--vinho);
  --thead-bg:#F1F4F8;
}
:root[data-theme="misto"]{
  color-scheme:light;
  --bg:#F1F1EF; --surface:#FFFFFF; --surface-2:#E9E9E6; --border:#DBDBD7; --border-strong:#C7C7C2;
  --text:#1E1B18; --text-muted:#6E665C;
  --alert-fg:#A8341C; --ok-fg:#2E6B45; --warn-fg:#9A5B00; --info-fg:#1B6094;
  --overlay:rgba(30,20,25,.45);
  --sidebar-bg:var(--vinho); --sidebar-fg:#F5EEF1; --sidebar-muted:rgba(245,238,241,.7); --sidebar-border:rgba(255,255,255,.12);
  --sidebar-active-bg:rgba(255,255,255,.14); --sidebar-active-fg:var(--dourado-light); --sidebar-active-border:var(--dourado);
  --sidebar-logo-sub:rgba(245,238,241,.7);
  --pill-active-bg:var(--vinho); --pill-active-fg:var(--dourado-light); --pill-active-border:var(--vinho);
  --foco:var(--vinho);
  --thead-bg:#F3F4F6;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{font-weight:700;letter-spacing:-.02em;margin:0}
p{margin:0}
.ic{flex-shrink:0;display:inline-block;vertical-align:middle}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
::selection{background:color-mix(in srgb,var(--dourado) 35%,transparent)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--foco);outline-offset:2px;box-shadow:0 0 0 4px var(--surface)}
input,select,textarea{caret-color:var(--dourado)}
*{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
.tnum{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ── Barra de revisão (fora do shell) ── */
#rev{position:relative;z-index:200;height:var(--rev-h);background:#111418;color:#E9E9E6;display:flex;align-items:center;gap:14px;padding:0 12px;font-size:12px;overflow-x:auto;white-space:nowrap;border-bottom:1px solid #2b3037}
#rev b{font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#E0A63C}
#rev .grp{display:inline-flex;align-items:center;gap:6px}
#rev .seg{display:inline-flex;border:1px solid #3a4048;border-radius:2px;overflow:hidden}
#rev .seg button{background:transparent;border:0;color:#cfd3d8;padding:0 10px;height:26px;font-size:12px}
#rev .seg button[aria-pressed=true]{background:#E0A63C;color:#111418;font-weight:700}
#rev .rb{background:transparent;border:1px solid #3a4048;color:#E9E9E6;border-radius:2px;height:26px;padding:0 10px;font-size:12px}
#rev .rb:hover,#rev .seg button:hover{background:#232830}
#rev .seg button[aria-pressed=true]:hover{background:#E0A63C}
#rev select{background:#111418;color:#E9E9E6;border:1px solid #3a4048;border-radius:2px;height:26px;font-size:12px}
#rev :focus-visible{outline:2px solid #E0A63C;box-shadow:none}
#rev .sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
#rev .sw input{position:absolute;opacity:0;width:1px;height:1px}
#rev .sw .tr{width:30px;height:16px;border-radius:99px;background:#3a4048;position:relative;transition:background .15s}
#rev .sw .tr::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#E9E9E6;transition:transform .15s}
#rev .sw input:checked+.tr{background:#c0392b}
#rev .sw input:checked+.tr::after{transform:translateX(14px)}
#rev .sw input:focus-visible+.tr{outline:2px solid #E0A63C;outline-offset:2px}

/* ── Shell (Sidebar + main), medidas medidas no app real ── */
.shell{display:flex;height:calc(100dvh - var(--rev-h));overflow:hidden;background:var(--bg)}
.sb{width:196px;flex-shrink:0;height:100%;display:flex;flex-direction:column;background:var(--sidebar-bg);border-right:1px solid var(--sidebar-border);position:relative;z-index:50;transition:transform .2s}
.sb .logo{padding:16px;border-bottom:1px solid var(--sidebar-border)}
.sb .logo>div{display:flex;flex-direction:column;gap:4px;padding:8px}
.sb .wm{font-weight:800;letter-spacing:-.01em;font-size:1.05rem;white-space:nowrap}
.sb .wm .c{color:var(--sidebar-fg)} .sb .wm .d{color:var(--dourado-light)}
.sb .fz{color:var(--sidebar-logo-sub);font-size:.6rem;line-height:1.2}
.sb nav{flex:1;min-height:0;display:flex;flex-direction:column}
.sb .navin{flex:1;padding:12px;overflow-y:auto;min-height:0}
.sb .navin>div+div{margin-top:4px}
.sb .gl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--sidebar-muted);margin:.7rem 0 .3rem .6rem}
.sb .navin>div:first-child .gl{margin-top:0}
.sb a.nl{display:flex;align-items:center;gap:12px;padding:6px 12px;border-radius:8px;font-size:10px;font-weight:500;color:var(--sidebar-muted);border-left:3px solid transparent;text-decoration:none;transition:all .15s}
.sb a.nl:hover{background:color-mix(in srgb,var(--sidebar-fg) 6%,transparent)}
.sb a.nl[aria-current=page]{background:var(--sidebar-active-bg);color:var(--sidebar-active-fg);border-left-color:var(--sidebar-active-border)}
.sb .portal{padding:8px;border-top:1px solid var(--sidebar-border)}
.sb .portal a{display:flex;align-items:center;gap:8px;padding:8px 9.6px;border-radius:8px;border:1px solid var(--sidebar-border);color:var(--sidebar-muted);text-decoration:none;font-size:10px;font-weight:600}
.sb .portal a span{flex:1}
.sb .foot{padding:8px;border-top:1px solid var(--sidebar-border);text-align:center;font-size:.65rem;color:var(--sidebar-muted)}
.sb .foot .st{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--green-light)}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--pasture);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.sb .foot .us{margin-top:4px;font-size:.68rem}
.sb .foot .us>div{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:4px;color:var(--sidebar-fg)}
.sb .foot .us button{display:flex;align-items:center;gap:6px;margin:0 auto;background:none;border:1px solid var(--sidebar-border);border-radius:var(--r-sm);padding:3.2px 8.8px;color:var(--sidebar-muted);font-size:.68rem}
.sb .foot p{margin-top:2px}
.sb .recolher{position:absolute;top:1.1rem;right:-11px;z-index:10;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--sidebar-bg);border:1px solid var(--sidebar-border);color:var(--sidebar-muted);padding:0}
.sb .fechar{display:none}
.mbar{display:none}
.scrim-m{display:none}
.top-actions{position:fixed;top:calc(var(--rev-h) + 1rem);right:1.25rem;z-index:60;display:inline-flex;align-items:center;gap:.5rem}
.top-actions .news{display:inline-flex;align-items:center;gap:.35rem;padding:.4rem .8rem;border-radius:999px;background:var(--vinho);border:1px solid var(--vinho-light);color:#C9A44C;font-weight:700;font-size:.78rem;text-decoration:none;white-space:nowrap}
.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border);padding:.5rem 1rem;border-radius:var(--r-sm);font-size:.875rem;transition:all .2s}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.top-actions .tema{display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .7rem;font-size:.78rem;background:var(--surface-2)}
.top-actions .bell{position:relative;width:2.5rem;height:2.5rem;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;padding:0}
.top-actions .bell svg{color:#B8860B}
.top-actions .bell .n{position:absolute;top:-4px;right:-4px;min-width:1.1rem;height:1.1rem;border-radius:999px;background:var(--red);color:#fff;font-size:.65rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 .25rem}
main#main{flex:1;min-width:0;overflow-y:auto;position:relative}

/* ── Página ── */
.page{padding:16px 24px 48px;max-width:1440px;margin:0 auto;padding-top:48px}
.pgh{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.pgh h1{font-size:1.75rem;display:flex;align-items:center;gap:8px;line-height:1.3}
.pgh h1 svg{color:var(--dourado)}
.pgh .sub{color:var(--text-muted);font-size:.9375rem;margin-top:2px}
.pgh .sub b{color:var(--text);font-weight:600}
.pgacts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);font-size:.875rem;font-weight:600;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{background:var(--surface);border-color:var(--gold-deep)}
.btn.pri{background:var(--vinho);border-color:var(--vinho);color:#fff}
.btn.pri:hover{background:color-mix(in srgb,var(--vinho) 85%,black);border-color:color-mix(in srgb,var(--vinho) 85%,black)}
:root[data-theme="escuro"] .btn.pri,:root:not([data-theme]) .btn.pri{background:var(--vinho-light);border-color:var(--vinho-light)}
.btn.gold{background:var(--btn-acao);border-color:var(--btn-acao);color:#fff}
.btn.gold:hover{background:color-mix(in srgb,var(--btn-acao) 85%,black);border-color:color-mix(in srgb,var(--btn-acao) 85%,black)}
.btn.ghost{background:transparent;border-color:var(--border);color:var(--text-muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.danger{background:transparent;border-color:var(--alert-fg);color:var(--alert-fg)}
.btn.danger:hover{background:color-mix(in srgb,var(--alert-fg) 10%,transparent)}
.btn.sm{min-height:40px;padding:0 12px}
.rowc .btn.sm{min-height:44px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.upd{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;background:none;border:0;color:var(--text-muted);font-size:.8125rem}
.upd:hover{color:var(--text)}
.upd .ic.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.lbl{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted)}

/* faixa de 3 números */
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.num .lg-m{display:none}
.num{position:relative;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);box-shadow:var(--shadow-sm);padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-height:88px;color:var(--text);transition:border-color .15s}
.num:hover{border-color:var(--border-strong);background:color-mix(in srgb,var(--surface-2) 40%,var(--surface))}
.num[aria-pressed=true]{outline:2px solid var(--vinho-light);outline-offset:-2px}
.num .v{font-size:2rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px}
.num .v small{font-size:1rem;font-weight:600;color:var(--text-muted)}
.num .s{font-size:.8125rem;color:var(--text-muted);display:flex;align-items:center;gap:6px}
.num.at .v{color:var(--alert-fg)} .num.at.zero .v{color:var(--text)}
.num.ho .v{color:var(--vinho)} :root[data-theme="escuro"] .num.ho .v,:root:not([data-theme]) .num.ho .v{color:#9CB6D4}
.num.px .v{color:var(--info-fg)}
.prog{height:4px;background:var(--surface-2);border-radius:1px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--ok-fg);transform-origin:left;transition:transform .25s}
.num .lbl{display:flex;align-items:center;gap:6px}

/* barra de visão */
.bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.bar .r1,.bar .r2{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar .r1{flex-wrap:nowrap}
.bar:not(.abre) .r2{display:none}
.bar .r2{border-top:1px solid var(--border);padding-top:10px;gap:20px}
.bar .r2 .grp{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.agr select{min-height:44px;padding:0 10px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-sm);font-size:.9375rem;font-weight:600}
.fsum{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filtros-b{gap:6px}
.seg2{display:inline-flex;border:1px solid var(--border-strong);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg2 button{background:transparent;border:0;min-height:44px;padding:0 18px;font-size:.875rem;font-weight:600;color:var(--text-muted);display:inline-flex;align-items:center;gap:6px}
.seg2 button[aria-pressed=true]{background:var(--pill-active-bg);color:var(--pill-active-fg);font-weight:700}
.seg2.sm button{min-height:40px;padding:0 14px}
.agr{display:flex;align-items:center;gap:8px}
.agr .lbl{white-space:nowrap}
.busca{position:relative;flex:1;min-width:180px}
.busca svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}
.busca input{width:100%;min-height:44px;padding:0 12px 0 36px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-sm);font-size:.9375rem}
.busca input::placeholder{color:var(--text-muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--border-strong);background:transparent;color:var(--text);font-size:.8125rem;font-weight:600}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed=true]{background:color-mix(in srgb,var(--c) 18%,var(--surface));border-color:var(--c)}
.chip:hover{background:var(--surface-2)}
.chip.gav{border-style:dashed;color:var(--text)}
.chip.gav:hover{border-style:solid}
.sep{width:1px;align-self:stretch;background:var(--border);margin:0 4px}
.avisofiltro{display:flex;align-items:center;gap:8px;font-size:.875rem;color:var(--text-muted)}

/* comunicados */
.comun{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:var(--r-sm);padding:6px 6px 6px 12px;font-size:.875rem}
.comun .t{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;color:var(--text-muted)}
.comun .t b{color:var(--text);font-weight:600}
.comun button{min-height:36px}

/* layout principal */
.lay{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);box-shadow:var(--shadow-sm)}
.card>.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;min-height:56px}
.card>.hd h2{font-size:.875rem;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.card>.hd .meta{font-size:.8125rem;color:var(--text-muted)}
.hoje{border-color:var(--border-strong)}
.hoje>.hd{background:var(--thead-bg)}
.hoje>.hd h2{font-size:1rem;color:var(--text)}
.hoje>.hd h2 .d{color:var(--text-muted);font-weight:500;text-transform:none;letter-spacing:0;font-size:.9375rem}
.sec{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--border);border-top:1px solid var(--border);font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted)}
.hd+.sec{border-top:0}
.sec.at{color:var(--alert-fg)}
.sec .n{margin-left:auto;font-weight:600;letter-spacing:.02em;text-transform:none;font-size:.8125rem}
.sec .ic{color:inherit}

/* linha de tarefa */
.row{position:relative;display:flex;align-items:center;gap:12px;padding:12px 16px 12px 19px;border-bottom:1px solid var(--border);background:var(--surface);transition:background .15s,opacity .16s,transform .16s}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--border-strong))}
.row:hover{background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}
.row:last-child{border-bottom:0}
.row.saindo{opacity:0;transform:translateX(24px);pointer-events:none}
.row.novo{animation:entra .25s cubic-bezier(.16,1,.3,1)}
@keyframes entra{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.row:focus-visible{outline:2px solid var(--foco);outline-offset:-2px;box-shadow:none}
.row .ck{display:none;align-items:center;justify-content:center;width:44px;height:44px;margin:-8px -6px -8px -8px}
.sel .row .ck{display:flex}
.row .ck input{width:22px;height:22px;accent-color:var(--vinho-light)}
.cic{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 20%,var(--surface));color:color-mix(in srgb,var(--c) 70%,var(--text));flex-shrink:0}
:root[data-theme="escuro"] .cic,:root:not([data-theme]) .cic{color:color-mix(in srgb,var(--c) 85%,white)}
.rt{flex:1;min-width:0}
.rt .tt{font-size:.9375rem;font-weight:600;line-height:1.3;color:var(--text);overflow-wrap:anywhere}
.rt .mt{font-size:.8125rem;color:var(--text-muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center}
.rt .mt .ins{display:inline-flex;align-items:center;gap:4px;color:var(--text)}
.rt .mt .ins svg{color:var(--text-muted)}
.pl{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid currentColor;line-height:1.4;white-space:nowrap}
.pl.at{color:var(--alert-fg);background:color-mix(in srgb,var(--alert-fg) 10%,transparent)}
.pl.man{color:var(--text-muted);font-weight:600}
.pl.ok{color:var(--ok-fg);background:color-mix(in srgb,var(--ok-fg) 10%,transparent)}
.pl.wa{color:var(--warn-fg);background:color-mix(in srgb,var(--warn-fg) 10%,transparent)}
.pl.in{color:var(--info-fg);background:color-mix(in srgb,var(--info-fg) 10%,transparent)}
.acts{display:flex;align-items:center;gap:8px;flex-shrink:0}
.btn-feito{min-width:120px;background:var(--vinho);border-color:var(--vinho);color:#fff}
.btn-feito:hover{background:color-mix(in srgb,var(--vinho) 85%,black);border-color:color-mix(in srgb,var(--vinho) 85%,black)}
:root[data-theme="escuro"] .btn-feito,:root:not([data-theme]) .btn-feito{background:var(--vinho-light);border-color:var(--vinho-light)}
.more{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent;border-radius:var(--r-sm);color:var(--text-muted)}
.more:hover,.more[aria-expanded=true]{background:var(--surface-2);border-color:var(--border);color:var(--text)}
.vazio-sec{padding:16px;color:var(--text-muted);font-size:.875rem}

/* seleção em lote */
.selbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--vinho);color:#fff;border-bottom:1px solid var(--vinho-dark)}
.selbar .btn{min-height:40px}
.selbar .btn.gold{background:var(--dourado);border-color:var(--dourado)}
.selbar .btn.ghost{color:#fff;border-color:rgba(255,255,255,.4)}
.selbar .btn.ghost:hover{background:rgba(255,255,255,.12)}
.selbar .pg{flex:1;min-width:160px}
.selbar .pg .prog{background:rgba(255,255,255,.25);height:6px}
.selbar .pg .prog i{background:var(--dourado-light)}
.selbar .pg small{display:block;font-size:.8125rem;margin-bottom:4px}

/* colapsáveis */
.colapsa{margin-top:16px}
.colapsa .ch{width:100%;display:flex;align-items:center;gap:10px;padding:0 16px;min-height:52px;background:transparent;border:0;text-align:left;font-weight:700;font-size:.875rem;text-transform:uppercase;letter-spacing:.06em}
.colapsa .ch .ic.cv{transition:transform .2s;color:var(--text-muted)}
.colapsa .ch[aria-expanded=true] .ic.cv{transform:rotate(90deg)}
.chw{display:flex;align-items:center;gap:8px;padding-right:12px}.chw .ch{flex:1}
.colapsa .cnt{margin-left:auto;font-weight:500;text-transform:none;letter-spacing:0;color:var(--text-muted);font-size:.8125rem;display:flex;align-items:center;gap:8px}
.colapsa .body{border-top:1px solid var(--border)}
.rowc{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border)}
.rowc:last-child{border-bottom:0}
.rowc .rt .tt{font-weight:500;color:var(--text-muted);text-decoration:none}
.rowc .ico-ok{color:var(--ok-fg)}

/* fechar o dia */
.fechado{padding:32px 24px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.fechado .big{display:flex;align-items:center;gap:12px;font-size:1.375rem;font-weight:700;letter-spacing:-.01em}
.fechado .big svg{color:var(--ok-fg)}
.fechado p{color:var(--text-muted);max-width:60ch}
.fechado .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.vazio{padding:32px 24px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.vazio .big{font-size:1.125rem;font-weight:700;display:flex;gap:10px;align-items:center}
.vazio .big svg{color:var(--text-muted)}
.vazio p{color:var(--text-muted);max-width:60ch}
.vazio .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.vazio.erro .big svg{color:var(--alert-fg)}
.gest{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 16px;background:var(--surface-2);border:0;border-top:1px solid var(--border);text-align:left;font-size:.875rem;color:var(--text)}
.gest:hover{background:color-mix(in srgb,var(--surface-2) 60%,var(--surface))}
.gest b{font-weight:700}.gest .mut{color:var(--text-muted);margin-left:auto;display:flex;align-items:center;gap:6px}

/* lateral */
.lat{display:flex;flex-direction:column;gap:16px}
.lat .card .pd{padding:12px 16px}
.mini .mh{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 4px 16px}
.mini .mh b{font-size:.875rem}
.mini .mh button{width:44px;height:44px;background:transparent;border:0;color:var(--text-muted);display:flex;align-items:center;justify-content:center}
.mini .mh button:hover{color:var(--text)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px 12px}
.mg .wd{text-align:center;font-size:.75rem;font-weight:700;color:var(--text-muted);padding:2px 0 4px}
.mg button{position:relative;min-height:38px;background:transparent;border:1px solid transparent;border-radius:var(--r-sm);font-size:.8125rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-variant-numeric:tabular-nums;color:var(--text)}
.mg button:hover{background:var(--surface-2)}
.mg button.out{color:var(--text-muted);opacity:.6}
.mg button.hoje-d{border-color:var(--vinho-light);font-weight:800}
.mg button.sel-d{background:var(--pill-active-bg);color:var(--pill-active-fg)}
.mg button .dots{display:flex;gap:2px;height:5px}
.mg button .dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.mg button.atr-d{color:var(--alert-fg);font-weight:700}
.ins-l{list-style:none;margin:0;padding:0}
.ins-l li{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--border);font-size:.875rem;min-height:48px}
.ins-l li:first-child{border-top:0}
.ins-l li .nm{flex:1;min-width:0}
.ins-l li small{display:block;color:var(--text-muted);font-size:.8125rem}
.ins-l li .falta{font-weight:700;color:var(--alert-fg);white-space:nowrap}
.fdia .st{display:flex;align-items:center;gap:8px;font-size:.9375rem;margin-bottom:8px}
.fdia .st.ok{color:var(--ok-fg);font-weight:700}
.fdia p{font-size:.8125rem;color:var(--text-muted);margin-bottom:12px}

/* semana / mês */
.semana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding:12px}
.dia{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px;min-height:190px;color:var(--text)}
.dia:hover{border-color:var(--border-strong);background:var(--surface-2)}
.dia.h{border-color:var(--vinho-light);box-shadow:inset 0 0 0 1px var(--vinho-light)}
.dia .dh{display:flex;justify-content:space-between;align-items:baseline}
.dia .dh .w{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted)}
.dia .dh .dn{font-size:.8125rem;color:var(--text-muted)}
.dia .cn{font-size:1.75rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.dia .cn small{font-size:.8125rem;font-weight:500;color:var(--text-muted);margin-left:4px}
.dia .cr{display:flex;flex-wrap:wrap;gap:4px}
.dia ul{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.8125rem;color:var(--text-muted)}
.dia li{display:flex;gap:6px;align-items:flex-start;line-height:1.3}
.dia li i{width:8px;height:8px;border-radius:50%;background:var(--c);margin-top:5px;flex-shrink:0}
.mes{padding:12px}
.mes .nav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mes .nav b{font-size:1.125rem;flex:1}
.mes .g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mes .g .wd{text-align:center;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);padding:4px 0}
.mes .cel{min-height:84px;padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);text-align:left;display:flex;flex-direction:column;gap:4px;color:var(--text)}
.mes .cel:hover{background:var(--surface-2);border-color:var(--border-strong)}
.mes .cel.out{opacity:.45}
.mes .cel.h{border-color:var(--vinho-light);box-shadow:inset 0 0 0 1px var(--vinho-light)}
.mes .cel .n{display:flex;justify-content:space-between;font-size:.8125rem;font-weight:700;font-variant-numeric:tabular-nums}
.mes .cel .n span{color:var(--text-muted);font-weight:600}
.mes .cel .n .a{color:var(--alert-fg);display:inline-flex;align-items:center;gap:2px}
.mes .cel .ds{display:flex;flex-wrap:wrap;gap:3px}
.mes .cel .ds i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.mes .cel.past .n{color:var(--text-muted)}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;padding:12px 4px 0;font-size:.8125rem;color:var(--text-muted)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:10px;height:10px;border-radius:50%;background:var(--c)}

/* grupos por lote/categoria */
.gh{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface-2);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.gh b{font-size:.9375rem}
.gh .n{margin-left:auto;font-size:.8125rem;color:var(--text-muted)}

/* skeleton */
.sk{background:var(--surface-2);border-radius:var(--r-sm);position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--text) 6%,transparent),transparent);animation:shim 1.2s infinite}
@keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.skr{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}

/* overlays */
#ov{position:fixed;left:0;right:0;bottom:0;top:var(--rev-h);z-index:100;pointer-events:none}
#ov>*{pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--overlay);animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);border-left:1px solid var(--border-strong);display:flex;flex-direction:column;animation:slide .22s cubic-bezier(.16,1,.3,1);}
@keyframes slide{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.drawer.wide{width:min(720px,100vw)}
.dh{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 12px 20px;border-bottom:1px solid var(--border)}
.dh h2{font-size:1.125rem;flex:1;line-height:1.3}
.dh .kk{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);display:block;margin-bottom:2px}
.dh .x{width:44px;height:44px;margin:-8px -8px 0 0;background:transparent;border:0;color:var(--text-muted);display:flex;align-items:center;justify-content:center}
.dh .x:hover{color:var(--text);background:var(--surface-2)}
.db{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:20px}
.df{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:var(--surface)}
.df .btn{flex:0 1 auto}
.df .sum{flex:1 1 100%;font-size:.875rem;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;color:var(--text)}
.df .sum b{font-weight:700}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.fld .lb,.tools .lb{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted)}
.fld input[type=text],.fld input[type=date],.fld input[type=number],.fld select,.fld textarea{min-height:44px;padding:8px 12px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-sm);font-size:1rem;width:100%}
.fld textarea{min-height:80px;resize:vertical}
.fld .err{color:var(--alert-fg);font-size:.8125rem;display:flex;gap:6px;align-items:center}
.fld .hint{font-size:.8125rem;color:var(--text-muted)}
.fld input[aria-invalid=true]{border-color:var(--alert-fg)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--r-sm);min-height:48px;cursor:pointer;background:var(--surface)}
.opt:has(input:checked){border-color:var(--vinho-light);background:color-mix(in srgb,var(--vinho-light) 10%,var(--surface))}
.opt input{width:20px;height:20px;margin-top:2px;accent-color:var(--vinho-light);flex-shrink:0}
.opt .o1{font-size:.9375rem;font-weight:600}
.opt .o2{font-size:.8125rem;color:var(--text-muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.alist{border:1px solid var(--border);border-radius:var(--r-sm);max-height:280px;overflow-y:auto}
.alist .ar{display:flex;align-items:center;gap:10px;padding:0 12px;min-height:44px;border-bottom:1px solid var(--border);font-size:.9375rem}
.alist .ar:last-child{border-bottom:0}
.alist .ar label{display:flex;align-items:center;gap:10px;flex:1;min-height:44px;cursor:pointer}
.alist .ar input[type=checkbox]{width:20px;height:20px;accent-color:var(--vinho-light)}
.alist .ar .inf{margin-left:auto;font-size:.8125rem;color:var(--text-muted);text-align:right}
.alist .ar input.kg{width:96px;min-height:40px;text-align:right}
.alist .ar select{min-height:40px;max-width:190px;padding:0 6px;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--r-sm);font-size:.875rem}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.tools .c{margin-left:auto;font-size:.875rem;color:var(--text-muted)}
.tbl{width:100%;border-collapse:collapse;font-size:.875rem;font-variant-numeric:tabular-nums}
.tbl th{position:sticky;top:0;text-align:left;padding:8px 10px;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);background:var(--thead-bg);border-bottom:1px solid var(--border-strong);white-space:nowrap}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:hover td{background:var(--surface-2)}
.tbl .r{text-align:right}
.twrap{border:1px solid var(--border);border-radius:var(--r-sm);overflow:auto;max-height:52vh}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.9375rem}
.kv dt{color:var(--text-muted);font-size:.8125rem;padding-top:2px}
.kv dd{margin:0}
.callout{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--border);background:var(--surface-2);border-radius:var(--r-sm);font-size:.875rem;color:var(--text)}
.callout svg{color:var(--info-fg);margin-top:2px}
.callout.warn svg{color:var(--warn-fg)}
.sect-t{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.bigcnt{font-size:.875rem;color:var(--text-muted)}

/* dialog central / sheet */
.dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-sm);animation:pop .18s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}to{opacity:1;transform:translate(-50%,-50%)}}
.dlg .db{padding:16px 20px}

/* menu popover */
.menu{position:fixed;z-index:120;min-width:230px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:4px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;background:transparent;border:0;text-align:left;font-size:.9375rem;border-radius:var(--r-sm);color:var(--text)}
.menu button:hover,.menu button:focus-visible{background:var(--surface-2)}
.menu button.dg{color:var(--alert-fg)}
.menu button svg{color:var(--text-muted)}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 0}

/* toasts */
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:150;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(560px,calc(100vw - 24px));pointer-events:none}
.toast{pointer-events:auto;width:100%;display:flex;align-items:center;gap:12px;background:var(--vinho-dark);color:#fff;border:1px solid var(--vinho-light);border-radius:var(--r-sm);padding:6px 6px 6px 14px;min-height:52px;animation:tin .22s cubic-bezier(.16,1,.3,1);font-size:.9375rem}
:root[data-theme="escuro"] .toast,:root:not([data-theme]) .toast{background:#16283c}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.toast.err{border-color:#e8837a}
.toast .m{flex:1;min-width:0;display:flex;gap:8px;align-items:center}
.toast .m svg{color:#8ED2A6;flex-shrink:0}
.toast.err .m svg{color:#F0A29A}
.toast button{min-height:44px;padding:0 12px;background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:var(--r-sm);font-weight:700;font-size:.875rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.toast button:hover{background:rgba(255,255,255,.14)}
.toast button.xx{border-color:transparent;padding:0 10px;min-width:44px;justify-content:center}
.toast .tb{position:absolute;left:0;bottom:0;height:2px;background:var(--dourado-light);transform-origin:left;animation:tb 10s linear forwards}
@keyframes tb{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.toast{position:relative;overflow:hidden}

.lay.full{grid-template-columns:minmax(0,1fr)}
.lay.full .lat{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
@media (max-width:1180px){
  .lay{grid-template-columns:minmax(0,1fr)}
  .lat{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
}
@media (max-width:1000px){
  .semana{grid-template-columns:1fr}
  .dia{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 12px}
  .dia .dh{flex:0 0 96px;flex-direction:column;gap:0}
  .dia ul{flex:1 1 100%;margin-top:0}
}
/* mobile: barra fixa + drawer, como Sidebar.tsx (md = 768px) */
@media (max-width:767px){
  :root{--rev-h:40px}
  .shell{display:block;height:auto;overflow:visible}
  main#main{overflow:visible}
  #rev{padding:0 8px;gap:10px;z-index:auto}
  #ov{top:0;position:fixed}
  #rev .lg{display:none}

const isCampo=t=>t.trilho==='campo';
const pend=t=>t.st==='p'&&!t.hist;
function counts(){
  const at=S.tasks.filter(t=>pend(t)&&isCampo(t)&&t.data<HOJE);
  const hj=S.tasks.filter(t=>isCampo(t)&&t.data===HOJE&&(t.st==='p'||t.st==='f')&&!t.hist);
  const base=t=>t.splitDe||t.id;
  const g={};hj.forEach(t=>{const k=base(t);g[k]=g[k]||{p:0,f:0};g[k][t.st]++});
  const ks=Object.values(g);
  const N=ks.filter(x=>x.p===0&&x.f>0).length,M=ks.length;
  const hojePend=ks.filter(x=>x.p>0).length;
  const px=proximos7();
  const restam=at.length+hj.filter(t=>t.st==='p').length;
  return {at:at.length,N,M,hojePend,px:px.length,pxCrit:px.filter(t=>t.crit).length,restam,maxAt:at.reduce((m,t)=>Math.max(m,diff(HOJE,t.data)),0)};
}
function resolvidasHoje(){
  const base=t=>t.splitDe||t.id;
  const g={};
  S.tasks.filter(t=>isCampo(t)&&!t.hist&&t.st!=='p'&&t.feitoEm===HOJE).forEach(t=>{const k=base(t);g[k]=g[k]||{f:0,n:0};g[k][t.st]++});
  const ks=Object.entries(g).filter(([id])=>!S.tasks.some(t=>t.st==='p'&&(t.id===id))); // divididas com resto pendente não contam
  return {n:ks.length,f:ks.filter(([,x])=>x.f>0).length,nao:ks.filter(([,x])=>x.f===0).length};
}
function proximos7(){return S.tasks.filter(t=>pend(t)&&isCampo(t)&&t.data>HOJE&&t.data<=add(HOJE,7))}
function needs(){
  const lim=add(HOJE,7),m={};
  S.tasks.filter(t=>pend(t)&&isCampo(t)&&t.data<=lim&&t.insL).forEach(t=>t.insL.forEach(i=>{m[i.id]=(m[i.id]||0)+i.q}));
  return Object.entries(m).map(([id,q])=>{const have=Math.max(0,estSaldo(S.est[id]));return {id,need:q,have,falta:q-have}}).filter(x=>x.falta>0).sort((a,b)=>b.falta-a.falta);
}
const abaixoMin=()=>Object.entries(S.est).filter(([k,e])=>estSaldo(e)<e.min).map(([id,e])=>({id,...e,saldo:estSaldo(e)}));
function avisosValidade(){
  const out=[];
  Object.entries(S.est).forEach(([id,e])=>e.fr.forEach(f=>{if(!f.val)return;if(vencido(f))out.push({id,f,tipo:'vencido'});else if(venceEm(f)<=30)out.push({id,f,tipo:'vence'})}));
  return out;
}

  if(R.cat.length&&!R.cat.includes(t.cat))return false;

}

}
function buildHash(r){
  const p=new URLSearchParams();
  if(r.visao!=='hoje')p.set('visao',r.visao);
  if(r.agrupar!=='tarefa')p.set('agrupar',r.agrupar);
  if(r.filtro)p.set('filtro',r.filtro);
  if(r.cat.length)p.set('cat',r.cat.join(','));
  if(r.q)p.set('q',r.q);
  if(r.dia)p.set('dia',r.dia);
  if(r.mes)p.set('mes',r.mes);
  if(r.gaveta)p.set('gaveta',r.gaveta);
  if(r.t)p.set('t',r.t);

}

/* consome do frasco escolhido e, se faltar, dos próximos a vencer (nunca vencidos); não deixa saldo negativo enquanto houver outro frasco */
function distribuir(id,q,primaria){
  const e=S.est[id];const ok=e.fr.filter(f=>!vencido(f)&&f.s>0).sort((a,b)=>(a.val||'9')>(b.val||'9')?1:-1);
  const prim=e.fr.find(f=>f.f===primaria)||ok[0]||e.fr[0];
  const ordem=[prim,...ok.filter(f=>f!==prim)];const out=[];let rest=q;
  for(const f of ordem){if(rest<=0)break;const t=Math.min(rest,Math.max(0,f.s));if(t>0){out.push({id,f:f.f,q:Math.round(t*100)/100});rest-=t}}
  if(rest>0.0001){const ult=out.find(x=>x.f===prim.f);if(ult)ult.q=Math.round((ult.q+rest)*100)/100;else out.push({id,f:prim.f,q:Math.round(rest*100)/100})}
  return out;
}
function frDefaultFEFO(e){const ok=e.fr.filter(f=>!vencido(f)&&f.s>0).sort((a,b)=>(a.val||'9')>(b.val||'9')?1:-1);return (ok[0]||e.fr.find(f=>!vencido(f))||e.fr[0]).f}

function desfazer(id){

function renderOverlay(){
  const ov=$('#ov');const g=R.gaveta;
  const prevKey=ov.dataset.key;const key=g+'|'+R.t+'|'+R.aba;
  if(!g){
    ui.Dkey=undefined;

      const k=ui.opener;let el=k&&$(`[data-fk="${CSS.escape(k)}"]`);if(!el)el=$('#hojeCard .btn-feito');if(el)el.focus({preventScroll:true});ui.opener=null}
    return;
  }

  const t=R.t?byId(R.t):null;
  const dialogs=['adiar','nao','fechardia','excluir','compl'];
  let html='';
  try{html=dialogs.includes(g)?dlgHTML(g,t):drawerHTML(g,t)}catch(e){console.error(e);html=''}
  if(!html){R.gaveta='';history.replaceState(null,'',buildHash({...R,gaveta:'',t:''}));ov.innerHTML='';$('#shell').inert=false;return}
  const same=prevKey===key&&ov.innerHTML;

  if(!same||!ov.contains(document.activeElement)){const f=$('[data-autofocus]',d)||$('button,input,select,textarea',d);if(f)f.focus({preventScroll:true})}
  wireOv();
}
function trapKeys(e){
  const d=$('#ov [role=dialog]');if(!d)return;
  if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closeOv();return}
  if(e.key!=='Tab')return;
  const f=$$('button:not([disabled]),input:not([disabled]),select,textarea,a[href],[tabindex]:not([tabindex="-1"])',d).filter(x=>x.offsetParent!==null);
  if(!f.length)return;
  const a=f[0],z=f[f.length-1];
  if(e.shiftKey&&(document.activeElement===a||!d.contains(document.activeElement))){e.preventDefault();z.focus()}
  else if(!e.shiftKey&&(document.activeElement===z||!d.contains(document.activeElement))){e.preventDefault();a.focus()}
}

/* ── BST (aptas: DEL ≥ 60) ── */

  let body='';
  if(aba==='lancar'){
    body=t?`<div class="callout">${ic('info',16)}<span>Só entram vacas com <b>DEL a partir de 60</b> (regra da fazenda). As que não atendem estão em “Excluídas”.</span></div>

     <div class="alist" role="group" aria-label="Vacas aptas">${b.aptos.map(a=>`<div class="ar"><label><input type="checkbox" data-a="ck-a" value="${a}" ${D.sel.has(a)?'checked':''}> <b>${a}</b></label><span class="inf">DEL ${delDe(a)}</span></div>`).join('')}</div></div>
     <div class="callout">${ic('info',16)}<span>Próxima aplicação prevista para <b>${fmtBR(add(HOJE,14))}</b> (ciclo de 14 dias). Vacas não marcadas ficam na Agenda de hoje.</span></div><div class="sumbox" id="sum" aria-live="polite"></div>`
     :`<div class="callout">${ic('circle-check',16)}<span>Não há lançamento de BST por fazer hoje. Próximo ciclo: <b>${fmtBR(add(HOJE,14))}</b>.</span></div>`;
  }else if(aba==='aptos'){
    body=`<div class="twrap"><table class="tbl"><thead><tr><th>Vaca</th><th>DEL</th><th class="r">Leite (L/dia)</th><th>Última aplicação</th></tr></thead><tbody>${b.aptos.map(a=>{const n=parseInt(a,10);return `<tr><td><b>${a}</b></td><td>${delDe(a)}</td><td class="r">${(22+(n%17)).toFixed(1).replace('.',',')}</td><td>${fmtBR(add(HOJE,-14-(n%2)))}</td></tr>`}).join('')}</tbody></table></div>`;
  }else{
    body=`<div class="callout warn">${ic('info',16)}<span>Excluídas não recebem BST neste ciclo. Só quem foi excluída por outro motivo que não DEL abaixo de 60 pode entrar no próximo ciclo (mastite, por exemplo, depois da carência).</span></div><div class="twrap"><table class="tbl"><thead><tr><th>Vaca</th><th>Motivo da exclusão</th><th></th></tr></thead><tbody>${b.excl.map(x=>{const on=b.incluir.includes(x.n);const del=/^DEL/.test(x.motivo);return `<tr><td><b>${x.n}</b></td><td>${esc(x.motivo)}</td><td class="r">${del?'<span class="mut">DEL abaixo de 60</span>':`<button class="btn sm ${on?'':'ghost'}" data-a="bst-inc" data-v="${x.n}" aria-pressed="${on}">${on?ic('check',14)+'Incluída':'Incluir no próximo ciclo'}</button>`}</td></tr>`}).join('')}</tbody></table></div>`;

let popEl=null,popBtn=null;
function closePop(focus){if(popEl){popEl.remove();popEl=null}if(popBtn){popBtn.setAttribute('aria-expanded','false');if(focus&&document.contains(popBtn))popBtn.focus();popBtn=null}}
function openPop(btn){

document.addEventListener('keydown',e=>{
  if(popEl&&e.key==='Escape'){e.preventDefault();e.stopPropagation();closePop(true);return}
  if(menuEl){
    const bs=$$('button',menuEl),i=bs.indexOf(document.activeElement);
    if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closeMenu(true);return}
    if(e.key==='ArrowDown'){e.preventDefault();bs[(i+1)%bs.length].focus();return}
    if(e.key==='ArrowUp'){e.preventDefault();bs[(i-1+bs.length)%bs.length].focus();return}
    if(e.key==='Tab'){closeMenu();return}
  }
},true);

  S.tasks.push(...novas);lg({tid:novas[0].id,titulo,acao:'Criada',obs:`Para ${fmtBR(data)}${rep?`, repete a cada ${rep} ${un==='d'?'dias':'meses'}`:''}`});save();

/* ───────── exportar: respeita Visão e Filtros; inclui concluídas ───────── */
function escopoExport(){
  const v=R.visao;let ini,fim;
  if(v==='semana'){ini=add(HOJE,1);fim=add(HOJE,7)}
  else if(v==='mes'){const ym=R.mes||HOJE.slice(0,7);ini=ym+'-01';const [y,m]=ym.split('-').map(Number);fim=add(iso(new Date(Date.UTC(y,m,1))),-1)}
  else{ini=R.dia||HOJE;fim=ini}
  const linhas=[];
  const inEsc=d=>d>=ini&&d<=fim||(v==='hoje'&&!R.dia&&d<HOJE&&R.filtro!=='hoje');
  const c2=n=>n===''||n==null||isNaN(n)?'':Number(n).toFixed(2).replace('.',',');
  S.tasks.filter(t=>!t.hist&&t.trilho!=='gestao'&&match(t)&&(R.filtro!=='atrasadas'||(t.data<HOJE))&&(R.filtro!=='hoje'||t.data===HOJE)).forEach(t=>{
    if(t.st==='p'&&inEsc(t.data)){
      const d=diff(HOJE,t.data);
      linhas.push({data:t.data,sit:d>0?`Atrasada há ${d} dias`:t.adiadaDe?`Adiada de ${fmtBR(t.adiadaDe)}`:'A fazer',cat:CATS[t.cat].n,tarefa:t.titulo,quem:t.quem||'',ins:insTxt(t),regpor:'',aplic:'',hora:'',motivo:'',frasco:'',dose:'',via:'',custo:''});
    }
  });
  S.log.filter(e=>['Feito','Não vou fazer','Estornada','Adiada','Reagente identificado','Excluída','Motivo informado'].includes(e.acao)).forEach(e=>{
    const t=byId(e.tid);const tt=t||{};
    if(t&&!(match(t)))return;
    const dTask=t?t.data:e.dia;if(!(dTask>=ini&&dTask<=fim)&&!(v==='hoje'&&e.dia>=ini&&e.dia<=fim))return;
    linhas.push({data:dTask,sit:e.acao==='Feito'?(e.estornada?'Feita (estornada depois)':e.fila?'Feita (na fila, envia ao reconectar)':'Feita'):e.acao==='Estornada'?'Estorno':e.acao==='Reagente identificado'?'REAGENTE — notificar serviço veterinário oficial':e.acao==='Excluída'?'Tarefa excluída':e.acao,cat:CATS[e.cat||(t&&t.cat)||'ati'].n,tarefa:e.titulo,quem:tt.quem||e.lote||'',ins:'',regpor:e.quem,aplic:e.quemFez||'',hora:`${fmtBR(e.dia)} ${e.hora}`,motivo:[e.motivo,e.obs].filter(Boolean).join(' · '),frasco:e.frasco||'',dose:e.dose||'',via:e.via||'',custo:c2(e.custo)});
  });
  linhas.sort((a,b)=>a.data>b.data?1:a.data<b.data?-1:0);
  return {ini,fim,linhas};
}
const COLS=[['data','Data'],['sit','Situação'],['cat','Categoria'],['tarefa','Tarefa'],['quem','Para quem'],['ins','Insumo previsto'],['regpor','Registrado por'],['aplic','Aplicador'],['hora','Quando'],['motivo','Motivo / observação'],['frasco','Frasco (lote)'],['dose','Dose'],['via','Via'],['custo','Custo (R$)']];
function exportarCSV(){
  const {ini,fim,linhas}=escopoExport();
  const csv='﻿'+[COLS.map(c=>c[1])].concat(linhas.map(l=>COLS.map(c=>c[0]==='data'?fmtBR(l.data):l[c[0]]))).map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`agenda-${R.visao}-${ini}${fim!==ini?'_a_'+fim:''}.csv`;document.body.appendChild(a);a.click();a.remove();
  toast({msg:`Exportado: ${a.download} (${linhas.length} linhas, com concluídas)`});
}
function montaPrint(){

/* ───────── delegação de cliques ───────── */
document.addEventListener('click',e=>{

  if(popEl&&!e.target.closest('.pop')&&!(a&&a.dataset.a==='gl'))closePop();

  switch(act){
    case 'stub':e.preventDefault();stub(a.dataset.l);break;
    case 'nada':e.preventDefault();break;
    case 'gl':if(popBtn===a)closePop();else openPop(a);break;
    case 'pop-x':closePop(true);break;

    case 'limpar':go({cat:[],q:'',filtro:''});break;
    case 'dia':go({visao:'hoje',dia:a.dataset.d===HOJE?'':a.dataset.d,filtro:''});break;
    case 'mes':go({mes:a.dataset.m});break;
    case 'mini':ui.mini=a.dataset.m;renderLat();break;
    case 'gav':{
      const g=a.dataset.gv;
      if(g==='bst'){const b=S.tasks.find(t=>t.kind==='bst'&&pend(t)&&t.data<=HOJE);abrirGav('bst',b?b.id:'',b?'lancar':'aptos')}
      else abrirGav(g,'',g==='reproducao'?'cand':'');

    case 'retry':retry();break;

    case 'in-res':ui.D.res[a.dataset.v]=a.value;updExame(byId(R.t));break;
    case 'ck-a':{const D=ui.D;a.checked?D.sel.add(a.value):D.sel.delete(a.value);const t=byId(R.t);if(R.gaveta==='confirmar')updConfirmar(t);else if(R.gaveta==='reproducao')updRepro();else updBst(t);break}
    case 'ck-all':{const t=byId(R.t);const D=ui.D;const src=R.gaveta==='bst'?S.bst.aptos:R.gaveta==='reproducao'?CAND:t.animais;D.sel=new Set(a.dataset.v==='1'?src:[]);$$('#ov input[data-a=ck-a]').forEach(c=>c.checked=a.dataset.v==='1');if(R.gaveta==='confirmar')updConfirmar(t);else if(R.gaveta==='reproducao')updRepro();else updBst(t);break}
    case 'ok-confirmar':{
      const t=byId(R.t),D=ui.D;const sel=[...D.sel];const cons=D.cons;const rid=t.id;const delta=D.delta||0;const rep=D.reprog;const q=D.quem;const dIso=parseBR(D.dt);
      const sib=S.tasks.filter(x=>pend(x)&&x.proto&&x.proto===t.proto&&x.id!==t.id&&x.data>t.data&&/^IATF/.test(x.titulo));
      closeOvThen(()=>{
        const nid=feito(rid,{animais:sel,consumo:cons,reg:{quem:q,dataReal:dIso,ciente:cons.some(c=>vencido(S.est[c.id].fr.find(f=>f.f===c.f)))}});
        if(delta&&rep)sib.forEach(x=>{x.data=add(x.data,delta);lg({tid:x.id,titulo:x.titulo,acao:'Reprogramada',obs:`Deslocada ${delta>0?'+':''}${delta} dia(s) após a data real de ${t.titulo}`})});
        afterMut();feitoToast(nid,cons.map(c=>c.f).join(', '))});break}
    case 'ok-registrar':{const t=byId(R.t),D=ui.D;const e=S.est[t.prod];const fr=D.fr;const rid=t.id;const reg={quem:D.quem,dataReal:D.dtIso,via:e.via,doseTxt:`${nfmt(D.dose)} mL/animal`,custo:D.custoV,ciente:D.needCiente&&D.ciente,obs:''};const cons=D.cons;
      closeOvThen(()=>{const nid=feito(rid,{consumo:cons,reg});afterMut();feitoToast(nid,`frasco ${cons.map(c=>c.f).join(' + ')}`)});break}
    case 'ok-exame':{const t=byId(R.t),D=ui.D;const rid=t.id;const res={...D.res};const leitura=t.kind==='tbl';const q=D.quem;const lote=t.lote,an=t.animais.slice();const dIso=D.dtIso;const hr=D.hr;const cons=D.cons||[];const laudo=($('#ex-l')||{}).value||'';const just=($('#ex-j')||{}).value||'';
      closeOvThen(()=>{
        const obs=leitura?Object.entries(res).map(([a,r])=>aLbl(a)+': '+({neg:'negativo',pos:'POSITIVO (reagente)',inc:'inconclusivo'}[r])).join('; ')+(just?` · justificativa: ${just}`:''):'';
        const nid=feito(rid,{consumo:leitura?[]:cons,reg:{quem:q,dataReal:dIso,obs,ciente:!leitura&&D.needCiente&&D.ciente,via:leitura?'':'Intradérmica'}});
        if(!leitura){const n=mk('l'+(++S.seq),'tbl',3,{animais:an,lote});n.data=add(dIso||HOJE,3);n.hrInoc=hr;n.quem_fix=`${an.length} animais (${an.map(aLbl).join(', ')}) · ${lote}`;n.quem=n.quem_fix;S.tasks.push(n)}
        else{
          Object.keys(res).filter(a=>res[a]==='pos').forEach(a=>{S.reagentes.push({a,laudo,dia:HOJE,hora:hm(),por:USER,notif:null});lg({tid:rid,titulo:t.titulo,acao:'Reagente identificado',quemFez:pessoa(q).nome,obs:`${aLbl(a)} · reagente no exame de TB${laudo?' · laudo '+laudo:''} · notificar o serviço veterinário oficial`})});
          const inc=Object.keys(res).filter(a=>res[a]==='inc');if(inc.length){const n=mk('r'+(++S.seq),'tb',60,{animais:inc,lote});n.titulo='Exame TB — reteste (inconclusivo em '+fmtBR(HOJE)+')';n.quem_fix=`${inc.length} animais (${inc.map(aLbl).join(', ')}) · ${lote}`;n.quem=n.quem_fix;S.tasks.push(n)}
        }
        save();afterMut();renderReag();feitoToast(nid,leitura?'resultados registrados':`leitura em ${fmtBR(add(dIso||HOJE,3))} às ${hr}`)});break}
    case 'in-exfr':updExame(byId(R.t));break;
    case 'reag-notif':{const r=S.reagentes[+a.dataset.i];if(r&&a.checked){r.notif={quem:USER,dia:HOJE,hora:hm()};lg({tid:'reag',titulo:'Reagente '+aLbl(r.a),acao:'Notificação registrada',obs:'Serviço veterinário oficial notificado'});save();renderReag()}break}
    case 'ok-pesagem':{const t=byId(R.t),D=ui.D;const f=Object.keys(D.p).filter(x=>num(D.p[x])>0);const rid=t.id;const obs=f.map(x=>x+': '+nfmt(num(D.p[x]))+' kg').join('; ');
      closeOvThen(()=>{const nid=feito(rid,{animais:f,reg:{quem:'ca',obs}});afterMut();feitoToast(nid,`${f.length} ${f.length===1?'peso registrado':'pesos registrados'}`)});break}
    case 'ok-bst':{const t=byId(R.t),D=ui.D;const sel=[...D.sel];const rid=t.id;
      closeOvThen(()=>{const nid=feito(rid,{animais:sel,consumo:distribuir('bst',sel.length,'BS-2606'),reg:{quem:'ca'}});afterMut();feitoToast(nid,`${sel.length} doses`)});break}
    case 'aba':abrirGav(R.gaveta,R.t,a.dataset.v);break;
    case 'bst-inc':{const n=a.dataset.v,l=S.bst.incluir;const i=l.indexOf(n);i>=0?l.splice(i,1):l.push(n);save();abrirGav(R.gaveta,R.t,'excl');break}
    case 'iniciar-proto':stub(`Protocolos › Novo protocolo, já com o lote “${a.dataset.l}” e o modelo IATF (Dia 0, 7, 9 e 11) preenchidos`);break;
    case 'ia-ok':{const t=byId(R.t);const n=a.dataset.v;t.iaFeitas=t.iaFeitas||[];t.iaFeitas.push(n);const fr=S.est.sem.fr[0];fr.s--;lg({tid:t.id,titulo:t.titulo,lote:t.lote,acao:'Feito',cat:t.cat,quemFez:pessoa(ui.D.quem||'pm').nome,frasco:fr.f,obs:'Inseminação da vaca '+n});save();
      if(t.iaFeitas.length>=t.animais.length){t.st='f';t.feitoEm=HOJE;t.hora=hm();t.porQuem=pessoa(ui.D.quem||'pm').nome;t.consumo=[{id:'sem',f:fr.f,q:t.animais.length}];t.reg={frasco:fr.f,custo:t.animais.length*S.est.sem.preco};const rid=t.id;const e=lg({tid:t.id,titulo:t.titulo,lote:t.lote,acao:'Feito',cat:t.cat,quemFez:t.porQuem,frasco:fr.f,custo:t.reg.custo,obs:'Dia 11 concluído'});t.logId=e.id;save();closeOvThen(()=>{afterMut();feitoToast(rid,`${t.animais.length} inseminadas`)})}
      else{renderOverlay();afterMut()}break}
    case 'ia-undo':{const t=byId(R.t);t.iaFeitas=t.iaFeitas.filter(x=>x!==a.dataset.v);S.est.sem.fr[0].s++;lg({tid:t.id,titulo:t.titulo,acao:'Estornada',obs:'Inseminação da vaca '+a.dataset.v+' estornada'});save();renderOverlay();afterMut();break}
    case 'gestao-ok':{const t=byId(id);t.st='n';t.feitoEm=HOJE;t.motivo=t.res==='informativo'?'Dispensado':'Aberto no módulo';t.hora=hm();lg({tid:id,titulo:t.titulo,acao:'Não vou fazer',motivo:t.motivo});save();afterMut();if(t.res!=='informativo')stub(t.destino);renderOverlay();break}
    case 'mov-ok':{const t=byId(R.t);const lote=$('#mv-l').value;const rid=t.id;closeOvThen(()=>{const tt=byId(rid);tt.quem=`Recria 2 → ${lote}`;const nid=feito(rid,{reg:{obs:`Movimentação da novilha 5215: origem Recria 2, destino ${lote}`},animais:[]});afterMut();feitoToast(nid,`novilha 5215 movida de Recria 2 para ${lote}`)});break}
    case 'mov-nao':{const t=byId(R.t);const rid=t.id;closeOvThen(()=>{adiar(rid,add(HOJE,7),'Decisão adiada');afterMut();toast({msg:'Sem decisão agora: a sugestão volta em 7 dias',undo:()=>{desfazerAdiar(rid);afterMut();toast({msg:'Desfeito · adiamento cancelado'})}})});break}
    case 'in-ad':ui.D.opt=a.value;break;
    case 'in-admot':{ui.D.mot=a.value;$('#ad-o').hidden=a.value!=='Outro';break}
    case 'in-fdmot':{ui.D.mot=a.value;$('#fd-o').hidden=a.value!=='Outro';$('#okb').disabled=!a.value;break}
    case 'in-cmmot':{ui.D.mot=a.value;$('#okb').disabled=!a.value;break}
    case 'compl-motivo':{abrirDlg('compl',a.dataset.lid);break}
    case 'ok-compl':{const e=S.log.find(x=>x.id==R.t);const mo=ui.D.mot;closeOvThen(()=>{if(e){e.motivo=mo;e.complementado=1;lg({tid:e.tid,titulo:e.titulo,acao:'Motivo informado',motivo:mo,obs:'Complementa o adiamento de '+lgQuando(e)});save()}toast({msg:'Motivo registrado no histórico'})});break}
    case 'in-exmot':{ui.D.mot=a.value;$$('#ov [data-need]').forEach(b=>b.disabled=!a.value);break}
    case 'ok-adiar':{const t=byId(id);const o=ui.D.opt||'amanha';let nd;const mot=ui.D.mot||'';
      if(o==='hoje')nd=HOJE;else if(o==='amanha')nd=add(HOJE,1);else{nd=parseBR($('#ad-d').value);if(!nd||nd<HOJE){$('#ad-e').hidden=false;$('#ad-d').focus();break}}
      const mt=mot==='Outro'?(($('#ad-t').value||'').trim()||'Outro'):mot;const rid=id;
      closeOvThen(()=>{const nx=nextRowId(rid);adiar(rid,nd,mt);afterMut();toast({msg:`Adiada para ${rel(nd)} (${fmtBR(nd)}) · ${t.titulo}`,undo:()=>{desfazerAdiar(rid);afterMut();toast({msg:`Desfeito · ${t.titulo} voltou para ${fmtBR(t.data)}`})}});focusRow(nx)});break}
    case 'in-mo':{ui.D.mot=a.value;$('#mo-o').hidden=a.value!=='Outro';$('#okb').disabled=false;break}
    case 'ok-nao':{const o=ui.D.mot;if(!o)break;const mt=o==='Outro'?($('#mo-t').value.trim()||'Outro'):o;const obs=$('#mo-obs').value.trim();const rid=id;
      closeOvThen(()=>{const nx=nextRowId(rid);const tt=byId(rid);naoVou(rid,mt,obs);afterMut();toast({msg:`Não vou fazer · ${tt.titulo}`,undo:()=>{desfazer(rid);afterMut()}});focusRow(nx)});break}
    case 'ok-fechar':{const mo=ui.D.mot;if(!mo)break;const mt=mo==='Outro'?(($('#fd-t').value||'').trim()||'Outro'):mo;
      const ids=S.tasks.filter(t=>pend(t)&&isCampo(t)&&t.data<=HOJE&&!t.hist&&!t.na).map(t=>t.id);const fixas=S.tasks.filter(t=>pend(t)&&isCampo(t)&&t.data<=HOJE&&!t.hist&&t.na).length;
      closeOvThen(()=>{ids.forEach(i=>adiar(i,add(HOJE,1),mt,'Adiar tudo e fechar o dia'));afterMut();
        toast({msg:fixas?`${ids.length} adiadas para amanhã · ${fixas} não adiáveis continuam hoje`:`Dia fechado · ${ids.length} adiadas para amanhã`,undo:()=>{ids.forEach(desfazerAdiar);afterMut();toast({msg:'Desfeito · as tarefas voltaram para hoje'})}})});break}
    case 'ok-excluir':{const t=byId(id);const v=a.dataset.v;const sr=t.serie;const mot=ui.D.mot;if(!mot)break;
      closeOvThen(()=>{const nx=nextRowId(id);S.tasks=S.tasks.filter(x=>v==='serie'&&sr?!(x.serie===sr&&x.data>=t.data):x.id!==id);lg({tid:id,titulo:t.titulo,acao:'Excluída',motivo:mot,obs:v==='serie'?'Esta e as próximas da série':''});save();afterMut();toast({msg:`Tarefa excluída${v==='serie'?' (e as próximas da série)':''}`});focusRow(nx)});break}
  }
});
function renderSelBarOnly(){const sb=$('.selbar');if(sb){const tmp=document.createElement('div');tmp.innerHTML=selBar(S.tasks.filter(t=>pend(t)&&isCampo(t)&&t.bulk));sb.replaceWith(tmp.firstElementChild)}}
function menuItem(k,id){
  closeMenu();
  const t=byId(id);
  if(k==='adiar1'){const nx=nextRowId(id);const nd=add(t.data>HOJE?t.data:HOJE,1);adiar(id,nd);afterMut();toast({msg:`Adiada para ${rel(nd)} (${fmtBR(nd)}) · ${t.titulo}`,undo:()=>{desfazerAdiar(id);afterMut();toast({msg:`Desfeito · ${t.titulo} voltou para ${fmtBR(t.data)}`})}});focusRow(nx)}
  else if(k==='adiar'){ui.opener='m:'+id;abrirDlg('adiar',id)}
  else if(k==='nao'){ui.opener='m:'+id;abrirDlg('nao',id)}
  else if(k==='ver'){ui.opener='m:'+id;abrirGav('detalhes',id,'')}
  else if(k==='origem'){const h=origemHref(t);if(h)location.href=h;else stub(t.origem||'a origem da tarefa')}
  else if(k==='editar'){ui.opener='m:'+id;abrirGav('editar',id)}
  else if(k==='excluir'){ui.opener='m:'+id;abrirDlg('excluir',id)}
  else if(k==='xls')exportarCSV();
  else if(k==='pdf'){window.print()}
}

/* ───────── inputs, teclado ───────── */
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='q'){clearTimeout(ui._qt);ui._qt=setTimeout(()=>{go({q:el.value.trim()},{only:'list'});renderBarKeep()},180)}
  if(R.gaveta==='registrar'&&['rg-d','rg-dt','rg-c','rg-p','rg-v'].includes(el.id))updRegistrar(byId(R.t));
  if(R.gaveta==='confirmar'&&el.id==='cf-d'){ui.D.dt=el.value;updConfirmar(byId(R.t))}
  if(R.gaveta==='exame'&&['ex-d','ex-h','ex-j','ex-l'].includes(el.id))updExame(byId(R.t));
  if(el.dataset&&el.dataset.a==='in-kg'){ui.D.p[el.dataset.v]=el.value;updPesagem(byId(R.t))}
  if(el.id==='f-t'&&el.value.trim()){el.removeAttribute('aria-invalid');const x=$('#f-te');if(x)x.hidden=true}
});
function renderBarKeep(){
  const q=$('#q');const pos=q?q.selectionStart:0;const had=document.activeElement===q;
  renderBar();const nq=$('#q');if(had&&nq){nq.focus();nq.setSelectionRange(pos,pos)}
}
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='agr')go({agrupar:el.value});
  if(el.id==='ex-f'){el.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
  if(el.tagName==='SELECT'&&el.dataset.a)el.dispatchEvent(new MouseEvent('click',{bubbles:true}));
  if(el.id==='cf-q'||el.id==='rg-q'||el.id==='ex-q'){ui.D.quem=el.value;if(R.gaveta==='registrar')updRegistrar(byId(R.t));if(R.gaveta==='exame')updExame(byId(R.t))}
});
document.addEventListener('keydown',e=>{
  if(R.gaveta){trapKeys(e)}
  if(menuEl||popEl)return;
  const t=e.target;const tag=t.tagName;
  if((e.key==='f'||e.key==='F')&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!R.gaveta&&!['INPUT','TEXTAREA','SELECT'].includes(tag)){
    const row=t.closest&&t.closest('.row');
    if(row){e.preventDefault();primaria(row.dataset.id)}
  }
  if((e.key==='Enter'||e.key===' ')&&t.classList&&t.classList.contains('row')){e.preventDefault();ui.opener='p:'+t.dataset.id;abrirGav('detalhes',t.dataset.id)}
  if(e.key==='Escape'&&!R.gaveta&&ui.sel){ui.sel=false;ui.selIds.clear();renderMain()}
  if(e.key==='Escape'&&$('#sb').classList.contains('open'))fechaSb();
});
document.addEventListener('click',e=>{
  const r=e.target.closest('.row');
  if(r&&!e.target.closest('button,a,label,input,select')&&!R.gaveta){ui.opener='p:'+r.dataset.id;abrirGav('detalhes',r.dataset.id)}
});

/* ───────── atualizar / sem conexão ───────── */
function reconectou(){
  const n=flushFila();ui.dispBanner=false;ui.updHora=hm();renderHdr();renderBanner();renderMain();
  toast({msg:n?`Reconectado · ${n} ${n===1?'registro enviado':'registros enviados'} da fila`:'Reconectado · dados atualizados'});
}
function atualizar(){
  if(ui.spin)return;ui.spin=true;renderHdr();renderBanner();
  setTimeout(()=>{
    ui.spin=false;
    if(ui.erroRede){ui.dispBanner=true;renderHdr();renderBanner();toast({err:1,msg:`Ainda sem conexão${S.fila.length?` · ${S.fila.length} na fila`:''}. Nada foi perdido.`});return}
    reconectou();
  },700);
}
function carregar(){ui.loading=true;renderNums();renderMain();renderLat();renderComun();renderBanner();
  setTimeout(()=>{ui.loading=false;ui.dispBanner=!!ui.erroRede;if(!ui.erroRede)ui.updHora=hm();renderAll()},reduce()?150:900)}
function retry(){atualizar()}

/* ───────── barra de revisão ───────── */
function scenario(k){
  seed();
  if(k==='quase'){S.tasks.filter(t=>pend(t)&&isCampo(t)&&t.data<=HOJE).forEach((t,i,a)=>{if(i<a.length-2){t.st='f';t.feitoEm=HOJE;t.hora='0'+(6+i%3)+':'+p2(10+i*3);t.porQuem=USER}})}
  if(k==='fechado'){S.tasks.filter(t=>pend(t)&&isCampo(t)&&t.data<=HOJE).forEach((t,i)=>{t.st='f';t.feitoEm=HOJE;t.hora='0'+(6+i%3)+':'+p2(10+i*2);t.porQuem=USER})}
  if(k==='vazio'){S.tasks=S.tasks.filter(t=>!(t.data<=HOJE&&!t.hist&&(t.trilho!=='gestao')))}
  save();ui.selIds.clear();ui.sel=false;ui.run=null;fkAgg=null;killToast();
  go({gaveta:'',t:'',aba:'',dia:'',filtro:'',cat:[],q:'',visao:'hoje'});
}
document.getElementById('rev').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tema)setTema(b.dataset.tema);
  if(b.id==='rv-reset'){scenario($('#rv-cen').value)}
  if(b.id==='rv-load'){carregar()}
});
document.getElementById('rv-cen').addEventListener('change',e=>scenario(e.target.value));
document.getElementById('rv-erro').addEventListener('change',e=>{ui.erroRede=e.target.checked;if(ui.erroRede){ui.dispBanner=true;renderBanner();renderHdr()}else reconectou()});

/* sidebar mobile */
function abreSb(){$('#sb').classList.add('open');$('#scrimM').classList.add('on');$('#sbOpen').setAttribute('aria-expanded','true');$('#sb').setAttribute('role','dialog');$('#sb').setAttribute('aria-modal','true');$('#sbX').focus()}
function fechaSb(){$('#sb').classList.remove('open');$('#scrimM').classList.remove('on');$('#sbOpen').setAttribute('aria-expanded','false');$('#sb').removeAttribute('role');$('#sb').removeAttribute('aria-modal');$('#sbOpen').focus()}
document.addEventListener('click',e=>{
  if(e.target.closest('#sbOpen'))abreSb();
  else if(e.target.closest('#sbX')||e.target.id==='scrimM')fechaSb();
  else if(e.target.closest('#sb a')&&$('#sb').classList.contains('open')){fechaSb()}
});

/* ───────── boot ───────── */
(function boot(){
  load();
  let tm='claro';try{tm=localStorage.getItem('cd-tema')||'claro'}catch(e){}
  document.documentElement.setAttribute('data-theme',tm);
  buildShell();
  parseHash();
  if(!location.hash)history.replaceState(null,'','#/agenda');
  ui.loading=true;renderAll();
  setTimeout(()=>{ui.loading=false;renderAll()},reduce()?100:900);
  
})();

</script>
