<!doctype html>
<html lang="pt-BR" data-theme="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluxo completo · Protocolos e Agenda — CowData</title>
<meta name="description" content="Mockup clicável abrangente do fluxo do protocolo sanitário preventivo: cadastro, janela de aplicação, lista de espera, cronograma, agendamento, agenda, aplicação e concluídos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Tokens copiados de frontend/app/globals.css (paleta "azul", padrão de fábrica) ── */
:root, :root[data-theme="claro"] {
  color-scheme: light;
  --ink:#150B10; --gold:#E0A63C; --gold-deep:#B9831F; --pasture:#4E7A5A;
  --vinho:#0B2038; --vinho-light:#2C4A6B; --vinho-dark:#071A2E;
  --dourado:#B9831F; --dourado-light:#E0A63C;
  --bg:#F1F1EF; --surface:#FFFFFF; --surface-2:#E9E9E6; --border:#DBDBD7; --border-strong:#C7C7C2;
  --text:#1E1B18; --text-muted:#5F574E;
  --green-light:#4E7A5A; --red:#A8341C; --amber:#D97706; --blue:#1E6FA8;
  --alert-fg:#A8341C; --overlay:rgba(30,20,25,.45);
  --thead-bg:#F1F4F8; --thead-fg:#0B2038;
  --sidebar-bg:#FFFFFF; --sidebar-fg:#0B2038; --sidebar-muted:#6B7280; --sidebar-border:#E5E7EB;
  --sidebar-active-bg:#12283F; --sidebar-active-fg:#E0A63C; --sidebar-active-border:#B9831F;
  --pill-active-bg:#0B2038; --pill-active-fg:#E0A63C; --pill-active-border:#0B2038;
  --accent-icon:#0B2038; --focus:#B9831F;
  --cat-reproducao:#8B7FF0; --cat-sanidade:#4E7A5A; --cat-alimentacao:#E0A63C; --cat-gestao:#5B8FB0;
  --cat-financeiro:#7A2233; --cat-estoque:#C98A2A; --cat-recria:#B0894A; --cat-acesso:#9A5560;
  /* estados (texto ≥4.5:1 sobre --surface) */
  --st-red:#A8341C; --st-amber:#8A4B00; --st-blue:#34536F; --st-green:#256E48; --st-muted:#5F5850;
  --btn-gold-bg:#8A6D2F; --btn-gold-fg:#FFFFFF; --btn-gold-hover:#755B25;
  --r-sm:2px; --shadow-sm:0 1px 4px rgba(20,30,45,.10);
  --rb-h:44px;
  --font-body:'Archivo','Inter',system-ui,sans-serif;
}
:root[data-theme="escuro"] {
  color-scheme: dark;
  --bg:color-mix(in srgb,#0B2038 12%,#050304); --surface:color-mix(in srgb,#0B2038 14%,#0F0A0C);
  --surface-2:color-mix(in srgb,#0B2038 16%,#170F13); --border:color-mix(in srgb,#0B2038 22%,#2A1A20);
  --border-strong:color-mix(in srgb,#0B2038 30%,#3A2A30);
  --text:#F0E8EC; --text-muted:#A99AA1;
  --green-light:#4E7A5A; --alert-fg:#E07070;
  --overlay:rgba(0,0,0,.7);
  --thead-bg:color-mix(in srgb,#0B2038 80%,#071A2E); --thead-fg:#E0A63C;
  --sidebar-bg:var(--surface); --sidebar-fg:#F0E8EC; --sidebar-muted:#A99AA1; --sidebar-border:var(--border);
  --sidebar-active-bg:rgba(11,32,56,.7); --sidebar-active-fg:#E0A63C; --sidebar-active-border:#B9831F;
  --pill-active-bg:rgba(11,32,56,.7); --pill-active-fg:#E0A63C; --pill-active-border:#B9831F;
  --accent-icon:#E0A63C; --focus:#E0A63C;
  --st-red:#F08A7A; --st-amber:#F2B450; --st-blue:#9DBAD6; --st-green:#7FC79A; --st-muted:#A99AA1;
  --btn-gold-bg:#E0A63C; --btn-gold-fg:#1A1206; --btn-gold-hover:#F0C874;
  --shadow-sm:none;
}
:root[data-theme="misto"] {
  color-scheme: light;
  --sidebar-bg:#0B2038; --sidebar-fg:#F5EEF1; --sidebar-muted:rgba(245,238,241,.72); --sidebar-border:rgba(255,255,255,.12);
  --sidebar-active-bg:rgba(255,255,255,.14); --sidebar-active-fg:#E0A63C; --sidebar-active-border:#B9831F;
  --thead-bg:#F3F4F6;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-body);font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
::selection{background:color-mix(in srgb,var(--dourado-light) 45%,transparent);color:var(--text)}
input,select,textarea{caret-color:var(--dourado)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--vinho-light);border-radius:3px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible,summary:focus-visible{
  outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--focus)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:400;background:var(--vinho);color:#fff;padding:.6rem 1rem;border:0;border-radius:2px}
.skip:focus{top:calc(var(--rb-h) + 6px)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
svg.i.s12{width:12px;height:12px}svg.i.s14{width:14px;height:14px}svg.i.s18{width:18px;height:18px}svg.i.s20{width:20px;height:20px}svg.i.s28{width:28px;height:28px}

/* ── Barra de revisão (fora do shell do app) ── */
.rb{position:sticky;top:0;z-index:300;height:var(--rb-h);display:flex;align-items:center;gap:.9rem;padding:0 .9rem;background:#1E1B18;color:#F5EEF1;font-size:12px;overflow-x:auto;white-space:nowrap;border-bottom:1px solid #000}
.rb strong{font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#E0A63C}
.rb .grp{display:inline-flex;gap:0;border:1px solid rgba(255,255,255,.25);border-radius:2px}
.rb button,.rb summary{background:transparent;color:#F5EEF1;border:0;padding:0 .7rem;height:28px;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:.35rem}
.rb .grp button[aria-pressed="true"]{background:#E0A63C;color:#1A1206;font-weight:700}
.rb .btn-r{border:1px solid rgba(255,255,255,.25);border-radius:2px}
.rb label{display:inline-flex;align-items:center;gap:.4rem;cursor:pointer}
.rb input[type=checkbox]{width:16px;height:16px;accent-color:#E0A63C}
.rb button:focus-visible,.rb summary:focus-visible,.rb input:focus-visible{box-shadow:0 0 0 2px #1E1B18,0 0 0 4px #E0A63C}
.rb details{position:relative}
.rb details[open] .roteiro{display:block}
.roteiro{display:none;position:fixed;top:calc(var(--rb-h) + 4px);left:.9rem;width:min(460px,calc(100vw - 1.8rem));background:#1E1B18;color:#F5EEF1;border:1px solid rgba(255,255,255,.25);padding:.9rem 1.1rem;white-space:normal;font-size:12.5px;line-height:1.55;max-height:70vh;overflow:auto}
.roteiro ol{margin:.4rem 0 0;padding-left:1.1rem}

/* ── Shell (Sidebar + área principal) ── */
.shell{display:flex;height:calc(100vh - var(--rb-h));height:calc(100dvh - var(--rb-h))}
.sb{width:196px;flex:none;background:var(--sidebar-bg);border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;position:relative;height:100%;z-index:50}
.sb-collapse{position:absolute;top:1.1rem;right:-11px;z-index:10;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--sidebar-bg);border:1px solid var(--sidebar-border);color:var(--sidebar-muted);cursor:pointer;padding:0}
.sb-logo{padding:1rem;border-bottom:1px solid var(--sidebar-border)}
.sb-logo .in{display:flex;flex-direction:column;gap:4px;padding:.5rem}
.sb-word{font-weight:800;font-size:1.05rem;letter-spacing:-.01em;color:var(--sidebar-fg);white-space:nowrap}
.sb-word b{color:var(--dourado-light);font-weight:800}
.sb-fz{font-size:.6rem;line-height:1.2;color:var(--sidebar-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:root[data-theme="misto"] .sb-word{color:#F5EEF1}
.sb-nav{flex:1;min-height:0;overflow-y:auto;padding:12px}
.sb-nav>div+div{margin-top:4px}
.sb-grp{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--sidebar-muted);margin:.7rem 0 .3rem .6rem;white-space:nowrap}
.sb-nav>div:first-child .sb-grp{margin-top:0}
.sb a{display:flex;align-items:center;gap:12px;padding:6px 12px;border-radius:8px;font-size:10px;font-weight:500;text-decoration:none;color:var(--sidebar-muted);border-left:3px solid transparent;transition:background .15s,color .15s}
.sb a:hover{background:color-mix(in srgb,var(--sidebar-fg) 6%,transparent)}
.sb a[aria-current="page"]{background:var(--sidebar-active-bg);color:var(--sidebar-active-fg);border-left-color:var(--sidebar-active-border)}
.sb-portal{padding:8px;border-top:1px solid var(--sidebar-border)}
.sb-portal a{gap:8px;padding:8px 9.6px;border:1px solid var(--sidebar-border);font-weight:600}
.sb-portal a span{flex:1}
.sb-foot{padding:8px;border-top:1px solid var(--sidebar-border);text-align:center;font-size:.65rem;color:var(--sidebar-muted)}
.sb-foot .ok{display:flex;gap:6px;justify-content:center;align-items:center;color:var(--st-green)}
:root[data-theme="misto"] .sb-foot .ok{color:#9BD3AE}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.sb-foot .who{display:flex;gap:6px;align-items:center;justify-content:center;color:var(--sidebar-fg);margin:4px 0;font-size:.68rem}
.sb-foot button{background:none;border:1px solid var(--sidebar-border);border-radius:var(--r-sm);padding:3.2px 8.8px;color:var(--sidebar-muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:.68rem}
.sb-x{display:none}
.mtop{display:none}
.sb-scrim{display:none}
.mainwrap{flex:1;min-width:0;position:relative;height:100%}
.top-actions{position:absolute;top:.75rem;right:1.25rem;z-index:60;display:inline-flex;align-items:center;gap:.5rem}
.top-actions .news{display:inline-flex;gap:.4rem;align-items:center;background:var(--vinho);color:#C9A44C;border:1px solid var(--vinho-light);border-radius:999px;padding:.4rem .9rem;font-size:.78rem;font-weight:700;cursor:pointer;min-height:36px}
.top-actions .news svg{color:#C9A44C}
.top-actions .tema{display:inline-flex;gap:.4rem;align-items:center;background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border);border-radius:var(--r-sm);padding:.4rem .7rem;font-size:.78rem;cursor:pointer;min-height:36px}
.top-actions .bell{position:relative;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);padding:0}
.top-actions .bell b{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#A8341C;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.app-main{height:100%;overflow-y:auto;overflow-x:hidden}
.subnav{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border);padding:0 calc(240px + 2rem) 0 1.5rem}
.subnav .row{display:flex;gap:.15rem;overflow-x:auto;white-space:nowrap}
.subnav .row.sec{background:var(--surface-2);border-top:1px solid var(--border)}
.subnav button{background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;color:var(--text-muted);font-weight:700;text-transform:uppercase;display:flex;align-items:center;gap:.35rem;min-height:44px}
.subnav .row.pri button{font-size:12px;letter-spacing:.07em;padding:.7rem .9rem}
.subnav .row.sec button{font-size:12px;letter-spacing:.05em;padding:.45rem .75rem}
.subnav .row.pri button[aria-current="page"]{color:var(--vinho);border-bottom-color:var(--dourado)}
.subnav .row.sec button[aria-current="page"]{color:var(--text);border-bottom-color:var(--dourado-light)}
:root[data-theme="escuro"] .subnav .row.pri button[aria-current="page"]{color:var(--dourado-light)}
.page{padding:1.25rem 1.5rem 3rem;max-width:1500px}
.pg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.pg-head h1{font-size:1.75rem;display:flex;align-items:center;gap:.6rem;line-height:1.2}
.pg-head h1 svg{color:var(--dourado);width:26px;height:26px}
.pg-head .sub{color:var(--text-muted);margin-top:.25rem;max-width:62ch;font-size:14px}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}

/* ── Botões (paridade com .btn-primary / .btn-primary-gold / .btn-ghost / .btn-secondary) ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:44px;padding:.5rem 1.1rem;border-radius:var(--r-sm);font-size:1rem;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,color .15s;border:1px solid transparent;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--vinho);color:#fff;border-color:var(--vinho)}
.btn-primary:hover{background:color-mix(in srgb,var(--vinho) 85%,black)}
:root[data-theme="escuro"] .btn-primary{border-color:var(--vinho-light);background:var(--vinho-light)}
.btn-gold{background:var(--btn-gold-bg);color:var(--btn-gold-fg);border-color:var(--btn-gold-bg)}
.btn-gold:hover{background:var(--btn-gold-hover);border-color:var(--btn-gold-hover)}
.btn-ghost{background:transparent;color:var(--text-muted);border-color:var(--border-strong)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-sec{background:var(--surface-2);color:var(--text);border-color:var(--border-strong)}
.btn-sec:hover{background:var(--surface);border-color:var(--gold-deep)}
.btn-danger{background:transparent;color:var(--alert-fg);border-color:color-mix(in srgb,var(--alert-fg) 55%,transparent)}
.btn-danger:hover{background:color-mix(in srgb,var(--alert-fg) 10%,transparent)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:44px;padding:.35rem .8rem;font-size:.9375rem}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent;border-radius:var(--r-sm);color:var(--text-muted);cursor:pointer;padding:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--border)}
.linkbtn{background:none;border:0;padding:.85rem .2rem;margin:-.85rem 0;color:var(--vinho-light);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit;display:inline-block}
:root[data-theme="escuro"] .linkbtn{color:var(--dourado-light)}

/* ── Formulários ── */
.fld{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.fld>label,.lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)}
.inp,.sel{min-height:44px;padding:.5rem .7rem;background:var(--surface);color:var(--text);border:1px solid var(--border-strong);border-radius:var(--r-sm);font:inherit;font-size:1rem;width:100%;min-width:0}
.inp::placeholder{color:var(--text-muted);opacity:.85}
textarea.inp{min-height:72px;resize:vertical}
.inp[aria-invalid="true"]{border-color:var(--alert-fg)}
.err{color:var(--alert-fg);font-size:12.5px;display:flex;gap:.35rem;align-items:center}
.hint{color:var(--text-muted);font-size:12.5px}
.search{position:relative;flex:1 1 220px;min-width:180px}
.search svg{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}
.search .inp{padding-left:2.2rem}
.chk{display:flex;align-items:center;gap:.6rem;min-height:44px;cursor:pointer;font-size:.875rem}
.chk input{width:20px;height:20px;accent-color:var(--dourado);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;min-height:44px;padding:.3rem .8rem;border:1px solid var(--border-strong);border-radius:999px;background:var(--surface);cursor:pointer;font-size:.8125rem}
.chip input{width:18px;height:18px;accent-color:var(--dourado)}
.chip:has(input:checked){background:var(--pill-active-bg);color:var(--pill-active-fg);border-color:var(--pill-active-border)}
.chip:has(input:focus-visible){box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--focus)}

/* Pílulas de aba/filtro (TabBar) */
.tabbar{display:inline-flex;gap:.35rem;flex-wrap:wrap}
.tabpill{min-height:44px;padding:.4rem 1rem;border-radius:999px;border:1px solid var(--border-strong);background:transparent;color:var(--text-muted);cursor:pointer;font-size:.875rem;font-weight:500;display:inline-flex;align-items:center;gap:.4rem}
.tabpill:hover{background:var(--surface-2);color:var(--text)}
.tabpill[aria-pressed="true"],.tabpill[aria-selected="true"]{background:var(--pill-active-bg);color:var(--pill-active-fg);border-color:var(--pill-active-border);font-weight:700}
.filters{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:.9rem}
.filters .sel{width:auto;min-width:170px;flex:0 1 200px}

/* ── Cartões / faixas ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);box-shadow:var(--shadow-sm)}
.card.pad{padding:1rem}
.card-h{padding:.7rem 1rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12px;color:var(--vinho);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
:root[data-theme="escuro"] .card-h{color:var(--dourado-light)}
.strip{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-sm);margin-bottom:1rem;overflow:hidden}
.strip button{background:transparent;border:0;border-right:1px solid var(--border);padding:.7rem 1rem;text-align:left;cursor:pointer;display:flex;align-items:center;gap:.8rem;min-height:64px;color:var(--text)}
.strip button:last-child{border-right:0}
.strip button:hover{background:var(--surface-2)}
.strip button[aria-pressed="true"]{background:var(--surface-2);box-shadow:inset 0 -2px 0 var(--dourado)}
.strip .num{font-size:1.75rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em;min-width:2.2ch}
.strip .lab{display:flex;flex-direction:column;gap:2px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em}
.strip .lab small{font-weight:400;text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--text-muted)}
.strip .t-red{color:var(--st-red)}.strip .t-amber{color:var(--st-amber)}.strip .t-green{color:var(--st-green)}
.result-line{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;margin:0 0 .6rem;color:var(--text-muted);font-size:13px}

/* ── Tabela (fazenda-table) ── */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm)}
table.ft{width:100%;border-collapse:collapse;font-size:1rem}
.ft thead tr{background:var(--thead-bg)}
.ft thead th{padding:9px 12px;text-align:left;color:var(--thead-fg);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;white-space:nowrap;border-bottom:1px solid var(--border-strong)}
.ft tbody tr{border-bottom:1px solid var(--border);transition:background .15s}
.ft tbody tr:last-child{border-bottom:0}
.ft tbody td{padding:8px 12px;vertical-align:middle;font-variant-numeric:tabular-nums}
.ft tbody tr:hover{background:var(--surface-2)}
.ft tr.grp td{background:var(--surface-2);padding:.55rem 12px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;border-bottom:1px solid var(--border-strong)}
.ft tr.grp:hover{background:var(--surface-2)}
.ft tr.grp .g{display:flex;align-items:center;gap:.5rem}
.ft tr.grp .g.red{color:var(--st-red)}.ft tr.grp .g.amber{color:var(--st-amber)}.ft tr.grp .g.green{color:var(--st-green)}.ft tr.grp .g.mut{color:var(--text-muted)}
.ft tr.grp .cnt{font-weight:400;letter-spacing:0;text-transform:none;color:var(--text-muted)}
.ft tr.lin{cursor:pointer}
.ft tr.lin:hover{background:color-mix(in srgb,var(--dourado) 9%,var(--surface))}
.ft tr.lin:focus-visible{box-shadow:inset 0 0 0 2px var(--focus)}
.ft tr.lin:hover .nm{text-decoration:underline;text-underline-offset:3px}
.nm{font-weight:700;font-size:.9375rem}
.sub2{font-size:12.5px;color:var(--text-muted)}
.ft td.acts{text-align:right;white-space:nowrap;width:1%}
.ft td.acts .btn{margin-right:.25rem}
.ft tr.pulada .nm,.ft tr.pulada .quem{text-decoration:line-through;color:var(--text-muted)}
.ft td.num,.ft th.num{text-align:right}

/* Estados: cor + ícone + texto */
.st{display:inline-flex;align-items:center;gap:.4rem;padding:.2rem .6rem;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid;white-space:nowrap}
.st.prevista{color:var(--st-muted);border:1px dashed var(--st-muted);background:transparent}
.st.vence{color:var(--st-amber);border-color:color-mix(in srgb,var(--st-amber) 60%,transparent);background:color-mix(in srgb,var(--amber) 12%,var(--surface))}
.st.confirmada{color:var(--st-blue);border-color:color-mix(in srgb,var(--st-blue) 55%,transparent);background:color-mix(in srgb,var(--st-blue) 11%,var(--surface))}
.st.registrada{color:var(--st-green);border-color:color-mix(in srgb,var(--st-green) 55%,transparent);background:color-mix(in srgb,var(--st-green) 11%,var(--surface))}
.st.atrasada{color:var(--st-red);border-color:color-mix(in srgb,var(--st-red) 55%,transparent);background:color-mix(in srgb,var(--st-red) 10%,var(--surface))}
.st.pulada{color:var(--st-muted);border-color:var(--border-strong);text-decoration:line-through;background:var(--surface-2)}
.st.andamento{color:var(--st-blue);border-color:color-mix(in srgb,var(--st-blue) 55%,transparent);background:color-mix(in srgb,var(--st-blue) 11%,var(--surface))}
.st.interrompido{color:var(--st-amber);border-color:color-mix(in srgb,var(--st-amber) 60%,transparent);background:color-mix(in srgb,var(--amber) 12%,var(--surface))}
.st.engano{color:var(--st-muted);border:1px dashed var(--st-muted)}
.st.ativo{color:var(--st-green);border-color:color-mix(in srgb,var(--st-green) 55%,transparent);background:color-mix(in srgb,var(--st-green) 11%,var(--surface))}
.st.inativo{color:var(--st-muted);border:1px dashed var(--st-muted)}
.badge{display:inline-flex;align-items:center;gap:.3rem;padding:.1rem .55rem;border-radius:999px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:color-mix(in srgb,var(--c) 62%,var(--text));border:1px solid var(--c)}
.b-sanidade{--c:var(--cat-sanidade)}.b-reproducao{--c:var(--cat-reproducao)}.b-gestao{--c:var(--cat-gestao)}.b-recria{--c:var(--cat-recria)}.b-estoque{--c:var(--cat-estoque)}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;align-items:center;font-size:12.5px;color:var(--text-muted);padding:.7rem 1rem;border-top:1px solid var(--border);background:var(--surface)}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.legend .ic-red{color:var(--st-red)}.legend .ic-amber{color:var(--st-amber)}.legend .ic-blue{color:var(--st-blue)}.legend .ic-green{color:var(--st-green)}.legend .ic-mut{color:var(--st-muted)}
.car{display:inline-flex;gap:.3rem;align-items:center;font-size:12.5px;color:var(--text-muted)}

/* barra de progresso (linear) */
.bar{height:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:2px;min-width:70px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--st-green)}
.bar.amber i{background:var(--amber)}.bar.red i{background:var(--st-red)}

/* Estado vazio */
.empty{border:2px dashed var(--border-strong);background:var(--surface-2);padding:2rem 1.5rem;text-align:center;border-radius:var(--r-sm);display:flex;flex-direction:column;align-items:center;gap:.8rem}
.empty h2{font-size:1.35rem}
.empty p{color:var(--text-muted);max-width:56ch}
.empty .ico{color:var(--accent-icon)}
.aviso{display:flex;gap:.6rem;align-items:flex-start;padding:.7rem .9rem;border:1px solid;border-radius:var(--r-sm);font-size:13.5px;line-height:1.45}
.aviso svg{margin-top:2px}
.aviso.amber{color:var(--st-amber);border-color:color-mix(in srgb,var(--st-amber) 50%,transparent);background:color-mix(in srgb,var(--amber) 10%,var(--surface))}
.aviso.red{color:var(--st-red);border-color:color-mix(in srgb,var(--st-red) 50%,transparent);background:color-mix(in srgb,var(--st-red) 8%,var(--surface))}
.aviso.blue{color:var(--st-blue);border-color:color-mix(in srgb,var(--st-blue) 50%,transparent);background:color-mix(in srgb,var(--st-blue) 8%,var(--surface))}
.aviso.green{color:var(--st-green);border-color:color-mix(in srgb,var(--st-green) 50%,transparent);background:color-mix(in srgb,var(--st-green) 8%,var(--surface))}
.aviso .txt{color:var(--text)}
.aviso .txt b{font-weight:700}
.aviso .acts{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap}

/* Mês / Ano */
.cal-h{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem}
.cal-h h2{font-size:1.1rem;min-width:11ch;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--border-strong);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.cal .dow{background:var(--thead-bg);color:var(--thead-fg);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:.5rem;text-align:center;border-bottom:1px solid var(--border-strong)}
.cal .day{min-height:76px;border:0;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:transparent;padding:.35rem .4rem;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:.25rem;color:var(--text);font-variant-numeric:tabular-nums}
.cal .day:nth-child(7n){border-right:0}
.cal .day:hover{background:var(--surface-2)}
.cal .day.out{color:var(--text-muted);background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.cal .day.hoje .d{background:var(--vinho);color:#fff;border-radius:999px;padding:0 .4rem}
:root[data-theme="escuro"] .cal .day.hoje .d{background:var(--dourado-light);color:#1A1206}
.cal .day[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--dourado);background:var(--surface-2)}
.cal .d{font-size:12.5px;font-weight:700;align-self:flex-start}
.cal .cnt{display:inline-flex;align-items:center;gap:.25rem;font-size:12.5px;font-weight:700}
.cal .cnt.red{color:var(--st-red)}.cal .cnt.amber{color:var(--st-amber)}.cal .cnt.blue{color:var(--st-blue)}.cal .cnt.green{color:var(--st-green)}.cal .cnt.mut{color:var(--st-muted)}
.matrix th,.matrix td{text-align:center;padding:6px 6px}
.matrix th:first-child,.matrix td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;min-width:150px}
.matrix thead th:first-child{background:var(--thead-bg)}
.matrix .cell{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:.2rem;border:1px solid transparent;border-radius:var(--r-sm);background:transparent;font-weight:700;cursor:pointer;font-size:12.5px}
.matrix .cell:hover{background:var(--surface-2);border-color:var(--border-strong)}
.matrix .cell.red{color:var(--st-red)}.matrix .cell.amber{color:var(--st-amber)}.matrix .cell.blue{color:var(--st-blue)}.matrix .cell.green{color:var(--st-green)}.matrix .cell.mut{color:var(--st-muted)}
.matrix .mes-atual{background:color-mix(in srgb,var(--dourado) 8%,transparent)}

/* ── Drawer (gaveta) / Modal ── */
.scrim{position:fixed;inset:var(--rb-h) 0 0 0;background:var(--overlay);z-index:100;animation:fade .18s ease-out}
.drawer{position:fixed;top:var(--rb-h);right:0;bottom:0;width:min(600px,100vw);background:var(--surface);border-left:1px solid var(--border-strong);z-index:110;display:flex;flex-direction:column;animation:slide .24s cubic-bezier(.16,1,.3,1)}
.drawer.wide{width:min(860px,100vw)}
@keyframes fade{from{opacity:0}}@keyframes slide{from{transform:translateX(24px);opacity:0}}
.dr-h{padding:1rem 1.25rem .8rem;border-bottom:1px solid var(--border);display:flex;gap:.8rem;align-items:flex-start;justify-content:space-between}
.dr-h .k{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--text-muted)}
.dr-h h2{font-size:1.25rem;line-height:1.25;margin:.15rem 0 .4rem}
.dr-h .meta{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--text-muted)}
.dr-b>*{flex-shrink:0}
.dr-b{flex:1;min-height:0;overflow-y:auto;padding:1rem 1.25rem;display:flex;flex-direction:column;gap:1rem}
.dr-f{padding:.8rem 1.25rem;border-top:1px solid var(--border);display:flex;gap:.5rem;flex-wrap:wrap;background:var(--surface);align-items:center}
.dr-f .sp{flex:1}
.dtabs{display:flex;gap:.15rem;border-bottom:1px solid var(--border);margin:0 -1.25rem;padding:0 1.25rem}
.dtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:.6rem .9rem;min-height:44px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);cursor:pointer}
.dtabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--dourado)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.35rem 1rem;font-size:13.5px}
.kv dt{color:var(--text-muted)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
.box{border:1px solid var(--border);border-radius:var(--r-sm);padding:.8rem .9rem;background:var(--surface-2)}
.box h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);margin-bottom:.5rem;display:flex;align-items:center;gap:.4rem}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:.7rem;padding:.35rem 0;border-bottom:1px solid var(--border);min-height:48px;flex-wrap:wrap}
.list li:last-child{border-bottom:0}
.list li .grow{flex:1;min-width:0}
.list li.rem .nm2{text-decoration:line-through;color:var(--text-muted)}
.inline-panel{border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--r-sm);padding:.9rem;display:flex;flex-direction:column;gap:.7rem}
.inline-panel h3{font-size:.95rem}
.resumo{border:1px solid var(--border-strong);background:var(--surface-2);border-radius:var(--r-sm);padding:.9rem 1rem}
.resumo h3{font-size:12px;text-transform:uppercase;letter-spacing:.11em;color:var(--text-muted);margin-bottom:.6rem}
.resumo ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:.55rem 1rem}
.resumo li{display:flex;flex-direction:column;font-size:12.5px;color:var(--text-muted)}
.resumo li b{font-size:1.05rem;color:var(--text);font-weight:800;font-variant-numeric:tabular-nums}
.resumo li b.warn{color:var(--st-amber)}
.resumo .fr{margin-top:.7rem;font-size:13.5px;color:var(--text)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.stepper{display:flex;gap:.4rem;align-items:center;font-size:12.5px;flex-wrap:wrap}
.stepper li{list-style:none;display:flex;align-items:center;gap:.4rem;color:var(--text-muted);font-weight:600}
.stepper ol{display:flex;gap:.9rem;margin:0;padding:0;flex-wrap:wrap}
.stepper .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--border-strong);display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.stepper li[aria-current="step"]{color:var(--text)}
.stepper li[aria-current="step"] .n{background:var(--pill-active-bg);color:var(--pill-active-fg);border-color:var(--pill-active-border)}
.stepper li.done .n{background:var(--st-green);color:var(--surface);border-color:var(--st-green)}
.menu{position:fixed;z-index:200;min-width:210px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-sm);box-shadow:var(--shadow-sm);padding:.25rem}
.menu button{display:flex;width:100%;align-items:center;gap:.6rem;min-height:44px;padding:.4rem .7rem;background:transparent;border:0;text-align:left;cursor:pointer;font-size:.875rem;color:var(--text);border-radius:var(--r-sm)}
.menu button:hover,.menu button:focus-visible{background:var(--surface-2)}
.menu hr{border:0;border-top:1px solid var(--border);margin:.2rem 0}

/* Toasts */
/* TOAST:START — CSS do toast agregado (desktop e mobile) */
.toasts{position:fixed;z-index:500;bottom:1rem;left:1rem;display:flex;flex-direction:column-reverse;gap:.5rem;align-items:flex-start;width:min(560px,92vw);min-width:280px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:.8rem;background:var(--vinho);color:#fff;border:1px solid var(--vinho-light);border-radius:var(--r-sm);padding:.6rem .6rem .6rem 1rem;font-size:.875rem;animation:toast .22s cubic-bezier(.16,1,.3,1);width:100%}
:root[data-theme="escuro"] .toast{background:#0F2A48;border-color:var(--dourado)}
.toast svg.ok{color:#7FC79A}
.toast{min-width:280px}
.toast .msg{flex:1;overflow-wrap:normal;word-break:normal;hyphens:none}
.toast button{background:transparent;color:#E0A63C;border:1px solid rgba(224,166,60,.6);border-radius:var(--r-sm);min-height:44px;padding:0 .9rem;font-weight:700;cursor:pointer;white-space:nowrap}
.toast button:hover{background:rgba(224,166,60,.15)}
.toast .x{border:0;color:#fff;padding:0;width:44px}
.toast button[disabled]{opacity:.7;cursor:not-allowed}
@media (max-width:767px){.toasts{left:.5rem;right:.5rem;width:auto;min-width:0}.has-drawer .toasts{bottom:96px}.toast{flex-wrap:wrap;padding:.6rem;min-width:0}.toast .msg{flex:1 1 calc(100% - 44px)}.toast .ac{flex:1 1 auto}.toast .x{margin-left:auto}}
/* TOAST:END */
@keyframes toast{from{opacity:0;transform:translateY(12px)}}

/* Protocolos — grade animal × dia */
.grade{border-collapse:collapse;font-size:.8125rem;min-width:100%}
.grade th,.grade td{border:1px solid var(--border);padding:0;text-align:center}
.grade thead th{background:var(--thead-bg);color:var(--thead-fg);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:6px 8px;white-space:nowrap}
.grade thead th small{display:block;text-transform:none;letter-spacing:0;font-weight:400;color:var(--text-muted)}
.grade th.an,.grade td.an{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;padding:4px 10px;min-width:132px;white-space:nowrap}
.grade thead th.an{background:var(--thead-bg)}
.gc{width:100%;min-width:84px;min-height:44px;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:600;padding:2px 4px}
.gc:hover{background:var(--surface-2)}
.gc.feito{color:var(--st-green)}.gc.atrasado{color:var(--st-red);background:color-mix(in srgb,var(--st-red) 8%,transparent)}.gc.hoje{color:var(--st-amber)}.gc.pend{color:var(--st-muted)}
.gc[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--dourado)}
.gc small{font-size:12px;font-weight:400}
.frasco{display:flex;align-items:center;gap:.6rem;min-height:44px;padding:.3rem .6rem;border:1px solid var(--border-strong);border-radius:var(--r-sm);cursor:pointer;background:var(--surface)}
.frasco input{accent-color:var(--dourado);width:18px;height:18px}
.frasco:has(input:checked){border-color:var(--dourado);background:color-mix(in srgb,var(--dourado) 8%,var(--surface))}
.frasco.vencido{opacity:.85}

/* Impressão simulada */
.print-ov{position:fixed;inset:var(--rb-h) 0 0 0;z-index:120;background:var(--overlay);overflow:auto;padding:1rem}
.print-bar{max-width:820px;margin:0 auto .8rem;display:flex;gap:.5rem;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);padding:.6rem .8rem;border:1px solid var(--border-strong)}
.paper{max-width:820px;margin:0 auto;background:#fff;color:#111;padding:2rem 2.2rem;font-size:13px;border:1px solid #bbb}
.paper h2{font-size:1.25rem;color:#111;margin-bottom:.2rem}
.paper table{width:100%;border-collapse:collapse;margin:.6rem 0 1.1rem}
.paper th,.paper td{border:1px solid #888;padding:6px 8px;text-align:left;font-size:12.5px}
.paper th{background:#eee;text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.paper .box0{display:inline-block;width:16px;height:16px;border:1.5px solid #111;vertical-align:middle}
.paper .sign{display:flex;gap:2rem;margin-top:2.2rem}
.paper .sign div{flex:1;border-top:1px solid #111;padding-top:.3rem;font-size:12px}

/* Rascunho / faixa */
.faixa{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;padding:.7rem 1rem;background:color-mix(in srgb,var(--st-blue) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--st-blue) 45%,transparent);border-radius:var(--r-sm);margin-bottom:1rem;color:var(--text)}
.faixa svg{color:var(--st-blue)}
.faixa .sp{flex:1}
.pager{display:flex;align-items:center;gap:.6rem;justify-content:flex-end;padding:.6rem 0;color:var(--text-muted);font-size:13px}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1rem;align-items:start}
.sel-row{display:flex;align-items:flex-start;gap:.8rem;padding:.7rem .8rem;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;min-height:44px;width:100%;text-align:left}
.sel-row:has(input:checked){border-color:var(--dourado);background:color-mix(in srgb,var(--dourado) 7%,var(--surface))}
.sel-row input{width:18px;height:18px;margin-top:3px;accent-color:var(--dourado)}
.sel-row:has(input:focus-visible){box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--focus)}
.ico-cat{width:28px;height:28px;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:color-mix(in srgb,var(--c) 60%,var(--text));flex:none}
.tag-tarefa{--c:var(--cat-recria)}

/* ── Responsivo ── */
@media (max-width:1100px){.subnav{padding-right:1.5rem}.top-actions{position:static;padding:.6rem 1.5rem 0;justify-content:flex-end;display:flex}.two{grid-template-columns:1fr}}
@media (max-width:767px){
  html,body{height:auto}
  :root{--mtop-h:52px}
  .shell{display:block;height:auto;min-height:calc(100dvh - var(--rb-h))}
  .mtop{display:flex;align-items:center;gap:.6rem;position:sticky;top:var(--rb-h);z-index:30;height:var(--mtop-h);padding:0 .5rem 0 .75rem;background:var(--sidebar-bg);border-bottom:1px solid var(--sidebar-border);color:var(--sidebar-fg)}
  .mtop .icon-btn{color:var(--sidebar-fg)}
  .mtop .w{font-weight:800;font-size:.9rem}.mtop .w b{color:var(--dourado-light)}
  .mtop .f{font-size:.7rem;color:var(--sidebar-muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sb{position:fixed;top:var(--rb-h);bottom:0;left:0;width:224px;transform:translateX(-100%);transition:transform .2s;z-index:150;height:auto}
  .sb.open{transform:none}
  .sb-collapse{display:none}
  .sb-scrim{display:block;position:fixed;inset:var(--rb-h) 0 0 0;background:rgba(0,0,0,.55);z-index:140}
  .sb-scrim[hidden]{display:none}
  .mainwrap{height:auto}
  .app-main{height:auto;overflow:visible}
  .top-actions{display:none}
  .subnav{position:sticky;top:calc(var(--rb-h) + var(--mtop-h));padding:0 .5rem}
  .page{padding:1rem 1rem 3rem}
  .pg-head h1{font-size:1.75rem}
  .pg-head .actions{width:100%}
  .pg-head .actions .btn{flex:1 1 auto}
  .strip{grid-template-columns:1fr}
  .strip button{border-right:0;border-bottom:1px solid var(--border);min-height:56px}
  .strip button:last-child{border-bottom:0}
  .filters .sel,.filters .search{flex:1 1 100%;width:100%}
  .filters .tabbar{width:100%}.filters .tabbar .tabpill{flex:1;justify-content:center}
  .inp,.sel{font-size:16px}
  .g2{grid-template-columns:1fr}
  .drawer,.drawer.wide{width:100vw}
  .cal .day{min-height:64px;padding:.25rem}
  .cal .cnt{font-size:12px}
  .toasts{left:.5rem;right:.5rem;width:auto;bottom:.5rem}
  .resumo ul{grid-template-columns:1fr 1fr}
  /* tabelas viram cartões */
  .cards thead{display:none}
  .cards,.cards tbody{display:block;width:100%}
  .tw.cards-w{border:0;background:transparent;overflow:visible}
  .cards tr.lin,.cards tr.rowc{display:grid;grid-template-columns:1fr auto;gap:.25rem .6rem;padding:.8rem;background:var(--surface);border:1px solid var(--border);margin-bottom:.5rem;border-radius:var(--r-sm)}
  .cards tr.lin td,.cards tr.rowc td{display:block;padding:0;border:0}
  .cards tr.grp{display:block;margin:.6rem 0 .4rem;border:0;background:transparent}
  .cards tr.grp td{display:block;background:transparent;padding:.2rem 0;border:0}
  .cards td[data-c="estado"]{grid-column:1;grid-row:1}
  .cards td[data-c="data"]{grid-column:2;grid-row:1;text-align:right;font-weight:700}

.ag-root .ag-ic{flex-shrink:0;display:inline-block;vertical-align:middle}
.ag-root .ag-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ag-root .ag-sp{flex:1}
.ag-root .ag-main{max-width:1440px;margin:0 auto;padding:0 24px 40px}
.ag-root .ag-main[inert]{opacity:1}
.ag-root .ag-tnum{font-variant-numeric:tabular-nums}

/* botões */
.ag-root .ag-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border-radius:var(--r-sm,2px);border:1px solid var(--border-strong);background:var(--surface-2,var(--surface));color:var(--text);font-size:.875rem;font-weight:600;white-space:nowrap;transition:background .15s,border-color .15s}
.ag-root .ag-btn:hover{background:var(--surface);border-color:var(--dourado)}
.ag-root .ag-btn[disabled]{opacity:.5;cursor:not-allowed}
.ag-root .ag-feito{background:var(--vinho);border-color:var(--vinho);color:#fff;min-width:104px}
.ag-root .ag-feito:hover{background:color-mix(in srgb,var(--vinho) 85%,black);border-color:color-mix(in srgb,var(--vinho) 85%,black)}
:root[data-theme="escuro"] .ag-root .ag-feito,:root:not([data-theme]) .ag-root .ag-feito{background:var(--vinho-light,#2C4A6B);border-color:var(--vinho-light,#2C4A6B)}
.ag-root .ag-lnk{background:transparent;border-color:transparent;color:var(--text)}
.ag-root .ag-lnk:hover{background:var(--surface-2);border-color:var(--border)}
.ag-root .ag-sob{background:transparent;color:var(--text-muted);border-color:var(--border)}
.ag-root .ag-btn.danger{background:transparent;border-color:var(--alert-fg,#A8341C);color:var(--alert-fg,#A8341C)}
.ag-root .ag-more{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent;border-radius:var(--r-sm,2px);color:var(--text-muted);flex-shrink:0}
.ag-root .ag-more:hover,.ag-root .ag-more[aria-expanded=true]{background:var(--surface-2);border-color:var(--border);color:var(--text)}
.ag-root .ag-lk{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 4px;background:none;border:0;border-radius:var(--r-sm,2px);color:var(--text);font-size:.875rem;font-weight:600;text-decoration:underline dotted;text-decoration-color:var(--text-muted);text-underline-offset:3px;white-space:nowrap}
.ag-root .ag-lk:hover{text-decoration-color:var(--dourado)}
.ag-root .ag-lk.at{color:var(--alert-fg,#A8341C)}
.ag-root .ag-lk2{white-space:normal;text-align:left}

/* cabeçalho + sub-abas */
.ag-root .ag-hd{display:flex;align-items:center;gap:12px;min-height:44px;flex-wrap:nowrap}
.ag-root .ag-hd h1{font-size:1.5rem;display:flex;align-items:center;gap:8px;line-height:1.2}
.ag-root .ag-h1i{color:var(--dourado);display:inline-flex}
.ag-root .ag-hdt{font-size:1rem;color:var(--text-muted);white-space:nowrap}
.ag-root .ag-upd{font-size:.875rem;color:var(--text-muted);margin-left:auto;white-space:nowrap}
.ag-root .ag-hd{border-bottom:1px solid var(--border)}
.ag-root .ag-tab{margin-bottom:0}
.ag-root .ag-hacts{display:flex;gap:8px;flex-shrink:0}
.ag-root .ag-tabs{display:flex;gap:4px;height:44px;margin-left:8px}
.ag-root .ag-tab{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;font-size:1rem;font-weight:600;color:var(--text-muted)}
.ag-root .ag-tab:hover{color:var(--text)}
.ag-root .ag-tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--dourado);font-weight:700}
.ag-root .ag-selo{display:inline-flex;align-items:center;gap:3px;font-size:.875rem;font-weight:700;padding:1px 7px;border-radius:999px;border:1px solid currentColor;line-height:1.4}
.ag-root .ag-selo.at{color:var(--alert-fg,#A8341C)}
.ag-root .ag-selo.wa{color:var(--warn-fg,#9A5B00)}
.ag-root .ag-pnl{padding-top:2px}
.ag-root .ag-ban{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 10px 6px 12px;margin-bottom:8px;border-radius:var(--r-sm,2px);font-size:.875rem;border:1px solid}
.ag-root .ag-ban.wa{color:var(--warn-fg,#9A5B00);background:color-mix(in srgb,var(--warn-fg,#9A5B00) 9%,var(--surface))}
.ag-root .ag-ban.er{color:var(--alert-fg,#A8341C);background:color-mix(in srgb,var(--alert-fg,#A8341C) 8%,var(--surface))}
.ag-root .ag-ban span{flex:1;min-width:200px;color:var(--text)}

/* barra de controles + contagens */
.ag-root .ag-bar{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;min-height:44px}
.ag-root .ag-seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:999px;overflow:hidden;background:var(--surface);flex-shrink:0}
.ag-root .ag-sg{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;background:transparent;border:0;font-size:.875rem;font-weight:600;color:var(--text-muted)}
.ag-root .ag-sg[aria-pressed=true]{background:var(--pill-active-bg,var(--vinho));color:var(--pill-active-fg,var(--dourado-light));font-weight:700}
.ag-root .ag-nav{display:flex;align-items:center;gap:2px;flex-shrink:0}
.ag-root .ag-per{font-weight:600;font-size:1rem;margin-left:6px;white-space:nowrap}
.ag-root .ag-busca{position:relative;flex:1;min-width:150px}
.ag-root .ag-busca .ag-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}
.ag-root .ag-busca input{width:100%;min-height:44px;padding:0 12px 0 36px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-sm,2px);font-size:1rem}
.ag-root .ag-busca input::placeholder{color:var(--text-muted)}
.ag-root .ag-catb .ag-n{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:999px;background:var(--vinho);color:#fff;font-size:.875rem;padding:0 5px}
.ag-root .ag-cnt{display:flex;align-items:center;flex-wrap:wrap;gap:0 8px;min-height:44px;margin:0;font-size:.875rem;color:var(--text-muted)}

/* pílulas */
.ag-root .ag-pl{display:inline-flex;align-items:center;gap:4px;font-size:.875rem;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid currentColor;line-height:1.5;white-space:nowrap}
.ag-root .ag-pl.at{color:var(--alert-fg,#A8341C);background:color-mix(in srgb,var(--alert-fg,#A8341C) 10%,transparent)}
.ag-root .ag-pl.ok{color:var(--ok-fg,#2E6B45);background:color-mix(in srgb,var(--ok-fg,#2E6B45) 10%,transparent)}
.ag-root .ag-pl.wa{color:var(--warn-fg,#9A5B00);background:color-mix(in srgb,var(--warn-fg,#9A5B00) 10%,transparent)}
.ag-root .ag-pl.in{color:var(--info-fg,#1B6094);background:color-mix(in srgb,var(--info-fg,#1B6094) 10%,transparent)}
.ag-root .ag-pl.mu{color:var(--text-muted);font-weight:600;border-style:dashed}
.ag-root .ag-atx{color:var(--alert-fg,#A8341C)}

/* cartões e blocos */
.ag-root .ag-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm,2px);box-shadow:var(--shadow-sm);margin-bottom:10px}
.ag-root .ag-hojeb{border-color:var(--border-strong);overflow:hidden}
.ag-root .ag-hh{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 8px 0 16px;background:var(--thead-bg,var(--surface-2));border-bottom:1px solid var(--border)}
.ag-root .ag-hojeb .ag-hh{min-height:36px}.ag-root .ag-hh .ag-btn{margin:-4px 0}
.ag-root .ag-hh h2{font-size:1rem}
.ag-root .ag-hd2{font-weight:500;color:var(--text-muted);font-size:1rem;letter-spacing:0}
.ag-root .ag-hm{font-size:.875rem;color:var(--text-muted);font-weight:500}
.ag-root .ag-sub{display:flex;align-items:center;gap:8px;min-height:28px;padding:4px 16px;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:.875rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)}
.ag-root .ag-sub b{font-weight:700;letter-spacing:0}
.ag-root .ag-sub .ag-hm{margin-left:auto;text-transform:none;letter-spacing:0}
.ag-root .ag-sub.at{color:var(--alert-fg,#A8341C)}
.ag-root .ag-fechado{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);color:var(--ok-fg,#2E6B45);background:color-mix(in srgb,var(--ok-fg,#2E6B45) 8%,var(--surface))}
.ag-root .ag-fechado span{color:var(--text)}
.ag-root .ag-vz,.ag-root .ag-nt{color:var(--text-muted);font-size:.875rem}
.ag-root .ag-vz{padding:14px 16px}
.ag-root .ag-vz2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;color:var(--text-muted)}
.ag-root .ag-vazio{padding:40px 24px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm,2px)}
.ag-root .ag-vb{font-size:1.125rem;font-weight:700}
.ag-root .ag-vbt{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ag-root .ag-col{margin-top:10px}
.ag-root .ag-colh{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 16px;background:transparent;border:0;text-align:left;font-weight:700;font-size:.875rem;text-transform:uppercase;letter-spacing:.06em}
.ag-root .ag-colh .ag-cv{transition:transform .2s;color:var(--text-muted)}
.ag-root .ag-colh[aria-expanded=true] .ag-cv{transform:rotate(90deg)}
.ag-root .ag-cn{margin-left:auto;font-weight:500;text-transform:none;letter-spacing:0;color:var(--text-muted);font-size:.875rem}
.ag-root .ag-cb{border-top:1px solid var(--border)}
.ag-root .ag-dia{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:.875rem;font-weight:700}
.ag-root .ag-dia span{margin-left:auto;font-weight:500;color:var(--text-muted)}

/* linha de tarefa: 68 px (76 no mobile) */
.ag-root .ag-row{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr) auto auto;align-items:center;gap:12px;min-height:68px;padding:8px 8px 8px 19px;border-bottom:1px solid var(--border);background:var(--surface)}
.ag-root .ag-row:last-child{border-bottom:0}
.ag-root .ag-row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--border-strong))}
.ag-root .ag-row:hover{background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}
.ag-root .ag-row.at::before{background:var(--alert-fg,#A8341C)}
.ag-root .ag-row.feita .ag-tt{color:var(--text-muted);text-decoration:line-through;text-decoration-color:var(--border-strong)}
.ag-root .ag-row.feita{animation:ag-entra .25s cubic-bezier(.16,1,.3,1)}
@keyframes ag-entra{from{opacity:.2;transform:translateY(-6px)}to{opacity:1;transform:none}}
.ag-root .ag-cic{width:32px;height:32px;border-radius:2px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c,var(--border-strong)) 20%,var(--surface));color:color-mix(in srgb,var(--c,var(--text-muted)) 70%,var(--text));flex-shrink:0}
:root[data-theme="escuro"] .ag-root .ag-cic,:root:not([data-theme]) .ag-root .ag-cic{color:color-mix(in srgb,var(--c,var(--text-muted)) 85%,white)}
.ag-root .ag-rt{min-width:0}
.ag-root .ag-rtb{display:block;width:100%;min-height:44px;padding:0;background:none;border:0;text-align:left;color:inherit}
.ag-root .ag-tt{display:block;max-width:100%;font-size:1rem;font-weight:600;line-height:1.3;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-root .ag-rtb:hover .ag-tt{text-decoration:underline;text-decoration-color:var(--dourado);text-underline-offset:3px}
.ag-root .ag-mchip{display:none}.ag-root .ag-hr2{font-weight:700;color:var(--text)}
.ag-root .ag-ttc{font-size:1rem;font-weight:600;line-height:1.3}
.ag-root .ag-mt{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-size:.875rem;color:var(--text-muted);margin-top:2px;line-height:1.35}
.ag-root .ag-dt{font-weight:700;color:var(--text)}
.ag-root .ag-selos{display:inline-flex;flex-wrap:wrap;gap:4px}
.ag-root .ag-est{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap;min-width:0}
.ag-root .ag-crit{display:inline-flex;align-items:center;gap:3px;font-size:.875rem;font-weight:600;color:var(--text-muted)}
.ag-root .ag-acts{display:flex;align-items:center;gap:8px}
.ag-root .ag-rowc{display:grid;grid-template-columns:32px minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--border)}
.ag-root .ag-rowc:last-child{border-bottom:0}
.ag-root .ag-tipo{font-size:.875rem;font-weight:600;border:1px solid var(--border-strong);padding:0 6px;border-radius:999px}
.ag-root .ag-cf{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border)}
.ag-root .ag-sk{pointer-events:none}
.ag-root .ag-skl{display:block;height:12px;border-radius:2px;background:linear-gradient(90deg,var(--surface-2),var(--border),var(--surface-2));background-size:200% 100%;animation:ag-sh 1.2s linear infinite;margin:4px 0}
.ag-root .ag-skl.w60{width:60%}.ag-root .ag-skl.w40{width:40%}
@keyframes ag-sh{to{background-position:-200% 0}}

/* semana */
.ag-root .ag-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:start}
.ag-root .ag-wc{min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm,2px);min-height:200px;display:flex;flex-direction:column}
.ag-root .ag-wc.hj{border-color:var(--dourado);border-top-width:3px}
.ag-root .ag-wc.fds .ag-wh{background:color-mix(in srgb,var(--surface-2) 70%,var(--surface))}
.ag-root .ag-wh{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:44px;padding:0 10px;background:var(--thead-bg,var(--surface-2));border:0;border-bottom:1px solid var(--border);text-align:left}
.ag-root .ag-wd{font-size:.875rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.ag-root .ag-wn{font-size:1.25rem;font-variant-numeric:tabular-nums}
.ag-root .ag-wl{display:flex;flex-direction:column;gap:4px;padding:6px}
.ag-root .ag-ch{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 8px;text-align:left;background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 45%,var(--border));border-left:4px solid var(--c);border-radius:var(--r-sm,2px);font-size:.875rem;font-weight:600;min-width:0}
.ag-root .ag-ch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ag-root .ag-ch.at{border-color:var(--alert-fg,#A8341C);color:var(--alert-fg,#A8341C)}
.ag-root .ag-ch.mais{justify-content:center;background:transparent;border-style:dashed;border-left-width:1px;color:var(--text-muted)}

/* mês */
.ag-root .ag-mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.ag-root .ag-mh{font-size:.875rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);padding:4px 6px}
.ag-root .ag-mc{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:2px;min-height:92px;padding:6px 8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm,2px);text-align:left}
.ag-root .ag-mc:hover{border-color:var(--border-strong);background:color-mix(in srgb,var(--surface-2) 40%,var(--surface))}
.ag-root .ag-mc.out{opacity:.65}
.ag-root .ag-mc.hj{border:2px solid var(--dourado)}
.ag-root .ag-mc.sel{outline:2px solid var(--vinho-light,var(--vinho));outline-offset:-2px}
.ag-root .ag-md{font-size:.875rem;font-weight:600;color:var(--text-muted)}
.ag-root .ag-mc.hj .ag-md{color:var(--text);font-weight:800}
.ag-root .ag-mn{font-size:1.25rem;line-height:1;font-variant-numeric:tabular-nums}
.ag-root .ag-mn.at{color:var(--alert-fg,#A8341C)}.ag-root .ag-wn.dn{font-size:1rem;color:var(--ok-fg,#2E6B45);display:inline-flex;align-items:center;gap:3px}
.ag-root .ag-mf{display:inline-flex;align-items:center;gap:3px;font-size:.875rem;color:var(--ok-fg,#2E6B45);font-weight:600}
.ag-root .ag-dots{display:flex;gap:3px;margin-top:auto}
.ag-root .ag-dots i{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:color-mix(in srgb,var(--c) 22%,var(--surface));color:color-mix(in srgb,var(--c) 70%,var(--text))}

/* menu popover */
.ag-root .ag-menu{position:fixed;z-index:1250;min-width:230px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-sm,2px);box-shadow:0 8px 24px rgba(0,0,0,.22);padding:4px;display:flex;flex-direction:column}
.ag-root .ag-mi{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;background:none;border:0;border-radius:var(--r-sm,2px);text-align:left;font-size:1rem;font-weight:500}
.ag-root .ag-mi:hover,.ag-root .ag-mi:focus-visible{background:var(--surface-2)}
.ag-root .ag-ckb{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:1.5px solid var(--border-strong);border-radius:2px;background:var(--surface)}
.ag-root .ag-catm .ag-mi[aria-checked=true] .ag-ckb{background:var(--c);border-color:var(--c);color:#fff}

/* toasts */
.ag-root .ag-toasts{position:fixed;left:16px;bottom:16px;z-index:1300;max-width:min(560px,calc(100vw - 32px))}
.ag-root .ag-toast{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;min-height:52px;background:#111418;color:#F1F1EF;border-radius:var(--r-sm,2px);box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:1rem}
.ag-root .ag-toast .ag-ti{color:#6FB58A;display:inline-flex}
.ag-root .ag-toast.erro .ag-ti{color:#F0A63C}
.ag-root .ag-toast .ag-lnk{color:#E0A63C;border-color:transparent}
.ag-root .ag-toast .ag-lnk:hover{background:rgba(255,255,255,.08)}
.ag-root .ag-toast .ag-more{color:#cfd3d8}
.ag-root .ag-toast .ag-more:hover{background:rgba(255,255,255,.1);color:#fff}
.ag-root .ag-tm{flex:1}

/* PAINEL */
.ag-root .ag-hzb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:44px;margin-bottom:6px}
.ag-root .ag-hzt{font-size:.875rem;color:var(--text-muted)}
.ag-root .ag-hz-i{font-size:.875rem;color:var(--text-muted);margin-left:4px}
.ag-root .ag-heat{padding-bottom:6px}
.ag-root .ag-heh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:36px;padding:2px 12px 0 16px}
.ag-root .ag-heh h2{font-size:1rem}
.ag-root .ag-leg{display:inline-flex;align-items:center;gap:3px;margin-left:auto;font-size:.875rem;color:var(--text-muted)}
.ag-root .ag-leg i{display:inline-block;width:14px;height:14px;border-radius:2px;border:1px solid var(--border)}
.ag-root .ag-leg span{margin-left:4px}
.ag-root .ag-hscroll{overflow-x:auto;padding:0 12px 6px;scrollbar-width:auto}
.ag-root .ag-hg{display:flex;flex-direction:column;gap:3px;min-width:100%;width:max-content}
.ag-root .ag-hint{margin-left:auto;display:inline-flex;align-items:center;gap:4px;color:var(--text-muted)}
.ag-root .ag-hr{display:grid;grid-template-columns:110px repeat(var(--nc),minmax(44px,1fr));gap:3px;align-items:center}
.ag-root .ag-hl{display:flex;align-items:center;gap:6px;font-size:.875rem;font-weight:600;padding-right:6px;position:sticky;left:0;background:var(--surface);z-index:1;height:100%}
.ag-root .ag-hl .ag-ic{color:var(--c)}

/* checagens do cio de repasse: [{data,n,lote,est,previa}]. Manter = checagens futuras do Store ficam; Remover = saem
   (e só a prévia pela regra nova aparece). Prévia = 1ª checagem pela regra atual (ex.: 13/10 com 12 dias). */
function repasseDatas(){
 const c=repasseCfg();if(!c.usar)return [];
 const out=[];const K=repasseChecks();
 SERVICOS.forEach(sv=>{
  if(sv.real){const d=add(HOJE,sv.off+c.dias);out.push({data:d,n:sv.n,lote:sv.lote,est:false,base:sv});if(c.repetir&&c.cada)for(let k=1;k<=3;k++)out.push({data:add(d,k*c.cada),n:sv.n,lote:sv.lote,est:true,base:sv});return}
  const chk=K&&K.find(x=>String(x.proto||'').indexOf(sv.chave)>=0);
  const nova=add(HOJE,sv.off+c.dias);
  if(chk){
   if(chk.estado==='futura')out.push({data:String(chk.data).slice(0,10),n:chk.n||sv.n,lote:sv.lote,est:true,base:sv});
   if(c.dias!==14&&nova!==String(chk.data).slice(0,10))out.push({data:nova,n:sv.n,lote:sv.lote,est:true,previa:true,base:sv});
  }else out.push({data:nova,n:sv.n,lote:sv.lote,est:true,base:sv});
 });
 return out;
}

/* checklist: fonte única = Store.select.checklistResumo(agId) (mesmos selos e x/y de Protocolos). Fallback: deriva do agendamento. */
function checklistDe(ag,pr){
 const f=SEL('checklistResumo');
 if(f){try{const r=f(ag.id);if(r&&r.selos&&typeof r.total==='number'){
  const S=r.selos;const nm={vet:'Vet',estoque:'Estoque',data:'Data',conta:'Conta'};
  const selos=['vet','estoque','data','conta'].filter(k=>S[k]!==undefined).map(k=>({k,l:nm[k],st:S[k],ok:S[k]==='ok',req:k!=='conta'}));
  return {fonte:'store',texto:r.texto||`${r.resolvidos}/${r.total}`,total:r.total,resolvidos:r.resolvidos,completo:!!r.completo,pend:(r.pendentes||[]).length,selos,itens:arr(r.itens).map(i=>({rotulo:i.rotulo||CK_ROT[i.k]||i.k,estado:i.estado,resolvido:!!i.resolvido}))}}}catch(e){}}
 const ck=ag.checklist||{};const modelo=(pr.checklistModelo&&pr.checklistModelo.length)?pr.checklistModelo:['veterinario','estoque','data','contaPagar'];
 const chaves=Object.keys(CK_ROT).filter(k=>modelo.indexOf(k)>=0||k==='data'||k==='estoque');
 const itens=chaves.map(k=>({k,rotulo:CK_ROT[k],estado:(ck[k]||{}).estado||'pendente',resolvido:ckOk(ck[k])}));
 const sm=[['veterinario','Vet','vet'],['estoque','Estoque','estoque'],['data','Data','data'],['contaPagar','Conta','conta']].filter(x=>chaves.indexOf(x[0])>=0);
 const selos=sm.map(([k,l,kk])=>({k:kk,l,st:ckOk(ck[k])?'ok':'pend',ok:ckOk(ck[k]),req:kk!=='conta'}));
 const pend=itens.filter(i=>!i.resolvido).length;
 return {fonte:'fallback',texto:`${itens.length-pend}/${itens.length}`,total:itens.length,resolvidos:itens.length-pend,completo:pend===0,pend,selos,itens};
}

function estoqueInfo(){

 const st=arr(S.estoque);
 const store=S.estoque&&!Array.isArray(S.estoque)?Object.keys(S.estoque).map(k=>Object.assign({sku:k},S.estoque[k])):st;
 Object.keys(EST_META).forEach(id=>{
  const m=EST_META[id];
  let hit=store.find(e=>e&&arr(e.lotes).some(l=>m.lotes.indexOf(l.lote)>=0))||store.find(e=>e&&m.k.some(k=>String(e.nome||'').toLowerCase().includes(k)));
  const lotes=hit?arr(hit.lotes).map(l=>({lote:l.lote,validade:l.validade||'',saldo:Number(l.saldo)||0})):(EST_FALLBACK[id]||[]).map(x=>({lote:x[0],validade:x[1],saldo:x[2]}));
  out[id]={id,nome:(hit&&hit.nome)||m.nome,un:m.un,min:m.min,lotes,sku:hit?hit.sku||hit.id:null};
 });

}
const usavel=(e,ate)=>e.lotes.filter(l=>!l.validade||l.validade>=ate).reduce((s,l)=>s+l.saldo,0);
const total=e=>e.lotes.reduce((s,l)=>s+l.saldo,0);
function demanda(id,ate){
 let q=0;
 todosItens().filter(i=>i.src==='own'&&i.st==='p'&&i.ins&&i.data<=ate&&i.ins[id]).forEach(i=>{q+=i.ins[id]});
 const m=EST_META[id];
 agItens().filter(i=>i.st==='p'&&i.data<=ate).forEach(i=>{
  const nome=String(i.produto||i.pr.nome||'').toLowerCase();
  const hit=m.k.some(k=>nome.includes(k))||(i.pr.produtoId&&i.pr.produtoId===id);
  if(hit)q+=i.n*(id==='ive'?4.6:1);
 });
 return q;
}
function alertasEstoque(h){
 const E=estoqueInfo();const out=[];
 Object.keys(E).forEach(id=>{
  const e=E[id];
  e.lotes.forEach(l=>{
   if(!l.validade||l.saldo<=0)return;const dd=diff(l.validade,HOJE);
   if(dd<0)out.push({tipo:'vencido',id,e,l,ord:0,txt:`${e.nome} ${l.lote} · vencido em ${fmtBR(l.validade)}`,det:`Saldo ${nfmt(l.saldo)} ${e.un} · exige ciência antes de qualquer uso`,cat:'Vencido'});
   else if(dd<=h)out.push({tipo:'vence',id,e,l,ord:1,dd,txt:`${e.nome} ${l.lote} · vence em ${dd} dias (${fmtBR(l.validade)})`,det:`Saldo ${nfmt(l.saldo)} ${e.un} · uso previsto até ${fmtS(l.validade)}: ${nfmt(demandaAte(id,l.validade))} ${e.un}`,cat:'Vence'});
  });
  const tot=usavel(e,HOJE);
  if(e.min&&tot<e.min)out.push({tipo:'min',id,e,ord:2,txt:`${e.nome} · abaixo do mínimo`,det:`Saldo ${nfmt(tot)} ${e.un} · mínimo ${nfmt(e.min)} ${e.un} · falta ${nfmt(e.min-tot)} ${e.un}`,falta:e.min-tot,cat:'Mínimo'});
 });
 return out.sort((a,b)=>a.ord-b.ord);
}
function demandaAte(id,d){return demanda(id,d)}
function precisaInsumo(h){

 Object.keys(E).forEach(id=>{
  const e=E[id];const dem=demanda(id,ate);const us=usavel(e,ate);const resta=us-dem;
  if(e.min&&resta<=e.min&&(dem>0||us<=e.min))out.push({id,e,dem,us,resta,falta:Math.max(0,e.min-resta)});
 });

function rupturaData(id){ /* 1ª data em que saldo-demanda cai abaixo do mínimo (para a programação) */

/* trava anti-toque duplo */
function trava(ms){AG.lockUntil=Date.now()+(ms||300)}
const travado=()=>Date.now()<(AG.lockUntil||0);
function fantasma(it){ /* a linha mantém o espaço por 250 ms; o toque na linha seguinte é bloqueado */
 trava(300);const el=root&&root.querySelector(`[data-rowk="${CSS.escape(it.key)}"]`);
 AG.ghost={item:Object.assign({},it),h:el?el.getBoundingClientRect().height:68,until:Date.now()+260};
 clearTimeout(AG.ghostT);AG.ghostT=setTimeout(()=>{if(AG.ghost&&Date.now()>=AG.ghost.until){AG.ghost=null;if(root)renderAll()}},280);
}
function evento(t,acao,o){
 o=o||{};
 const r=disp('tarefaEvento',{tipo:t.kind,id:t.id,acao,motivo:o.motivo||'',data:o.data||'',titulo:t.titulo,detalhe:o.detalhe||''});
 if(r.ok===false){toast('Não foi possível salvar: '+(r.erro||''),{erro:1});return false}
 if(!storeTemEventos()){ /* Store sem tarefaEvento: fallback local */
  if(acao==='feito'){t.st='f';t.feitoEm=HOJE;t.feitoHora=clock();t.feitoPor=USER}
  else if(acao==='adiar'){t.data=o.data;t.motivo=o.motivo||'sem motivo informado'}
  else{t.st='x';t.motivo=o.motivo}
 }else applyEv();
 logPush(acao,{id:t.id,titulo:t.titulo},{motivo:o.motivo});return r;
}
function desfazTarefa(t,antes){
 const lg=logTarefa(t);
 if(storeTemEventos()&&lg){const r=disp('desfazer',{logId:lg.id,motivo:MOT_RAPIDO,imediato:true});if(r.ok===false){toast('Não foi possível desfazer: '+(r.erro||''),{erro:1});return}applyEv();return}
 antes();
}
function doFeito(it){
 if(!it||it.st!=='p'||travado())return;
 if(it.src==='ag')return doAplicar(it);
 const t=tk(it);if(!t)return;
 if(it.res!=='realizar'||!podeAgir(it))return;
 const r=evento(t,'feito');if(!r)return;AG.refocus=1;fantasma(it);
 const verbo=it.verbo==='Aplicar'?'Aplicado':'Feito';
 toast(`${verbo} · ${curto(it.titulo)}`,{group:'feito',aggMsg:n=>`${n} tarefas feitas`,undo:()=>{desfazTarefa(t,()=>{t.st='p';t.feitoEm=''})}});
 renderAll();
}
function doAplicar(it){
 if(travado())return;trava(400);
 const A=window.Aplicar;
/* grava ?aplicar=<id>&de=agenda no hash (P trata a URL: F5 reabre o drawer) */
 try{const q=parseHash().p;q.set('aplicar',it.id);q.set('de','agenda');history.replaceState(null,'','#/agenda?'+q.toString().replace(/%3A/g,':').replace(/%2C/g,','))}catch(e){}
 if(A&&typeof A.open==='function'){A.open(it.id);return}
 try{const q=parseHash().p;q.delete('aplicar');q.delete('de');history.replaceState(null,'','#/agenda?'+q.toString().replace(/%3A/g,':'))}catch(e){}
 toast('O drawer Aplicar não está disponível neste ambiente.',{erro:1});
}
function doDesfazer(it,rapido){
 if(!it)return;
 if(it.src==='ag'){
  if(!rapido){ui().estorno='';abrirGaveta('estorno:'+it.key);return}
  const lg=logDe(it.ag)||{};const r=disp('desfazer',{logId:lg.id||lg.logId,agId:it.id,motivo:MOT_RAPIDO,imediato:true});
  if(r.ok===false)toast('Não foi possível desfazer: '+(r.erro||''),{erro:1});else toast('Aplicação desfeita',{});renderAll();return}
 if(it.src==='conta'){AG.dismissed[it.key]=0;renderAll();return}
 const t=tk(it);if(!t)return;desfazTarefa(t,()=>{t.st='p';t.feitoEm=''});
 toast('Desfeito · '+curto(it.titulo),{});renderAll();
}
function doEstornar(it,motivo){
 const lg=logDe(it.ag)||{};const r=disp('desfazer',{logId:lg.id||lg.logId,agId:it.id,motivo});
 if(r.ok===false){toast('Não foi possível estornar: '+(r.erro||''),{erro:1});return}
 ui().gaveta='';syncHash();toast('Aplicação estornada · motivo registrado',{});renderAll();
}
function doAdiar(it,data,motivo){
 if(!it||it.st!=='p')return;
 if(it.src==='ag'){const antes=it.data;const r=disp('adiar',{agId:it.id,data,motivo:motivo||undefined});
  if(r.ok===false){toast('Não foi possível adiar: '+(r.erro||''),{erro:1});return}
  toast(`Adiado para ${fmtBR(data)} · ${curto(it.titulo)}`,{undo:()=>{disp('adiar',{agId:it.id,data:antes,motivo:'adiamento desfeito'})}});renderAll();return}
 const t=tk(it);if(!t)return;const antes=t.data;
 if(!evento(t,'adiar',{data,motivo:motivo||''}))return;
 toast(`Adiado para ${fmtBR(data)} · ${curto(it.titulo)}`,{group:'adiar',aggMsg:n=>`${n} tarefas adiadas`,undo:()=>{desfazTarefa(t,()=>{t.data=antes})}});renderAll();
}
function doNaoVou(it,motivo){
 if(it.src==='ag'){const r=disp('cancelar',{agId:it.id,motivo});if(r.ok===false){toast('Não foi possível cancelar: '+(r.erro||''),{erro:1});return}
  toast(`Agendamento cancelado · ${curto(it.titulo)}`,{});renderAll();return}
 const t=tk(it);if(!t)return;
 if(!evento(t,'naoVou',{motivo}))return;
 toast(`Não vou fazer · ${curto(it.titulo)}`,{undo:()=>{desfazTarefa(t,()=>{t.st='p';t.motivo=''})}});renderAll();
}
function doEntendi(it){
 const t=tk(it);if(!t){if(it.src==='conta'){AG.dismissed[it.key]=1;renderAll()}return}
 if(!evento(t,'excluir',{motivo:'Dispensado'}))return;
 toast('Dispensado · '+curto(it.titulo),{undo:()=>{desfazTarefa(t,()=>{t.st='p';t.motivo=''})}});renderAll();
}
function doNavegar(it){
 const d=it.destino||it.origem;
 if(it.src==='conta'){go('Financeiro › A pagar');return}
 go(d,d);
}
const crit=it=>!!it.crit&&it.st==='p';
function adiarAmanha(it){
 if(crit(it)){ui().gaveta='adiar:'+it.key;ui().amanha=1;syncHash();renderDrawer(true);return}
 doAdiar(it,add(HOJE,1));
}
function fecharDia(motivo){
 const its=todosItens().filter(pendCampo).filter(i=>i.data<=HOJE&&i.src==='own');
 const mov=its.filter(i=>!i.crit),fix=its.filter(i=>i.crit);
 const amanha=add(HOJE,1);let falhou=0;
 mov.forEach(i=>{if(!evento(i.tk,'adiar',{data:amanha,motivo,detalhe:'Fechar o dia'}))falhou++});
 toast(`Dia fechado · ${mov.length-falhou} ${plur(mov.length-falhou,'adiada','adiadas')}${fix.length?` · ${fix.length} não adiáveis`:''}`,{});
 ui().gaveta='';syncHash();renderAll();
}

const dl=rows=>`<dl class="ag-dl">${rows.filter(Boolean).map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
const btnH=(cls,act,txt,icon,extra)=>`<button class="ag-btn ${cls||''}" data-act="${act}" ${extra||''}>${icon?ic(icon,16):''}${esc(txt)}</button>`;

function ddTarefa(it){
 const c=CATS[it.cat]||CATS.ati;
 const rows=[['Categoria',esc(c.n)],['Quando',esc(fmtLong(it.data))+(it.hora?' · '+esc(it.hora):'')+(it.st==='p'&&it.data<HOJE?` · <b class="ag-atx">há ${diff(HOJE,it.data)} dias</b>`:'')],['Para quem / onde',esc(it.quem||'—')]];
 if(it.sub&&it.src!=='ag')rows.push(['Detalhe',esc(it.sub)]);
 if(it.src==='ag'){rows.push(['Responsável',esc(nomePessoa(it.ag.responsavelId)||'a definir')]);rows.push(['Animais',`${it.n} no agendamento${it.fora?` (${it.fora} fora da janela, por decisão da fazenda)`:''}`])}
 if(it.ins&&Object.keys(it.ins).length){const E=EST_META;rows.push(['Insumos',Object.keys(it.ins).map(k=>`${esc(E[k]?E[k].nome:k)}: ${nfmt(it.ins[k])} ${E[k]?E[k].un:''}`).join('<br>')])}
 rows.push(['Origem',esc(it.origem||'—')]);

 return dl(rows)+extra;

function footTarefa(it){

function listaLinhas(items,ctx){return items.length?`<div class="ag-dlist">${items.map(i=>rowHtml(i,ctx||{compacta:1,mostraData:1})).join('')}</div>`:`<p class="ag-vz">Nada por aqui.</p>`}

function tabAn(rows,sel,col){
 return `<div class="ag-tw"><table class="ag-tb"><thead><tr>${sel?'<th class="ag-c"><span class="ag-sr">Selecionar</span></th>':''}<th scope="col">Nº</th>${rows.some(r=>r.nome!==undefined)?'<th scope="col">Nome</th>':''}<th scope="col">DEL</th><th scope="col">${col||'Situação'}</th></tr></thead><tbody>${rows.map(r=>`<tr>${sel?`<td class="ag-c"><label class="ag-cbl"><input type="checkbox" data-act="cand-sel" data-a="${r.a}" ${AG.selCand.indexOf(r.a)>=0?'checked':''} aria-label="Selecionar ${r.a}"></label></td>`:''}<td class="ag-tnum"><b>${r.a}</b></td>${r.nome!==undefined?`<td>${esc(r.nome||'—')}</td>`:''}<td class="ag-tnum">${r.del!=null?r.del:'—'}</td><td>${esc(r.txt||'')}</td></tr>`).join('')}</tbody></table></div>`;

function drawerSpec(key){
 const u=ui();const [k,arg]=[key.split(':')[0],key.slice(key.indexOf(':')+1)];
 const h=u.horizonte;
 if(k==='tarefa'){const it=itemByKey(arg)||itemByKey(arg.replace(/^_/,''));if(!it)return {t:'Tarefa não encontrada',body:'<p class="ag-vz">Esta tarefa já foi concluída ou removida.</p>'};
  return {t:it.titulo,s:esc((CATS[it.cat]||CATS.ati).n)+' · '+esc(fmtLong(it.data)),body:ddTarefa(it),foot:footTarefa(it)};}
 if(k==='dia'){const its=itensDoDia(arg);const ct=its.filter(pendCampo).length;return {t:cap(fmtLong(arg)),s:arg===HOJE?`Hoje · ${ct} a fazer`:`${ct} ${plur(ct,'tarefa','tarefas')}`,body:(arg<HOJE?'<p class="ag-vz">Dia passado: veja em “Concluídos no período” no Painel.</p>':'')+listaLinhas(its.filter(i=>i.st!=='x'),{compacta:1}),foot:btnH('','ver-dia','Ver este dia na lista','list',`data-d="${arg}"`)};}
 if(k==='nova')return specNova();
 if(k==='estorno'){const it=itemByKey(arg);if(!it)return {t:'Aplicação não encontrada',body:''};return {t:'Estornar aplicação',s:esc(it.titulo),body:`<div class="ag-av wa">${ic('info',18)}<div>Depois de 10 segundos, desfazer é um <b>estorno</b>: a aplicação original fica preservada como estornada, com o motivo.</div></div><p class="ag-fl">Motivo (obrigatório)</p>${chipsHtml('Motivo',MOTIVOS_ESTORNO,ui().estorno,'mot-estorno')}`,foot:btnH('danger','conf-estorno','Estornar aplicação','undo-2',`data-k="${esc(arg)}" ${ui().estorno?'':'disabled'} data-fk="conf-estorno"`)+btnH('ag-lnk','dr-close','Voltar')};}
 if(k==='adiar')return specAdiar(arg);

const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* seletor de data próprio (dd/mm/aaaa), botões de 44 px */
function chipsHtml(name,lista,cur,act){return `<div class="ag-chips" role="radiogroup" aria-label="${name}">${lista.map(([v,t])=>`<button type="button" class="ag-chip" role="radio" aria-checked="${cur===v}" data-act="${act}" data-v="${v}" data-fk="${act}-${v}">${cur===v?ic('check',16):''}${esc(t)}</button>`).join('')}</div>`}
function pickerHtml(val,min,alvo){
 const u=ui();const ms=u.pkMes||monthStart(val||min);const d0=dt(ms);const n=new Date(Date.UTC(d0.getUTCFullYear(),d0.getUTCMonth()+1,0)).getUTCDate();
 const first=(wd(ms)+6)%7;const cells=[];for(let i=0;i<first;i++)cells.push('<span></span>');
 for(let i=1;i<=n;i++){const d=ms.slice(0,8)+p2(i);const dis=d<min;cells.push(`<button type="button" class="ag-pk${d===val?' sel':''}${d===HOJE?' hj':''}" data-act="pk-dia" data-d="${d}" data-al="${alvo}" ${dis?'disabled':''} aria-pressed="${d===val}" aria-label="${esc(fmtLong(d))}">${i}</button>`)}
 return `<div class="ag-picker" role="group" aria-label="Escolher data"><div class="ag-pkh"><button type="button" class="ag-more" data-act="pk-prev" aria-label="Mês anterior" data-fk="pk-prev">${ic('chevron-left',18)}</button><b>${cap(MES[d0.getUTCMonth()])} de ${d0.getUTCFullYear()}</b><button type="button" class="ag-more" data-act="pk-next" aria-label="Próximo mês" data-fk="pk-next">${ic('chevron-right',18)}</button></div><div class="ag-pkg">${DOWc.slice(1).concat(DOWc[0]).map(x=>`<i aria-hidden="true">${x}</i>`).join('')}${cells.join('')}</div></div>`;
}
function dataChips(val,base,alvo){

 }
 if(k==='bst'||k==='bst-excl'||k==='bst-incl'){
  const tab=u.bstTab||(k==='bst-excl'?'exc':k==='bst-incl'?'inc':'apt');

function resolvePayload(v, ctx) {
  if (typeof v === 'string') { if (v === '$ag') return ctx.ag; if (/^\$r(\d+)\.(\w+)$/.test(v)) { const m = v.match(/^\$r(\d+)\.(\w+)$/); return (ctx.res[+m[1]] || {})[m[2]]; } return v.replace(/\$r(\d+)\.(\w+)/g, (x, i, k) => (ctx.res[+i] || {})[k]).replace('{ag}', ctx.ag || '').replace('$ag', ctx.ag || ''); }
