name: Build Android APK

# O sandbox onde o Capacitor foi configurado não tem acesso ao SDK do Android
# (dl.google.com bloqueado por política de rede) — a compilação de verdade
# acontece aqui, nos runners do GitHub, que não têm essa restrição.
#
# Por enquanto gera só o APK de debug (autoassinado pelas próprias
# ferramentas do Android) — suficiente para instalar em celular de teste.
# Quando existir keystore de release (ver docs do app Android), trocamos
# para assembleRelease com assinatura de verdade.

on:
  push:
    branches: [main]
    paths:
      - "frontend/android/**"
      - "frontend/capacitor.config.ts"
      - "frontend/capacitor-www/**"
      - "frontend/package.json"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

jobs:
  build:
    name: Gerar .apk de debug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # Capacitor CLI 8.x exige Node >=22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # packages vazio: o passo padrão tenta instalar o pacote "tools", que
      # não existe mais no repositório do SDK ("Failed to find package
      # 'tools'", sdkmanager exit 1) — só queremos o SDK + licenças aceitas;
      # o Gradle baixa platform/build-tools que precisar.
      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - run: npm ci

      - run: npx cap sync android

      - name: Build APK de debug
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Conferir o APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "build-tools: $BT"

          echo "::group::aapt2 dump badging"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|application-label:" | tee badging.txt
          echo "::endgroup::"

          echo "::group::apksigner verify"
          "$BT/apksigner" verify --print-certs "$APK" | tee apksigner.txt
          echo "::endgroup::"

          APK_SHA=$(grep -m1 "certificate SHA-256 digest" apksigner.txt | sed 's/.*: *//' | tr -d ':' | tr 'A-F' 'a-f')
          KS_SHA=$(keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android \
            | grep -m1 "SHA256:" | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          echo "SHA-256 do certificado do APK:      $APK_SHA"
          echo "SHA-256 do certificado do keystore: $KS_SHA"
          if [ -z "$APK_SHA" ] || [ "$APK_SHA" != "$KS_SHA" ]; then
            echo "::error::Certificado do APK difere do debug.keystore — o APK NÃO atualizaria por cima do instalado."
            exit 1
          fi
          grep -q "name='br.com.cowdata.fazenda'" badging.txt || { echo "::error::package inesperado"; exit 1; }
          echo "OK: certificado igual ao do debug.keystore."

      - uses: actions/upload-artifact@v4
        with:
          name: fazenda-app-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
