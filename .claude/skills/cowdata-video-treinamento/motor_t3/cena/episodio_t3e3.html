<script type="module">
import * as THREE from "three";
const W = 1080, H = 1920, U = 6.9 / 390; // unidades por px CSS da tela do app
const palco = document.getElementById("palco");
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, powerPreference: "high-performance" });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;

const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1b120a);
scene.fog = new THREE.Fog(0x1b120a, 55, 120);
const cam = new THREE.PerspectiveCamera(26, W / H, 1, 300); scene.add(cam);
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const sm = (a, b, t) => { const x = clamp01((t - a) / (b - a)); return x * x * (3 - 2 * x); };
const eo = (a, b, t) => { const x = clamp01((t - a) / (b - a)); return 1 - Math.pow(1 - x, 3); };
const ei = (a, b, t) => { const x = clamp01((t - a) / (b - a)); return x * x * x; };
const eb = (a, b, t) => { const x = clamp01((t - a) / (b - a)), c = 1.2, d = c + 1; return 1 + d * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, t) => a + (b - a) * t;

// ---------- ambiente (softboxes procedurais para reflexo do vidro e do metal) ----------
function ambiente() {
  const s = new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.BoxGeometry(80, 80, 80), new THREE.MeshBasicMaterial({ color: 0x2a1d12, side: THREE.BackSide })));
  const painel = (w, h, pos, cor, k) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(cor).multiplyScalar(k), side: THREE.DoubleSide })); m.position.set(...pos); m.lookAt(0, 0, 0); s.add(m); };
  painel(40, 24, [-22, 30, 18], 0xfff1dc, 7); painel(10, 40, [30, 14, -22], 0xe0a63c, 6); painel(34, 10, [0, 24, -30], 0xfff6e6, 3); painel(18, 18, [26, 8, 26], 0xffe8c8, 1.6);
  const pm = new THREE.PMREMGenerator(renderer); const t = pm.fromScene(s, 0.02).texture; pm.dispose(); return t;
}
scene.environment = ambiente(); scene.environmentIntensity = 0.9;

// ---------- luzes ----------
const hemi = new THREE.HemisphereLight(0xfff0da, 0x6b4f33, 1.15); scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff1dc, 2.6); key.position.set(-13, 28, 15); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 7; key.shadow.blurSamples = 20; key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
Object.assign(key.shadow.camera, { left: -17, right: 17, top: 17, bottom: -17, near: 5, far: 80 }); scene.add(key); scene.add(key.target);
const rim = new THREE.DirectionalLight(0xe0a63c, 2.4); rim.position.set(16, 9, -22); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffe2bd, 0.6); fill.position.set(14, 10, 22); scene.add(fill);

// ---------- texturas ----------
const loader = new THREE.TextureLoader();
const aniso = renderer.capabilities.getMaxAnisotropy();
const carrega = (u, srgb = true) => new Promise((ok) => loader.load(u, (t) => { if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = aniso; t.generateMipmaps = true; t.minFilter = THREE.LinearMipmapLinearFilter; ok(t); }));
const TEX = {};
const fontesOk = Promise.all([400, 600, 700, 800].map((w) => document.fonts.load(`${w} 40px Archivo`)));
const kraft = await carrega("assets/kraft.png");
const imgCarrega = (u) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.src = u; });
const M = await (await fetch("tex2/mapa.json")).json();

const NOMES = ["menu_repro","menuMod","pl_vp","pl0","pd0","pb0","pb1","pb_fr","pb2","pd1","ps2","ps_lote"];

// DoF barato: viés de mip por fragmento (distância ao foco) e/ou fixo, mais ilha de luz (escurece as bordas da mesa)
const foco = { dist: 40 };
function comDof(mat, { mesa = false } = {}) {
  const uni = { uBias: { value: 0 }, uFoco: foco, uK: { value: mesa ? 0.16 : 0 } };
  mat.userData.uni = uni;
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, { uBias: uni.uBias, uFoco: { get value() { return foco.dist; } }, uK: uni.uK });
    sh.vertexShader = sh.vertexShader.replace("#include <common>", "#include <common>\nvarying vec3 vWP;").replace("#include <begin_vertex>", "#include <begin_vertex>\nvWP=(modelMatrix*vec4(transformed,1.0)).xyz;");
    sh.fragmentShader = sh.fragmentShader.replace("#include <common>", "#include <common>\nvarying vec3 vWP; uniform float uBias; uniform float uFoco; uniform float uK;")
      .replace("#include <map_fragment>", `
        float bias = uBias + clamp(abs(length(vViewPosition) - uFoco) * uK - 0.6, 0.0, 3.5);
        vec4 sampledDiffuseColor = texture2D( map, vMapUv, bias ); diffuseColor *= sampledDiffuseColor;
        ${mesa ? "float rr = length(vWP.xz * vec2(0.9,0.62)) / 24.0; diffuseColor.rgb *= mix(vec3(1.0), vec3(0.20,0.15,0.10), smoothstep(0.18, 0.85, rr));" : ""}`);
  };
  return mat;
}

// ---------- mesa kraft ----------

function retRedondo(w, h, r) { const s = new THREE.Shape(), x = -w / 2, y = -h / 2; s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.absarc(x + w - r, y + r, r, -Math.PI / 2, 0); s.lineTo(x + w, y + h - r); s.absarc(x + w - r, y + h - r, r, 0, Math.PI / 2); s.lineTo(x + r, y + h); s.absarc(x + r, y + h - r, r, Math.PI / 2, Math.PI); s.lineTo(x, y + r); s.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5); return s; }
const bs = 0.14, bt = 0.14;
const corpoGeo = new THREE.ExtrudeGeometry(retRedondo(PW - 2 * bs, PL - 2 * bs, 1.05), { depth: PT - 2 * bt, bevelEnabled: true, bevelThickness: bt, bevelSize: bs, bevelSegments: 5, curveSegments: 28 });

// ilha das câmeras (visto de trás: canto superior esquerdo = +x local)

const placaIlha = new THREE.Mesh(new THREE.ExtrudeGeometry(retRedondo(3.1, 3.1, 0.7), { depth: 0.08, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.04, bevelSegments: 3, curveSegments: 16 }), new THREE.MeshStandardMaterial({ color: 0x0c1118, roughness: 0.3, metalness: 0.7 })); placaIlha.castShadow = true; ilha.add(placaIlha);
const lente = (x, y) => { const g = new THREE.Group(); g.position.set(x, y, 0.1);
  const aro = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.075, 16, 40), new THREE.MeshStandardMaterial({ color: 0xb9bcc4, metalness: 1, roughness: 0.2 })); aro.position.z = 0.05; g.add(aro);
  const cil = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.1, 40), new THREE.MeshStandardMaterial({ color: 0x03060c, roughness: 0.05, metalness: 0.6 })); cil.rotation.x = Math.PI / 2; cil.position.z = 0.03; g.add(cil);
  const iris = new THREE.Mesh(new THREE.CircleGeometry(0.27, 32), new THREE.MeshStandardMaterial({ color: 0x1b3a8c, emissive: 0x0b1840, roughness: 0.05, metalness: 0.2 })); iris.position.z = 0.09; g.add(iris);
  const brilho = new THREE.Mesh(new THREE.CircleGeometry(0.07, 16), new THREE.MeshBasicMaterial({ color: 0xffffff })); brilho.position.set(-0.12, 0.12, 0.095); g.add(brilho); return g; };
ilha.add(lente(-0.7, 0.72), lente(-0.7, -0.72), lente(0.72, 0));
const flash = new THREE.Mesh(new THREE.CircleGeometry(0.16, 20), new THREE.MeshBasicMaterial({ color: 0xffe9b0 })); flash.position.set(0.8, 1.05, 0.092); ilha.add(flash);
phone.add(ilha);
// botões laterais
const botao = (y, h) => { const m = new THREE.Mesh(new THREE.BoxGeometry(0.14, h, 0.3), new THREE.MeshStandardMaterial({ color: 0x8a8d96, metalness: 1, roughness: 0.3 })); m.position.set(PW / 2 + 0.03, y, 0); phone.add(m); };
botao(3.0, 1.5); botao(-0.5, 1.0); botao(0.9, 1.0);
// tela: alphaMap com cantos arredondados
const aCan = document.createElement("canvas"); aCan.width = 780; aCan.height = Math.round(780 * SH / SW); { const c = aCan.getContext("2d"); c.fillStyle = "#000"; c.fillRect(0, 0, aCan.width, aCan.height); c.fillStyle = "#fff"; const r = 0.62 / SW * aCan.width; c.beginPath(); c.roundRect(0, 0, aCan.width, aCan.height, r); c.fill(); }
const alfa = new THREE.CanvasTexture(aCan);
const telaZ = PT / 2 + 0.004;
const mkTela = (tex, dz, ordem) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(SW, SH), new THREE.MeshBasicMaterial({ map: tex, alphaMap: alfa, transparent: true, opacity: 1, depthWrite: false })); m.position.z = telaZ + dz; m.renderOrder = ordem; phone.add(m); return m; };

const SC = document.createElement("canvas"); SC.width = 1170; SC.height = 2532; const sg = SC.getContext("2d");
const scTex = new THREE.CanvasTexture(SC); scTex.colorSpace = THREE.SRGBColorSpace; scTex.anisotropy = aniso; scTex.generateMipmaps = true; scTex.minFilter = THREE.LinearMipmapLinearFilter; scTex.magFilter = THREE.LinearFilter;
const tAg = mkTela(scTex, 0, 2);
// reflexo do vidro: faixa diagonal suave
const rCan = document.createElement("canvas"); rCan.width = 256; rCan.height = 512; { const c = rCan.getContext("2d"); const g = c.createLinearGradient(0, 0, 256, 512); g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(0.36, "rgba(255,255,255,0)"); g.addColorStop(0.46, "rgba(255,244,225,.55)"); g.addColorStop(0.53, "rgba(255,244,225,.10)"); g.addColorStop(0.60, "rgba(255,255,255,.28)"); g.addColorStop(0.7, "rgba(255,255,255,0)"); g.addColorStop(1, "rgba(255,255,255,0)"); c.fillStyle = g; c.fillRect(0, 0, 256, 512); }
const rTex = new THREE.CanvasTexture(rCan); rTex.wrapS = rTex.wrapT = THREE.RepeatWrapping; rTex.colorSpace = THREE.SRGBColorSpace;
const reflexo = new THREE.Mesh(planoRedondo(SW, SH, 0.62), new THREE.MeshBasicMaterial({ map: rTex, transparent: true, opacity: 0.20, blending: THREE.AdditiveBlending, depthWrite: false })); reflexo.position.z = telaZ + 0.012; reflexo.renderOrder = 5;
{ const g = reflexo.geometry; const p = g.attributes.position, uv = new Float32Array(p.count * 2); for (let i = 0; i < p.count; i++) { uv[2 * i] = p.getX(i) / SW + 0.5; uv[2 * i + 1] = p.getY(i) / SH + 0.5; } g.setAttribute("uv", new THREE.BufferAttribute(uv, 2)); }
phone.add(reflexo);
// furo da câmera frontal
const furo = new THREE.Mesh(new THREE.CircleGeometry(0.17, 24), new THREE.MeshBasicMaterial({ color: 0x000000 })); furo.position.set(0, SH / 2 - 0.42, telaZ + 0.016); furo.renderOrder = 6; phone.add(furo);


const laid = new THREE.Group(); laid.rotation.x = -Math.PI / 2; laid.add(phone);
const flip = new THREE.Group(); flip.add(laid);
const root = new THREE.Group(); root.add(flip); scene.add(root);
const Y0 = PT / 2; root.position.set(0, Y0, 0);
scene.updateMatrixWorld(true);
const cssP = (x, y) => new THREE.Vector3((x - 195) * U, (422 - y) * U, telaZ + 0.01);

// ===== roteiro do Ep. 3 (Baixa e aplicação do protocolo — Menu › Protocolos): instantes (voz real, beats_t3e3.json), estados da tela, navegador, câmera, legendas =====
const T_INI = 5.6, T_MENU_FIM = 6.5, T_FIM_FRONTAL = 62.5, T_VIRA = 62.5, T_SELO = B.pronto + 0.1, T_SELO_FIM = 62.5, T_FIM_TOTAL = 70.3, NAV_FIM = 59.6, T_ETQ_FIM = 59.7;

// páginas (capturas altas) por instante; a rolagem é global (SYK) e vale para a página que estiver no ar

const VISOES = [];

  [6.45, vw("menuMod", (m) => PROT_ITEM(m))], [11.85, pg("pl0", (m) => m.cards[0])], [19.45, pg("pd0", (m) => m.cards[1])],
  [27.55, pg("pb0", (m) => m.labels[6].check)], [37.12, pg("pb0", (m) => m.selects[0])], [37.95, pg("pb_fr", (m) => m.selects[0].opts[1])],
  [40.15, pg("ps2", (m) => m.selects[1])], [43.45, pg("pb2", (m) => m.btns[0])],
];

// navegador: waypoints (chegada, partida, alvo)
const WP = [
  { ta: 5.95, td: 5.95, puck: [350, 330] },
  { ta: 6.12, td: 6.55, spec: vw("menuMod", (m) => PROT_ITEM(m)), pad: 5 },
  { ta: 7.0, td: 8.1, spec: pg("pl0", (m) => m.pills[0]), pad: 4 },
  { ta: 8.45, td: 9.45, spec: pg("pl0", (m) => uniao(...m.cards[0].kids[0].spans)), pad: 4 },
  { ta: 9.55, td: 10.35, spec: pg("pl0", (m) => uniao(...m.cards[1].kids[0].spans)), pad: 4 },

  { ta: 11.45, td: 11.98, spec: pg("pl0", (m) => m.cards[0]), pad: 4 },

  { ta: 15.75, td: 16.3, spec: pg("pd0", (m) => m.cards[0].kids[0].spans[1]), pad: 4 },

  { ta: 17.85, td: 18.45, spec: pg("pd0", (m) => m.cards[1].kids.find((k) => /\d+\/\d+/.test(k.txt))), pad: 4 },
